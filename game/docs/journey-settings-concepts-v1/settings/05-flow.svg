<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="2400" viewBox="0 0 640 1200"><rect x="0" y="0" width="640" height="1200" rx="0" fill="#0e1d22" stroke="none"/><text x="32" y="50" fill="#e6e3d6" font-size="28" font-weight="600" text-anchor="start" font-family="Noto Sans CJK KR">설정 흐름</text><text x="32" y="82" fill="#c5b17e" font-size="17" font-weight="400" text-anchor="start" font-family="Noto Sans CJK KR">설정 안에서는 전투가 계속 멈춤</text><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#b7a474"/></marker></defs><rect x="45" y="130" width="210" height="70" rx="8" fill="#1c3238" stroke="#385054"/><text x="150.0" y="172.0" fill="#e6e3d6" font-size="20" font-weight="400" text-anchor="middle" font-family="Noto Sans CJK KR">전투</text><rect x="385" y="130" width="210" height="70" rx="8" fill="#1c3238" stroke="#385054"/><text x="490.0" y="172.0" fill="#e6e3d6" font-size="20" font-weight="400" text-anchor="middle" font-family="Noto Sans CJK KR">정지 메뉴</text><path d="M255 150L385 150" stroke="#b7a474" stroke-width="2" marker-end="url(#a)" fill="none"/><text x="289" y="140" fill="#a5b5b3" font-size="14" font-weight="400" text-anchor="start" font-family="Noto Sans CJK KR">멈춤</text><path d="M385 188L255 188" stroke="#b7a474" stroke-width="2" marker-end="url(#a)" fill="none"/><text x="282" y="216" fill="#a5b5b3" font-size="14" font-weight="400" text-anchor="start" font-family="Noto Sans CJK KR">계속하기</text><rect x="385" y="280" width="210" height="70" rx="8" fill="#1c3238" stroke="#385054"/><text x="490.0" y="322.0" fill="#e6e3d6" font-size="20" font-weight="400" text-anchor="middle" font-family="Noto Sans CJK KR">설정 첫 화면</text><path d="M490 200L490 280" stroke="#b7a474" stroke-width="2" marker-end="url(#a)" fill="none"/><text x="505" y="248" fill="#a5b5b3" font-size="14" font-weight="400" text-anchor="start" font-family="Noto Sans CJK KR">설정</text><rect x="45" y="280" width="210" height="70" rx="8" fill="#1c3238" stroke="#385054"/><text x="150.0" y="322.0" fill="#e6e3d6" font-size="20" font-weight="400" text-anchor="middle" font-family="Noto Sans CJK KR">휴식터 이동 확인</text><path d="M385 165L295 165" stroke="#b7a474" fill="none"/><path d="M295 165V315H255" stroke="#b7a474" stroke-width="2" marker-end="url(#a)" fill="none"/><text x="45" y="262" fill="#a5b5b3" font-size="14" font-weight="400" text-anchor="start" font-family="Noto Sans CJK KR">정지 → 휴식터로 가기</text><rect x="45" y="410" width="210" height="70" rx="8" fill="#1c3238" stroke="#385054"/><text x="150.0" y="452.0" fill="#e6e3d6" font-size="20" font-weight="400" text-anchor="middle" font-family="Noto Sans CJK KR">휴식터</text><path d="M150 350L150 410" stroke="#b7a474" stroke-width="2" marker-end="url(#a)" fill="none"/><text x="164" y="391" fill="#a5b5b3" font-size="14" font-weight="400" text-anchor="start" font-family="Noto Sans CJK KR">승인</text><text x="45" y="511" fill="#a5b5b3" font-size="15" font-weight="400" text-anchor="start" font-family="Noto Sans CJK KR">취소하면 정지 메뉴로</text><rect x="355" y="410" width="270" height="90" rx="8" fill="#1c3238" stroke="#385054"/><text x="490.0" y="444" fill="#e6e3d6" font-size="20" font-weight="400" text-anchor="middle" font-family="Noto Sans CJK KR">상세 설정</text><text x="490.0" y="469" fill="#a5b5b3" font-size="13" font-weight="400" text-anchor="middle" font-family="Noto Sans CJK KR">소리 / 화면 / 플레이 / 기록·관리</text><path d="M490 350L490 410" stroke="#b7a474" stroke-width="2" marker-end="url(#a)" fill="none"/><text x="505" y="392" fill="#a5b5b3" font-size="14" font-weight="400" text-anchor="start" font-family="Noto Sans CJK KR">범주 선택</text><text x="355" y="541" fill="#e6e3d6" font-size="17" font-weight="400" text-anchor="start" font-family="Noto Sans CJK KR">‹  한 단계 뒤로 → 설정</text><text x="355" y="576" fill="#e6e3d6" font-size="17" font-weight="400" text-anchor="start" font-family="Noto Sans CJK KR">×  설정 종료 → 정지</text><text x="355" y="608" fill="#a5b5b3" font-size="15" font-weight="400" text-anchor="start" font-family="Noto Sans CJK KR">배경 터치: 닫히지 않음</text><path d="M32 650L608 650" stroke="#385054" fill="none"/><text x="32" y="694" fill="#e6e3d6" font-size="23" font-weight="600" text-anchor="start" font-family="Noto Sans CJK KR">주의 기능은 별도 확인</text><rect x="32" y="727" width="576" height="65" rx="5" fill="#172a30" stroke="#385054"/><text x="50" y="754" fill="#e6e3d6" font-size="17" font-weight="400" text-anchor="start" font-family="Noto Sans CJK KR">기록 가져오기</text><text x="50" y="778" fill="#a5b5b3" font-size="14" font-weight="400" text-anchor="start" font-family="Noto Sans CJK KR">확인 → 파일 선택 → 타이틀</text><rect x="32" y="809" width="576" height="65" rx="5" fill="#172a30" stroke="#385054"/><text x="50" y="836" fill="#e6e3d6" font-size="17" font-weight="400" text-anchor="start" font-family="Noto Sans CJK KR">새 여정 시작</text><text x="50" y="860" fill="#a5b5b3" font-size="14" font-weight="400" text-anchor="start" font-family="Noto Sans CJK KR">초기화 확인 → 타이틀</text><rect x="32" y="891" width="576" height="65" rx="5" fill="#172a30" stroke="#385054"/><text x="50" y="918" fill="#e6e3d6" font-size="17" font-weight="400" text-anchor="start" font-family="Noto Sans CJK KR">검수 모드 전환</text><text x="50" y="942" fill="#a5b5b3" font-size="14" font-weight="400" text-anchor="start" font-family="Noto Sans CJK KR">일반 기록과 분리 → 휴식터</text><rect x="32" y="973" width="576" height="65" rx="5" fill="#172a30" stroke="#385054"/><text x="50" y="1000" fill="#e6e3d6" font-size="17" font-weight="400" text-anchor="start" font-family="Noto Sans CJK KR">다시 걷기</text><text x="50" y="1024" fill="#a5b5b3" font-size="14" font-weight="400" text-anchor="start" font-family="Noto Sans CJK KR">재시작 범위 선택(해당 시) → 확인 → 전투</text><text x="32" y="1092" fill="#c5b17e" font-size="17" font-weight="400" text-anchor="start" font-family="Noto Sans CJK KR">취소·오류는 이전 화면으로. 전투 재개 없음.</text><text x="32" y="1130" fill="#a5b5b3" font-size="15" font-weight="400" text-anchor="start" font-family="Noto Sans CJK KR">타이틀·휴식터에서 열었다면 닫을 때 그곳으로 복귀.</text></svg>