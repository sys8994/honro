<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1610 -4420 3670 4450">
<title>묵종: 용뉴와 음통, 두꺼운 청동벽 안의 빈 울림</title>
<desc>Original editable Korean Buddhist bell seen from below. Rounded bronze shoulders, low-relief lotus bosses, worn nonfigurative inscriptions and a continuous cast mouth with a deep underside. No anthropomorphic relief. Initial world anchor 7200,6610; the whole bell settles 200 units onto the authored stone supports.</desc>
