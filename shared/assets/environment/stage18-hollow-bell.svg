<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1610 -4420 3670 4450">
<title>묵종: 용뉴와 음통, 두꺼운 청동벽 안의 빈 울림</title>
<desc>Original editable Korean Buddhist bell seen from below. An unbroken rounded bronze exterior, dark underside cavity, continuous heavy mouth, dragon suspension crown and sound pipe. Initial world anchor 7200,6610; the whole bell settles 200 units onto the authored stone supports.</desc>
