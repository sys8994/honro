<title>Broken timber bridge abutment</title>
<desc>A connected outdoor bridge remnant on a stone pier. Heavy horizontal and diagonal members, snapped eastern ends and two sloping braces expose the valley beyond. Ground datum at pier foot; visual only, never a substitute for traversable stage terrain.</desc>
