<svg xmlns="http://www.w3.org/2000/svg" viewBox="-640 -354 1300 378">
<title>Mountain village refuge courtyard</title>
<desc>An inhabited low hanok joined to a roofed open shelter, with one warm window, a broad side wall and continuous stone foundation. The asymmetrical roof lengths make a sheltered court rather than a row of isolated houses. Foot datum zero.</desc>
