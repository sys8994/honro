<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1040 -1660 2100 1840">
<title>Hilltop guardian tree</title>
<desc>A single ancient tree rooted on the central hill. Pale bark, four asymmetric ink-wash crowns and a few faded prayer strips suggest a watchful presence. Playable branches are drawn from the existing terrain polygons, never inferred from this decorative vector.</desc>
