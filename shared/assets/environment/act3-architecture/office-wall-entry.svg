<title>Draft Korean office precinct: tiled earthen wall and raised entry roof</title>
<desc>Inactive editable side-view art study. Broad plaster planes and lower stone courses surround a timber entry. The central walk-through remains transparent. No building name, record, crest, collision or campaign placement is assigned.</desc>
