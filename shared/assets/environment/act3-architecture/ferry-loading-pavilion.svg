<title>나루의 하역 정자</title>
<desc>A low covered landing with a weatherboard shelter, open cargo berth and a quiet shaded lantern. The hoist is rear artwork. Four stone footings require river-bed or bank contact; no water, cargo clue or traversal mechanic is embedded.</desc>
