<svg xmlns="http://www.w3.org/2000/svg" viewBox="-680 -435 1370 463">
<title>Ruined ceremonial gate and empty side court</title>
<desc>An old Korean ritual court with one intact raised gate roof, a broken eastern eave, connected low earth wall and a roofless corridor. Broad fallen masonry grounds the whole structure. Open passage and missing wall sections leave negative space.</desc>
