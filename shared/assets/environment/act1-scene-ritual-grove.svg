<svg xmlns="http://www.w3.org/2000/svg" viewBox="-480 -690 950 708">
<title>Silent ritual grove</title>
<desc>A weathered sacred tree, leaning pine and joined root bank. One muted red cord connects the trunks without replacing live ritual objects. Broad sparse crowns and cut bark planes remain readable at tactical zoom. Ground datum zero.</desc>
