<svg xmlns="http://www.w3.org/2000/svg" viewBox="-670 -506 1340 538">
<title>Open mountain ritual hall and receiving court</title>
<desc>An outdoor Korean ceremonial hall with an open central bay, a deep asymmetric hip-and-gable roof, attached low side corridor, broad stone plinth and a restrained stone offering table. Major material planes remain readable at maximum tactical zoom. The ground attachment is at the front foundation datum zero.</desc>
