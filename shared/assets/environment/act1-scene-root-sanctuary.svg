<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1100 -2760 2200 2800">
<title>The great root sanctuary</title>
<desc>A towering old Korean sacred tree forms the vertical village landmark. One sculpted trunk, four immense limbs, sparse uneven crown masses and three timber shelters nestled in supporting roots. Shelters are visual context, not live rescue targets. The shared root datum is zero; authored height approximately forty five metres.</desc>
