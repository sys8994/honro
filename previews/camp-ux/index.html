const params=new URLSearchParams(location.search);const view=params.get('view')||(innerWidth<=700?'mobile':innerHeight<500?'landscape':'');const mobile=view==='mobile';document.body.className=mobile?'mobile':view==='desktop'?'desktop-proof':view==='landscape'?'landscape':'';let hero='mage',branch=0,selected='M02',targetSlot=1,sp=4;const ranks={},loadouts={mage:['M01','M06','M03','M07'],archer:['A01','A14','A11','A05'],knight:['S00','S03','S01','S06'],occultist:['O01','O02','O06','O11']};for(const s of Object.values(DATA.skills))if(!s.basic)ranks[s.id]=s.row===0?3:s.row===1?2:s.row===2?1:s.row===3?1:0;
const concise={M06:'폭발 뒤 불꽃 파편 · 같은 적 최대 2회',M02:'튕긴 뒤 재입력 폭발 · 적 1턴 감속',M04:'폭발점 주변 적마다 벽 너머 번개 1회',M13:'첫 폭발 뒤 연쇄 폭발 · 같은 적 최대 3회',M05:'착탄 0.35초 뒤 천뢰 · 상부 지형에 차폐'};
const $=x=>document.getElementById(x),sdata=id=>DATA.skills[id],summary=id=>concise[id]||sdata(id).note.split('。')[0].split('. ')[0],stamp=id=>'<span class="stamp '+(id==='M06'?'warm':'')+'">'+sdata(id).icon+'</span>',rank=id=>ranks[id]||0,cost=id=>sdata(id).growth?.[Math.max(1,rank(id))]?.find(x=>x.label==='MP')?.value||'0',notify=t=>{$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200)};
function render(){ $('sp').textContent=sp;$('heroes').innerHTML=Object.entries(DATA.hero).map(([id,h])=>`<button class="hero ${id===hero?'active':''}" onclick="chooseHero('${id}')" aria-pressed="${id===hero}"><img class="portrait" src="${DATA.portraits[id]}" alt=""><span><strong>${h.name}</strong><small>${h.job} · Lv.12</small></span><span class="hero-sp">${id===hero?sp:2} SP</span></button>`).join('');$('slots').innerHTML=loadouts[hero].map((id,i)=>`<button class="slot ${i===0?'fixed':''} ${targetSlot===i?'target':''}" onclick="chooseSlot(${i})" aria-label="${i===0?'고정 기본기':i+'번 출전 슬롯'} ${sdata(id).name}"><span class="slot-num">${i===0?'고정':i}</span>${stamp(id)}<span><strong>${sdata(id).name}</strong><small>${i===0?'기본기':'Lv.'+rank(id)}</small></span></button>`).join('');$('filters').innerHTML=DATA.branches[hero].map((b,i)=>`<button class="filter ${branch===i?'on':''}" onclick="chooseBranch(${i})" aria-pressed="${branch===i}">${b.name}</button>`).join('');const filtered=Object.values(DATA.skills).filter(s=>s.cls===hero&&s.branch===branch);$('skills').innerHTML=filtered.map(s=>`<button class="skill ${s.id===selected?'selected':''} ${rank(s.id)===0?'locked':''}" onclick="chooseSkill('${s.id}')" aria-label="${s.name} 상세 보기">${stamp(s.id)}<span class="skill-copy"><span class="skill-name">${s.name}${loadouts[hero].includes(s.id)?'<span class="equipped">장착 중</span>':''}</span><p>${summary(s.id)}</p></span><span class="skill-meta"><b>${rank(s.id)>0?'Lv.'+rank(s.id)+' / 8':'미습득'}</b><small>${s.passive?'자동 적용':'기력 '+cost(s.id)}</small></span></button>`).join('');$('passives').innerHTML=Object.values(DATA.skills).filter(s=>s.cls===hero&&s.passive).slice(0,3).map(s=>`<button onclick="chooseSkill('${s.id}')">${s.name}<b>Lv.${rank(s.id)}</b></button>`).join('');renderDetail();}
function chooseHero(id){hero=id;branch=0;selected=Object.values(DATA.skills).find(s=>s.cls===id&&s.branch===0).id;targetSlot=1;closeDetail();render()}
function chooseBranch(i){branch=i;render()}
function chooseSlot(i){if(!i){notify('기본기는 항상 사용할 수 있습니다.');return}targetSlot=i;$('list-hint').textContent=i+'번 슬롯에 넣을 기예 선택';render()}
function chooseSkill(id){selected=id;render();if(mobile)$('detail').classList.add('open')}
function closeDetail(){$('detail').classList.remove('open')}
function changeRank(delta){if(sp-delta<0||rank(selected)+delta<0||rank(selected)+delta>8)return;if(delta<0&&rank(selected)===1&&loadouts[hero].includes(selected)){notify('장착을 해제한 뒤 마지막 SP를 회수하세요.');return}ranks[selected]=rank(selected)+delta;sp-=delta;render();if(mobile)$('detail').classList.add('open')}
function renderDetail(){const s=sdata(selected),r=rank(selected),next=Math.min(8,r+1);const rows=s.growth?.[Math.max(1,r)]||[];const later=s.growth?.[next]||rows;const picks=rows.filter(x=>['기본 피해','MP','얼음 파편','감속'].includes(x.label));const showRows=picks.length?picks:rows.slice(0,4);$('detail').innerHTML=`<button class="close-detail" onclick="closeDetail()" aria-label="상세 닫기">✕</button><div class="detail-controls"><div class="detail-top">${stamp(selected)}<div><small>${DATA.branches[hero][s.branch]?.name||'기본기'} · ${s.passive?'패시브':'액티브'}</small><h2>${s.name}</h2></div><div class="detail-rank">Lv.${r}<small>/ 8 경지</small></div></div><div class="actions"><button onclick="changeRank(-1)" ${r?'':'disabled'}>−1 SP 회수</button><button onclick="changeRank(1)" ${sp&&r<8?'':'disabled'}>+1 SP 수련</button>${s.passive?'':`<button class="equip" onclick="showCompare()" ${r?'':'disabled'}>${loadouts[hero].includes(selected)?'장착 위치 변경':'장착하기'}</button>`}</div></div><p class="description">${s.note}</p>${s.passive?'<div class="passives" style="margin-top:20px;border:1px solid #414b3a;border-radius:4px;color:#b6c6a6">습득 즉시 자동 적용됩니다.<br><small>출전 슬롯을 사용하지 않습니다.</small></div>':preview()}<div class="effect-table"><div class="effect-row table-head"><span>수련 효과</span><b>현재 Lv.${r}</b><i></i><b>다음 Lv.${next}</b></div>${showRows.map(row=>`<div class="effect-row"><span>${row.label==='MP'?'기력 소모':row.label}</span><b>${r?row.value:'—'}</b><i>→</i><b class="next">${later.find(x=>x.label===row.label)?.value||row.value}</b></div>`).join('')}</div>`}
function preview(){return `<div class="preview"><span class="demo-label">정적 예시</span><svg viewBox="0 0 500 160" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="glow"><stop stop-color="#c0d8d2" stop-opacity=".4"/><stop offset="1" stop-color="#7bb2a0" stop-opacity="0"/></radialGradient></defs><path d="M0 125L50 120 89 123 143 112 181 116 239 107 283 115 336 108 382 119 440 109 500 113V160H0Z" fill="#333d31"/><path d="M0 126L50 121 89 124 143 113 181 117 239 108 283 116 336 109 382 120 440 110 500 114" fill="none" stroke="#64715b" stroke-width="1"/><path d="M0 96L60 61 88 75 132 26 175 69 213 54 268 85 310 38 369 72 400 48 465 85 500 70V127H0Z" fill="#26342d" opacity=".45"/><ellipse cx="339" cy="99" rx="79" ry="62" fill="url(#glow)"/><path d="M92 98Q155 12 233 59T338 104" fill="none" stroke="#a8c9bd" stroke-dasharray="3 7" stroke-width="1.5"/><circle cx="236" cy="61" r="7" fill="#b3c3b8" stroke="#6c8374" stroke-width="2"/><path d="M227 61l6-5m1 13 7-4" stroke="#eceddd" stroke-width="1"/><path d="M334 67l7 22 22-8-14 18 14 16-23-7-9 22 1-26-25 2 23-14Z" fill="#bed5cd" fill-opacity=".25" stroke="#b5cfc3" stroke-width=".8"/><g fill="#96b9ab"><path d="M305 71l9 4-8 7Z"/><path d="M373 92l8 6-8 4Z"/><path d="M362 58l-3 10-5-6Z"/><path d="M304 116l8-4-1 10Z"/></g><g fill="#8c9a83" stroke="#2d3d30" stroke-width="2"><circle cx="84" cy="87" r="6"/><path d="M77 93h14l5 21H74Z"/><path d="M79 111l-3 14m12-14 5 14M93 96l8-7" fill="none" stroke="#8c9a83" stroke-width="3"/></g><g fill="#666e5e"><circle cx="350" cy="94" r="5"/><path d="M344 99h12l5 19h-21ZM344 116l-3 10m13-10 4 10"/></g><text x="353" y="61" fill="#b8cec0" font-size="10" font-family="sans-serif">감속</text></svg><button class="replay" onclick="notify('정적 예시입니다.')">↻</button></div>`}
function showCompare(){if(!rank(selected))return;const old=loadouts[hero][targetSlot];if(old===selected){notify('이미 이 슬롯에 장착되어 있습니다. 다른 슬롯을 선택하세요.');return}const existing=loadouts[hero].indexOf(selected);$('overlay').innerHTML=`<div class="compare"><div class="eyebrow">${targetSlot}번 슬롯</div><h2>기예 교체</h2><div class="compare-cards"><div class="compare-card"><small>현재 장착</small><div class="card-name">${stamp(old)}<strong>${sdata(old).name}</strong></div><p>${summary(old)}</p><div class="cost">Lv.${rank(old)} · 기력 ${cost(old)}</div></div><div class="compare-arrow">→</div><div class="compare-card new"><small>교체할 기예</small><div class="card-name">${stamp(selected)}<strong>${sdata(selected).name}</strong></div><p>${summary(selected)}</p><div class="cost">Lv.${rank(selected)} · 기력 ${cost(selected)}</div></div></div><div class="compare-note">${existing>0?existing+'번 슬롯에 있던 기예와 자리를 바꿉니다.':''}</div><div class="compare-actions"><button class="quiet-btn" onclick="hideCompare()">취소</button><button class="primary" onclick="confirmEquip()">${targetSlot}번 슬롯에 장착</button></div></div>`;$('overlay').classList.add('open')}
function hideCompare(){$('overlay').classList.remove('open')}
function confirmEquip(){const old=loadouts[hero][targetSlot],other=loadouts[hero].indexOf(selected);if(other>0)loadouts[hero][other]=old;loadouts[hero][targetSlot]=selected;hideCompare();closeDetail();render();notify(sdata(selected).name+' · '+targetSlot+'번 슬롯에 장착했습니다.')}
function resetMock(){location.href=location.pathname+'?view='+(mobile?'mobile':'desktop')}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){hideCompare();closeDetail()}});$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))hideCompare()});render();if(params.get('state')==='detail')chooseSkill('M02');if(params.get('state')==='replace')showCompare();
</script></body></html>
