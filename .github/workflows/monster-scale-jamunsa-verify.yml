name: Verify Jamunsa awakened scale variant
on:
  push:
    branches: ['qa/monster-scale-jamunsa-20261124-*']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    env:
      HONRO_ACT4_RELEASE: '1'
      SOURCE_REF: 46f3f33f14ea533893de4a957225b180b71c89c0
      OUT: _local/reports/monster-scale-jamunsa
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 8
      - name: Use reviewed source, without verification-only files
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/monster-scale-jamunsa"
          cp -r .github/monster-scale-jamunsa/. "$RUNNER_TEMP/monster-scale-jamunsa/"
          git switch --detach "$SOURCE_REF"
          test "$(git rev-parse HEAD)" = "$SOURCE_REF"
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile production bundle
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          npm ci
          npm ci --prefix game
          npm --prefix game run typecheck | tee "$OUT/typecheck.log"
          cp web/manifest.json "$RUNNER_TEMP/monster-scale-jamunsa/published-base.json"
          node tools/release/register-current-publication.mjs --source-manifest "$RUNNER_TEMP/monster-scale-jamunsa/published-base.json" --expected-blob-sha 99f75600c1fb6c662f8c23b38390cd1cfbb3bb96 --source-sha bde5c1e807896069152d4d580379f8a0939474cc --published-at 2026-11-24T02:26:10Z --evidence https://github.com/sys8994/honro/actions/runs/45312124833 | tee "$OUT/retention.log"
          npm run build | tee "$OUT/build.log"
          printf '%s\n' "$SOURCE_REF" > "$OUT/exact-source.txt"
          sha256sum web/manifest.json HONRO.html > "$OUT/compiled-hashes.txt"
      - name: Validate actual Jamunsa growth and existing Continue
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/monster-scale-jamunsa/run.sh" 2>&1 | tee "$OUT/pilot-gates.log"
      - name: Create verified scoped build branch
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          paths=set(subprocess.check_output(['git','diff','HEAD','--name-only','-z']).decode().split('\0'))|set(subprocess.check_output(['git','ls-files','--others','--exclude-standard','-z']).decode().split('\0'))
          roots={'HONRO.html','HONRO_WORKSHOP.html','index.html','workshop/HONRO_MAP_WORKSHOP.html'}
          asset='shared/assets/actors/actors.runtime.js'
          if asset in paths:
              import re
              from pathlib import Path
              old=subprocess.check_output(['git','show','HEAD:'+asset]).decode()
              new=Path(asset).read_text()
              match=r'"sourceSha256":"[0-9a-f]{64}"'
              assert len(re.findall(match,old))==len(re.findall(match,new))==1
              assert re.sub(match,'SOURCE_FINGERPRINT',old)==re.sub(match,'SOURCE_FINGERPRINT',new),'unrelated actor artwork changed'
              roots.add(asset)
          unexpected=sorted(p for p in paths if p and p not in roots and not p.startswith('web/'))
          assert not unexpected, unexpected
          PY
          git add -- HONRO.html HONRO_WORKSHOP.html index.html workshop/HONRO_MAP_WORKSHOP.html shared/assets/actors/actors.runtime.js web
          git diff --cached --check
          git config user.name 'HONRO release verification'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Build isolated Jamunsa growth variant"
          target="repair/monster-scale-jamunsa-generated-${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/$target"
          expected="$(git rev-parse HEAD)"
          actual="$(git ls-remote origin "refs/heads/$target" | cut -f1)"
          test "$actual" = "$expected"
          printf '%s\n' "$expected" > "$OUT/generated-head.txt"
          printf '%s\n' "$target" > "$OUT/generated-branch.txt"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: monster-scale-jamunsa-${{ github.run_id }}
          path: _local/reports/monster-scale-jamunsa/
          retention-days: 7
