name: Observe exact Stage31 late save after menu locator fix
on:
  push:
    branches: ['work/stage31-late-functional/**']
permissions:
  contents: read
jobs:
  stage31-late:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OUT: _local/reports/stage31-late-functional
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Unchanged product preview only
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          npm ci
          npm ci --prefix game
          HONRO_ACT4_RELEASE=1 node workshop/build.mjs | tee "$OUT/preview-build.log"
          sha256sum HONRO.html web/manifest.json > "$OUT/preview-sha256.txt"
          python -m pip install 'playwright==1.58.0'
          python -m playwright install --with-deps chromium
      - name: Exact prior save normal last enemy and boarding, no timing acceptance
        run: |
          set -euo pipefail
          python -m http.server 8870 --bind 127.0.0.1 > "$OUT/server.log" 2>&1 &
          server=$!; trap 'kill "$server" 2>/dev/null || true' EXIT
          sleep 2
          HONRO_CAPTURE_URL=http://127.0.0.1:8870/HONRO.html HONRO_CAPTURE_OUT="$OUT/browser" python tools/stage40-qa/stage31-late-functional.py > "$OUT/browser.log" 2>&1
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: stage31-late-functional-${{ github.sha }}
          path: _local/reports/stage31-late-functional/
          retention-days: 7
