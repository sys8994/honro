name: Stage32 bodyguard remaining views visual audit
on:
  workflow_dispatch:
  push:
    branches: [inspect/stage32-scanline-20261118]
    paths:
      - tests/stage32-bodyguard-audit-*
      - tests/fixtures/stage32-bodyguard-audit-*
      - .github/workflows/stage32-bodyguard-audit.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci && npm ci --prefix game
      - name: Fixed EFE candidate and unchanged production
        run: |
          node tests/stage32-registered-empty-native-contract.mjs
          node tests/stage32-bodyguard-static-contract.mjs
      - name: Ten paired actual Scene views without benchmarks
        run: HONRO_ACT4_RELEASE=1 node tests/stage32-bodyguard-audit-fixture.mjs "$RUNNER_TEMP/audit-input"
      - name: Capture every view even if an earlier extraction fails
        run: |
          browser=$(command -v google-chrome || command -v chromium)
          failed=0
          for view in lower portrait-bottom landscape-overview landscape-bottom desktop-walk native-tile-below native-tile-above renderer-below renderer-above maximum; do
            for variant in candidate ss2; do
              probe="$RUNNER_TEMP/audit-evidence/probes/$variant-$view"
              if timeout 150s node tests/stage32-registered-one-probe.mjs "$browser" "$RUNNER_TEMP/audit-profile-$variant-$view" "$RUNNER_TEMP/audit-input/stage32-$variant-$view.html" "$probe"; then
                node tests/stage32-bodyguard-audit-result.mjs "$probe/result.html" "$RUNNER_TEMP/audit-evidence" "$variant" "$view" || failed=1
              else
                failed=1
              fi
            done
          done
          exit "$failed"
      - name: Preserve strict original raw protection verdicts
        if: ${{ !cancelled() }}
        run: node tests/stage32-bodyguard-audit-compare.mjs "$RUNNER_TEMP/audit-evidence"
      - name: Independent neighboring-zoom visual difference report
        if: ${{ !cancelled() }}
        run: node tests/stage32-bodyguard-audit-zoom.mjs "$RUNNER_TEMP/audit-evidence"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: stage32-bodyguard-audit
          path: ${{ runner.temp }}/audit-evidence
          if-no-files-found: warn
