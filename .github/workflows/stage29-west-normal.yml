name: HONRO Stage29 west exact normal A/B proof only
on:
  push:
    branches: [qa/stage29-west-normal-small-31537b]
    paths:
      - .github/workflows/stage29-west-normal.yml
      - tools/stage29-west-normal/**
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'sys8994/honro' && github.event_name == 'push' && github.ref == 'refs/heads/qa/stage29-west-normal-small-31537b'
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
      - name: Exact stock and one signed source build, preserve all maps/assets
        shell: bash
        run: |
          set -euo pipefail
          test -z "${GITHUB_TOKEN:-}${GH_TOKEN:-}"
          W="$RUNNER_TEMP/honro-stage29-west"
          mkdir "$W" "$W/out"
          echo "WORK=$W" >> "$GITHUB_ENV"
          Q="$GITHUB_WORKSPACE/tools/stage29-west-normal"
          python3 "$Q/guard.py" pre "$W"
          (
            cd "$W/B"
            npm ci >"$W/out/npm-root.log" 2>&1
            npm ci --prefix game >"$W/out/npm-game.log" 2>&1
            npm run build >"$W/out/build.log" 2>&1
            npm run test:production-contract >"$W/out/production-contract.log" 2>&1
          )
          python3 "$Q/guard.py" built "$W"
      - name: Actual Chrome two matched directions PC and mobile only
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          test -z "${GITHUB_TOKEN:-}${GH_TOKEN:-}"
          Q="$GITHUB_WORKSPACE/tools/stage29-west-normal"
          python3 -m venv "$WORK/venv"
          V="$WORK/venv/bin/python"
          "$V" -m pip --disable-pip-version-check install playwright==1.62.0 Pillow==13.0.0
          "$V" -m playwright install --with-deps chromium
          python3 -m http.server 18891 --bind 127.0.0.1 --directory "$WORK/A" >"$WORK/out/http-A.log" 2>&1 &
          a=$!
          python3 -m http.server 18892 --bind 127.0.0.1 --directory "$WORK/B" >"$WORK/out/http-B.log" 2>&1 &
          b=$!
          trap 'kill "$a" "$b" 2>/dev/null || true' EXIT
          for p in 18891 18892; do curl -fsS --retry 8 --retry-connrefused "http://127.0.0.1:$p/HONRO.html" -o /dev/null; done
          "$V" "$Q/capture.py" "$WORK"
      - name: Seal complete B evidence as pending-art or QA-only HOLD, never deploy
        if: always() && env.WORK != ''
        run: python3 "$GITHUB_WORKSPACE/tools/stage29-west-normal/guard.py" archive "$WORK"
      - if: always() && env.WORK != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: honro-stage29-west-normal-ab-no-deploy
          path: ${{ env.WORK }}/out/
          retention-days: 7
          if-no-files-found: error
