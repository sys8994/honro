name: Stage15 exact R3 scoped retained bundle (no deployment)
on:
  push:
    branches: [qa/stage15-retained-r3-2939958-20261121]
permissions:
  contents: read
  actions: read
jobs:
  retain-stage15-r3:
    if: github.repository == 'sys8994/honro' && github.event_name == 'push' && github.ref == 'refs/heads/qa/stage15-retained-r3-2939958-20261121'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22.23.5'
      - name: Bind exact official scoped native artifact and manufacture retained local delta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          Q="$GITHUB_WORKSPACE/tools/stage15-retained-r3"
          W="$RUNNER_TEMP/stage15-retained-r3"
          mkdir -- "$W"
          python "$Q/retain.py" authority "$GITHUB_WORKSPACE" "$W"
          unset GH_TOKEN GITHUB_TOKEN
          export CI=true
          python "$Q/retain.py" assemble "$GITHUB_WORKSPACE" "$W"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage15-retained-r3-source-and-generated-delta-no-deploy
          path: |
            ${{ runner.temp }}/stage15-retained-r3/RETAINED-DELTA-RECEIPT.json
            ${{ runner.temp }}/stage15-retained-r3/stage15-r3-source-and-retained-web-delta.zip
            ${{ runner.temp }}/stage15-retained-r3/SHA256SUMS
            ${{ runner.temp }}/stage15-retained-r3/scoped-authority.json
            ${{ runner.temp }}/stage15-retained-r3/verified-normal-graph.json
            ${{ runner.temp }}/stage15-retained-r3/normal-build.log
            ${{ runner.temp }}/stage15-retained-r3/retainer-output.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
