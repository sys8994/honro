name: Act2 traced terrain integration and gated QA
on:
  push:
    branches: ['work/act2-art-integrate/**']
permissions:
  contents: write
jobs:
  art-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      OUT: _local/reports/act2-art-release
      HONRO_QA_ORIGIN: http://127.0.0.1:8870
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Native invariants and unchanged natural-save regressions
        run: |
          npm ci
          npm ci --prefix game
          python -m pip install 'playwright==1.58.0'
          python -m playwright install --with-deps chromium
          node tests/stage8-staging-reader-regression.mjs
          node tests/act2-reserved-body-settle.mjs
          node tests/act2-retained-interaction-regression.mjs > /tmp/retained-interaction-native.log
          node tests/act23-v4-act2-scenes.mjs
          node tests/act23-v4-reviewed17.mjs
          node tests/act23-v4-stage18.mjs
          node tests/act1-local-art-save.mjs
          node tests/act2-local-art-save.mjs
          HONRO_ACT2_ART_CANDIDATES=0 node tests/stage11-art-candidate.mjs
          HONRO_ACT2_ART_CANDIDATES=0 node tests/stage12-traced-art.mjs
          HONRO_ACT2_ART_CANDIDATES=0 node tools/act2-vector-production/test-stage13-candidate.mjs
          HONRO_ACT2_ART_CANDIDATES=0 node tests/stage14-traced-art.mjs
          HONRO_ACT2_ART_CANDIDATES=0 node tests/act2-stage15-candidate.mjs
          node tests/act2-traced-art-integrated.mjs
          python tools/act4-ci/test_precise_aim.py
          python tools/act4-ci/test_stage31_survival.py
      - name: Retain published graphs and prepare unpublished gate preview
        env:
          HONRO_ACT4_RELEASE: '1'
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          mapfile -t refs < <(node --input-type=module -e 'import fs from "node:fs";import {selectPublishedGenerations} from "./shared/web-retention.mjs";for(const g of selectPublishedGenerations(JSON.parse(fs.readFileSync("web/manifest.json")).publishedGenerations,{now:Date.now()})){if(!/^[a-f0-9]{40}$/.test(g.sourceSha))throw Error("Invalid ref");console.log(g.sourceSha)}')
          git fetch --no-tags --depth=1 origin ad56f6d7a4c6f6339f6c0f2ceb792c3ddff711fd "${refs[@]}"
          node tools/release/retain-published-web.mjs ad56f6d7a4c6f6339f6c0f2ceb792c3ddff711fd --published-at 2026-11-02T16:50:50Z --evidence https://github.com/sys8994/honro/actions/runs/41484988179
          node tools/act4-ci/refresh-stage31-probes.mjs prepare "$OUT"
          # Established evidence-only bootstrap; never publish this preview.
          node workshop/build.mjs | tee "$OUT/preview-build.log"
          sha256sum HONRO.html web/manifest.json > "$OUT/preview-served-sha256.txt"
      - name: Unchanged Stage31 fresh first-shot trials and normal-input objective
        run: |
          set -euo pipefail
          python -m http.server 8870 --bind 127.0.0.1 > "$OUT/server.log" 2>&1 &
          server=$!; trap 'kill "$server" 2>/dev/null || true' EXIT
          sleep 2
          for trial in 1 2 3; do
            HONRO_FIRST_SHOT_DIAGNOSTIC=1 HONRO_RUN_DIR="$OUT/first-shot-$trial" python tools/act4-ci/stage31-fullplay.py > "$OUT/first-shot-$trial.log" 2>&1
          done
          HONRO_RUN_DIR="$OUT/stage31" python tools/act4-ci/stage31-fullplay.py > "$OUT/stage31.log" 2>&1
      - name: Bind genuine measured evidence and enforce normal production gate
        run: |
          set -euo pipefail
          node tools/act4-ci/refresh-stage31-probes.mjs attach "$OUT"
          cp tools/stage31/production-package.json "$OUT/stage31-production-package.json"
          npm run build | tee "$OUT/gated-build.log"
          sha256sum HONRO.html web/manifest.json > "$OUT/final-served-sha256.txt"
      - name: Actual browser natural-save regressions on final production build
        run: |
          set -euo pipefail
          python -m http.server 8870 --bind 127.0.0.1 > "$OUT/final-server.log" 2>&1 &
          server=$!; trap 'kill "$server" 2>/dev/null || true' EXIT
          sleep 2
          HONRO_QA_OUT="$OUT/stage8-reader" python tests/stage8-staging-reader-browser.py
          HONRO_QA_OUT="$OUT/stage14-settle" python tools/act2-qa/stage14-postfix-ui.py
          HONRO_STAGE=17 HONRO_QA_OUT="$OUT/stage17-hoist" python tools/act2-qa/retained-interactions-ui.py
          HONRO_STAGE=18 HONRO_QA_OUT="$OUT/stage18-bell" python tools/act2-qa/retained-interactions-ui.py
          for stage in 11 12 13 14 15; do
            HONRO_STAGE="$stage" HONRO_QA_OUT="$OUT/stage$stage-art" python tools/act2-vector-production/browser-candidate.py
          done
          HONRO_ITEM_UI_MODE=production HONRO_ITEM_UI_OUT="$OUT/item-ui" python tests/item-discovery-browser.py
      - name: Preserve checked candidate; no master publication
        run: |
          set -euo pipefail
          git add web HONRO.html HONRO_WORKSHOP.html index.html tools/stage31/production-package.json
          git -c user.name='honro release automation' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Build checked Act2 traced terrain integration from $GITHUB_SHA"
          git push origin "HEAD:refs/heads/work/act2-art-generated/$GITHUB_SHA"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: act2-traced-art-${{ github.sha }}
          path: |
            _local/reports/act2-integrated-art/
            _local/reports/act2-reserved-body-settle/
            _local/reports/act2-retained-interactions/
            _local/reports/act2-art-release/
          retention-days: 7
