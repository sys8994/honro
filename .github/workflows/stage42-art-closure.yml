name: Stage42 native art closure and actor witness QA
on:
  push:
    branches: ['qa/stage42-art-closure']
    paths: ['.github/workflows/stage42-art-closure.yml','tests/stage42-art-closure/**']
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HONRO_ACT4_RELEASE: '1'
      HONRO_ACT5_RELEASE: '1'
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 14
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Verify exact isolated diff and pinned stock source
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/qa/stage42-art-closure
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = 390887e011611a5d77ebbf3d01c5575cd05fdc4f
          test "$(git rev-parse HEAD~13)" = 1e043b09d4ce107e1d2dcf70fe2274dff7098476
          N=tests/stage42-art-closure; M=tests/stage42-west-multiface; A=tests/stage42-slate-atlas; Z=tests/stage42-central-hierarchy
          C=tests/stage42-composed-native; G=tests/stage42-full-native-workshop; I=tests/stage42-atlas-west-integrated
          printf '%s\n' .github/workflows/stage42-art-closure.yml "$N/apply-finish.mjs" "$N/candidate-pins.json" "$N/closure.SHA256SUMS" "$N/gate-delta.json" "$N/host-west.js" "$N/multi.mjs" "$N/prepare-west.mjs" "$N/proof-west.py" "$N/run-atlas-west.sh" "$N/source-hashes.json" "$N/terrain-delta.json" "$N/upper-joint-delta.json" "$N/west-owner.mjs" | LC_ALL=C sort > "$RUNNER_TEMP/atlas-west-allowed.txt"
          git diff --name-only --diff-filter=A HEAD^ HEAD | LC_ALL=C sort | diff -u "$RUNNER_TEMP/atlas-west-allowed.txt" -
          git diff --name-only HEAD^ HEAD | LC_ALL=C sort | diff -u "$RUNNER_TEMP/atlas-west-allowed.txt" -
          printf '%s  %s\n' 6c4b69f07e8e53df71a618ccb1c64ba386e9231aaf42e700286a69d9a7c6e9ab "$N/closure.SHA256SUMS" f0391e95197a289f03a03576a99477ad485fe775a431c48a435fc095e62bb7ad "$M/multiface.SHA256SUMS" bf01eafda47627b659ed528d48d5954346ac40cfca9f9f02a3da3f9deb6dbe83 "$I/integrated.SHA256SUMS" 39186841dda764dfdfcc116a61fb8fb28060812f1b2115afea10255ae6af57ba "$A/atlas-candidate.SHA256SUMS" 0c8e8944abff77f66ad2c1bd2617cec0935a03654d55007fdda9a724bf5db454 "$Z/sample-candidate.SHA256SUMS" 21c2c53d474b5843c271ada2a16ac112677772ae742800bac7560e558d4faca8 "$C/candidate.SHA256SUMS" | sha256sum -c -
          (cd "$N" && sha256sum -c closure.SHA256SUMS)
          (cd "$M" && sha256sum -c multiface.SHA256SUMS)
          (cd "$I" && sha256sum -c integrated.SHA256SUMS)
          (cd "$A" && sha256sum -c atlas-candidate.SHA256SUMS)
          (cd "$Z" && sha256sum -c sample-candidate.SHA256SUMS)
          (cd "$C" && sha256sum -c candidate.SHA256SUMS)
          (cd "$G" && sha256sum -c "$GITHUB_WORKSPACE/$C/inherited.SHA256SUMS")
          test -z "$(git diff --name-only "$(git rev-parse HEAD~13)" HEAD -- web game shared assets workshop HONRO.html HONRO_WORKSHOP.html)"
          npm ci
          npm ci --prefix game
          npm run build
          mkdir -p "$RUNNER_TEMP/stage42-atlas-west-stock"
          cp -a web HONRO_WORKSHOP.html HONRO.html "$RUNNER_TEMP/stage42-atlas-west-stock/"
      - name: Replay once in native Workshop and verify real stock contact
        run: |
          set -euo pipefail
          python -m pip install 'playwright==1.58.0' 'Pillow==12.0.0'
          export HONRO_CHROME="$(command -v google-chrome || command -v chromium)"
          test -x "$HONRO_CHROME"
          "$HONRO_CHROME" --version
          bash tests/stage42-art-closure/run-atlas-west.sh "$RUNNER_TEMP/stage42-atlas-west-stock" "$RUNNER_TEMP/stage42-art-closure-disposable" "$RUNNER_TEMP/stage42-atlas-west-evidence"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: stage42-art-closure-and-actor-witness
          path: |
            ${{ runner.temp }}/stage42-atlas-west-evidence/result.json
            ${{ runner.temp }}/stage42-atlas-west-evidence/native-west-receipt-proof.json
            ${{ runner.temp }}/stage42-atlas-west-evidence/matched-art-index.json
            ${{ runner.temp }}/stage42-atlas-west-evidence/matched-*.png
            ${{ runner.temp }}/stage42-atlas-west-evidence/west-native-preview.png
            ${{ runner.temp }}/stage42-atlas-west-evidence/west-native-reopened.png
            ${{ runner.temp }}/stage42-atlas-west-evidence/before/before-actor-pair.json
            ${{ runner.temp }}/stage42-atlas-west-evidence/before/before-*.png
            ${{ runner.temp }}/stage42-atlas-west-evidence/before/before-actor-audit.json
            ${{ runner.temp }}/stage42-atlas-west-evidence/before/before-actor-failure.json
            ${{ runner.temp }}/stage42-atlas-west-evidence/before/live-first-walk.json
            ${{ runner.temp }}/stage42-atlas-west-evidence/before/actual-stock-first-walk.png
            ${{ runner.temp }}/stage42-atlas-west-evidence/after/after-*.png
            ${{ runner.temp }}/stage42-atlas-west-evidence/after/after-actor-audit.json
            ${{ runner.temp }}/stage42-atlas-west-evidence/after/after-actor-failure.json
            ${{ runner.temp }}/stage42-atlas-west-evidence/after/live-first-walk.json
            ${{ runner.temp }}/stage42-atlas-west-evidence/after/actual-stock-first-walk.png
          if-no-files-found: warn
          retention-days: 7
