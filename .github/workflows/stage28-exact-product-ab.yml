name: Stage28 exact clean product source A/B
on:
  push:
    branches: ['qa/stage28-exact-product-ab-20261120']
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
      - name: Pin isolated stock and candidate source roots
        run: |
          B=787206f6dce947868ad9199da45fbe393d3f3c53
          C=b81245966bc7f68b41ecc0581c82ab8b2e7d2714
          test "$(git rev-parse HEAD^)" = "$C"
          test "$(git rev-parse "$C^")" = "$B"
          test "$(git diff --name-only "$C" HEAD)" = "$(printf '%s\n' .github/workflows/stage28-exact-product-ab.yml tools/stage28-exact-product-ab/capture.py tools/stage28-exact-product-ab/verify.py)"
          test "$(git diff --name-only "$B" "$C")" = "$(printf '%s\n' shared/runtime/terrain-readability.js tools/map-forge/stage28-record-court.mjs)"
          test "$(git rev-parse "$B":shared/runtime/terrain-readability.js)" = 9753f90b3417e02ab023b510a961f00bc6cb79a1
          test "$(git rev-parse "$B":tools/map-forge/stage28-record-court.mjs)" = 50d30526ba7f5d7809b2938ed00a760bbec9be77
          test "$(git rev-parse "$C":shared/runtime/terrain-readability.js)" = 6c69e40fbd80f46b19946fd4dffb7b3d93de4e09
          test "$(git rev-parse "$C":tools/map-forge/stage28-record-court.mjs)" = 1eacb5ee5bb3e3c269df3434e6c8a991fa99919e
          Q="$RUNNER_TEMP/stage28-one-off"
          mkdir -p "$Q"
          git worktree add --detach "$Q/stock" "$B"
          git worktree add --detach "$Q/candidate" "$C"
          git diff --binary "$B" "$C" > "$Q/product-exact.diff"
          echo "QA=$Q" >> "$GITHUB_ENV"
      - name: Install build and browser QA dependencies
        run: |
          cd "$QA/stock"
          npm ci
          npm ci --prefix game
          ln -s "$QA/stock/node_modules" "$QA/candidate/node_modules"
          ln -s "$QA/stock/game/node_modules" "$QA/candidate/game/node_modules"
          python -m pip install playwright pillow numpy
          python -m playwright install --with-deps chromium
      - name: Official untouched stock and pushed candidate builds
        run: |
          for mode in stock candidate; do
            (
              cd "$QA/$mode"
              test -z "$(git status --porcelain --untracked-files=no)"
              npm run test:release-guard
              npm run build
              npm run test:production-contract
            )
          done
      - name: Independent normal HTTP launches
        run: |
          readonly BASE="$GITHUB_WORKSPACE/_local/reports/stage28-one-off"
          mkdir -p "$BASE"
          cp "$QA"/product-exact.diff "$BASE/"
          for mode in stock candidate; do
            mkdir -p "$BASE/$mode"
            (cd "$QA/$mode"; sha256sum HONRO.html web/data/chapter-28.*.json web/data/chapter-28-assets.*.json) > "$BASE/$mode/packed-source.sha256"
            python -m http.server 8884 --bind 127.0.0.1 --directory "$QA/$mode" >"$BASE/$mode/host.log" 2>&1 & server=$!
            trap 'kill "$server" || true' EXIT
            for i in $(seq 1 20); do curl -fsSL http://127.0.0.1:8884/HONRO.html -o /dev/null && break || sleep 1; done
            MODE="$mode" OUT="$BASE/$mode" python tools/stage28-exact-product-ab/capture.py
            kill "$server"
            wait "$server" || true
            trap - EXIT
          done
          python tools/stage28-exact-product-ab/verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage28-exact-product-proof
          path: _local/reports/stage28-one-off
