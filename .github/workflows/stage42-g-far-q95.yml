name: Stage42 G isolated H Q95 far comparison
on:
  push:
    branches: ['qa/stage42-g-far-q95']
    paths: ['.github/workflows/stage42-g-far-q95.yml','tests/stage42-g-far-q95/**']
permissions:
  contents: read
jobs:
  entry:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 4
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Exact G-only packet and detached host
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/qa/stage42-g-far-q95
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          PIN=1e043b09d4ce107e1d2dcf70fe2274dff7098476
          PARENT=9e2787d1d643e467c4387521e93862040a075fda
          test "$(git rev-parse HEAD^)" = "$PARENT"
          test "$(git rev-parse HEAD^^)" = a2f92b518e1cd9b32117c62f3ad07cdbc6275e81
          test "$(git rev-parse HEAD^^^)" = "$PIN"
          Q=tests/stage42-g-far-q95
          printf '%s\n' .github/workflows/stage42-g-far-q95.yml "$Q/far-ab.py" "$Q/far-ab.js" "$Q/stage42-evening-h-q95.webp" "$Q/SHA256SUMS" | sort > "$RUNNER_TEMP/allow"
          git diff --name-only HEAD^ HEAD | sort | diff -u "$RUNNER_TEMP/allow" -
          git diff --name-only --diff-filter=A HEAD^ HEAD | sort | diff -u "$RUNNER_TEMP/allow" -
          echo "7b42196d10eab421fdcf271333deaa33bcb846505784622e75eb885c4f519b77  $Q/SHA256SUMS" | sha256sum -c -
          (cd "$Q" && sha256sum -c SHA256SUMS)
          git diff --exit-code "$PARENT" HEAD -- tests/stage42-g-campaign-entry
          echo "ebf51cac39beee1e7441bca3ccc89a7fb1adfbc833b65fa1edd328eda9e50198  tests/stage42-g-campaign-entry/SHA256SUMS" | sha256sum -c -
          (cd tests/stage42-g-campaign-entry && sha256sum -c SHA256SUMS)
          test ! -e "$RUNNER_TEMP/g-entry-fixture"
          git worktree add --detach "$RUNNER_TEMP/g-entry-fixture" "$PIN"
      - name: Prepare G source and exact 46 contacts in temporary host only
        run: |
          set -euo pipefail
          Q="$GITHUB_WORKSPACE/tests/stage42-g-campaign-entry"
          cd "$RUNNER_TEMP/g-entry-fixture"
          npm ci
          npm ci --prefix game
          mkdir -p "$RUNNER_TEMP/g-evidence"
          export G_SOURCE_DIAGNOSTICS="$RUNNER_TEMP/g-evidence"
          node "$Q/source-contract.mjs" baseline "$PWD" "$RUNNER_TEMP/g-source-baseline.json"
          python "$Q/prepare.py" "$PWD"
          mkdir -p "$RUNNER_TEMP/g-evidence"
          node "$Q/source-contract.mjs" candidate "$PWD" "$RUNNER_TEMP/g-source-baseline.json" "$RUNNER_TEMP/g-evidence/source-invariants.json"
          sha256sum shared/act5-world.mjs shared/data/act5/stage42-g-domain.witness.mjs > "$RUNNER_TEMP/g-owned.sha"
          HONRO_ACT4_RELEASE=1 HONRO_ACT5_RELEASE=1 npm run build
          test "$(git rev-parse HEAD)" = 1e043b09d4ce107e1d2dcf70fe2274dff7098476
          if git symbolic-ref -q HEAD; then exit 1; fi
          sha256sum -c "$RUNNER_TEMP/g-owned.sha"
          git -C "$GITHUB_WORKSPACE" diff --exit-code
          git -C "$GITHUB_WORKSPACE" diff --cached --exit-code
      - name: Stage42-only A/A, B/B, exact foreground and restoration
        run: |
          set -euo pipefail
          Q="$GITHUB_WORKSPACE/tests/stage42-g-far-q95"
          DEST="$RUNNER_TEMP/g-entry-fixture/stage42-evening-h-q95.qa.webp"
          test ! -e "$DEST"
          cp "$Q/stage42-evening-h-q95.webp" "$DEST"
          echo "aab6bd260cb84abfb2128112a371735dd7bf2bf2f2db38b9952fbd9d80029233  $DEST" | sha256sum -c -
          python -m pip install 'playwright==1.58.0'
          export HONRO_CHROME="$(command -v google-chrome || command -v chromium)"
          python -m http.server 8884 --bind 127.0.0.1 --directory "$RUNNER_TEMP/g-entry-fixture" &
          pid=$!; trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..20}; do if curl -fsS -o /dev/null http://127.0.0.1:8884/HONRO.html; then break; fi; sleep 1; done
          timeout 240s python "$Q/far-ab.py" http://127.0.0.1:8884/HONRO.html "$RUNNER_TEMP/g-evidence/far-ab" "$RUNNER_TEMP/g-evidence/source-invariants.json"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: stage42-g-far-q95-west-only
          path: |
            ${{ runner.temp }}/g-evidence/far-ab/result.json
            ${{ runner.temp }}/g-evidence/far-ab/entry-desktop-*.png
            ${{ runner.temp }}/g-evidence/far-ab/west-phone-crop-*.png
          if-no-files-found: warn
          retention-days: 7
