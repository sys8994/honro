name: Honro Stage 42 terrain vector composition - native Workshop
on:
  push:
    branches: ['qa/stage42-vector-composition-01']
    paths: ['.github/workflows/stage42-vector-composition-01.yml', 'tests/stage42-vector-composition-01/**']
permissions:
  contents: read
jobs:
  vectors:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Draw new vector art in an isolated native Workshop; no game play
        working-directory: tests/stage42-vector-composition-01
        env:
          HONRO_NATIVE_FILL_PROOF: '1'
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/qa/stage42-vector-composition-01
          test "$(git rev-parse HEAD^)" = 1e043b09d4ce107e1d2dcf70fe2274dff7098476
          sha256sum -c CHECKSUMS
          git diff --name-status HEAD^ HEAD | tee "$RUNNER_TEMP/vector-diff.txt"
          test "$(wc -l < "$RUNNER_TEMP/vector-diff.txt")" -eq 6
          ! grep -vE '^A[[:space:]]+([.]github/workflows/stage42-vector-composition-01[.]yml|tests/stage42-vector-composition-01/[^/]+)$' "$RUNNER_TEMP/vector-diff.txt"
          B="$RUNNER_TEMP/stage42-native-fill-disposable"; E="$RUNNER_TEMP/stage42-vector-renders"
          mkdir -p "$B" "$E"
          cp -a "$GITHUB_WORKSPACE/web" "$GITHUB_WORKSPACE/HONRO_WORKSHOP.html" "$B/"
          node inspector.mjs "$B"
          node frame.mjs "$B/web/runtime/workshop-app.489f733634454986.js"
          node --check "$B/web/runtime/workshop-app.489f733634454986.js"
          python -m pip install 'playwright==1.58.0' 'Pillow==12.0.0'
          python -m http.server 8872 --bind 127.0.0.1 --directory "$B" > "$E/server.log" 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          for ((i=0;i<20;i++)); do if curl -fsS -o /dev/null http://127.0.0.1:8872/HONRO_WORKSHOP.html; then break; fi; sleep 1; done
          CHROME="$(command -v google-chrome || command -v chromium)"
          timeout 440s python draw.py "$E" "$CHROME"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: stage42-terrain-vector-01
          path: |
            ${{ runner.temp }}/stage42-vector-renders/*.png
            ${{ runner.temp }}/stage42-vector-renders/result.json
            ${{ runner.temp }}/stage42-vector-renders/server.log
          retention-days: 10
