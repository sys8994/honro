name: Combined Stage33 Stage46 isolated source gate
on:
  push:
    branches: ['qa/stage33-stage46-combined-20261120']
permissions:
  contents: read
jobs:
  combined:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 3
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
      - name: Verify clean source commit and exact source blobs
        run: |
          set -euo pipefail
          SOURCE=66679da33b448781fe549b78d4f77c5bb0710826
          BASE=1e043b09d4ce107e1d2dcf70fe2274dff7098476
          test "$(git rev-parse HEAD^)" = "$SOURCE"
          test "$(git rev-parse "$SOURCE^")" = "$BASE"
          test "$(git diff --name-only "$BASE" "$SOURCE" | wc -l)" = 4
          test "$(git rev-parse HEAD:shared/act4-stage33-coastal-art.mjs)" = 3c929d175e15d8933eb244409a1b369063f15f28
          test "$(git rev-parse HEAD:shared/act4-stage33-west-contact.mjs)" = 188518a718658285660aaa6906ecce411f0ccdb3
          test "$(git rev-parse HEAD:shared/runtime/act5-edge-art.js)" = 09a70bccac0ede6bee32e57d893be6a0d63b51ef
          test "$(git rev-parse HEAD:tests/production-contract.mjs)" = 29210abc75f37bca44d772a78e85e334a09a0229
          git diff --name-only "$SOURCE" HEAD > /tmp/qa-files
          if grep -vE '^(tools/combined-33-46/(launch|verify).py|.github/workflows/combined-33-46.yml)$' /tmp/qa-files; then exit 1; fi
          mkdir -p _local/reports/stage33-stage46-combined
          git diff --name-status "$BASE" "$SOURCE" > _local/reports/stage33-stage46-combined/source-files.txt
      - run: npm ci && npm ci --prefix game
      - run: python -m pip install playwright pillow && python -m playwright install --with-deps chromium
      - name: Baseline compiled normal launch (no additional baseline build)
        run: python tools/combined-33-46/launch.py stock
      - name: One official combined build and unchanged runtime guards
        run: |
          npm run test:release-guard
          npm run build
          npm run test:production-contract
      - name: Combined compiled normal launch and minimal paired checks
        run: |
          python tools/combined-33-46/launch.py integrated
          python tools/combined-33-46/verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage33-stage46-combined-proof
          path: _local/reports/stage33-stage46-combined
