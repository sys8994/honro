name: HONRO Stage7 west retained exact proof no deployment
on:
  push:
    branches: [qa/stage7-west-retention-cd8f69d]
    paths:
      - .github/workflows/stage7-west-retention.yml
      - tools/stage7-west-retention/**
permissions:
  actions: read
  contents: read
jobs:
  retention:
    if: github.repository == 'sys8994/honro' && github.event_name == 'push' && github.ref == 'refs/heads/qa/stage7-west-retention-cd8f69d'
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
      - name: Authenticate official matched graph and preserve previous release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/stage7-west-retained"
          mkdir "$W" "$W/out"
          echo "WORK=$W" >> "$GITHUB_ENV"
          python "$GITHUB_WORKSPACE/tools/stage7-west-retention/verify-native-authority.py" "$W"
      - name: Exact native rebuild and sealed retained delta, no ref write
        shell: bash
        run: |
          set -euo pipefail
          test -z "${GH_TOKEN:-}${GITHUB_TOKEN:-}"
          T="$WORK"
          Q="$GITHUB_WORKSPACE/tools/stage7-west-retention/scoped_build.py"
          python "$Q" pre "$T"
          (
            cd "$T/B"
            npm ci > "$T/out/npm-root-B.log" 2>&1
            npm ci --prefix game > "$T/out/npm-game-B.log" 2>&1
            npm run test:release-guard > "$T/out/release-guard-B.log" 2>&1
            npm run build > "$T/out/build-B.log" 2>&1
            npm run test:production-contract > "$T/out/production-contract-B.log" 2>&1
          )
          python "$Q" seal "$T"
          cp "$T/authority.json" "$T/out/AUTHORITY.json"
      - if: always() && env.WORK != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: honro-stage7-west-retained-protected-proof-not-deployed
          path: ${{ runner.temp }}/stage7-west-retained/out/
          retention-days: 7
          if-no-files-found: error
