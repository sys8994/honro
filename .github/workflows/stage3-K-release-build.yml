name: Stage3 K official release artifact preparation
on:
  workflow_dispatch:
  push:
    branches: [inspect/stage32-scanline-20261118, inspect/stage3-current-master-20261118]
    paths: ['tools/testing/stage3-K-release-build/**', '.github/workflows/stage3-K-release-build.yml']
permissions: {contents: read}
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with: {path: study}
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with: {path: candidate, ref: a6f2935935eed559c3ecd27207d8d8a78a1ed22d, fetch-depth: 2, filter: 'blob:none'}
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with: {node-version: '22', package-manager-cache: false}
      - name: Install locked build dependencies
        run: cd candidate && npm ci && npm ci --prefix game
      - name: Pin source and retain attested successful publications
        run: |
          set -o pipefail
          mkdir -p artifacts
          node study/tools/testing/stage3-K-release-build/release.mjs prepare candidate artifacts | tee artifacts/prepare.log
      - name: Official default Game and Workshop release build
        run: |
          set -o pipefail
          cd candidate
          npm run build 2>&1 | tee ../artifacts/build.log
      - name: Isolate generated delta and verify retained assets
        run: |
          set -o pipefail
          node study/tools/testing/stage3-K-release-build/release.mjs package candidate artifacts | tee artifacts/package.log
      - name: Required scoped graph and retention aggregate checks
        run: |
          set -o pipefail
          cd candidate
          node tests/web-split.mjs 2>&1 | tee ../artifacts/web-split.log
          node tests/web-build-retention.mjs 2>&1 | tee ../artifacts/web-build-retention.log
      - name: Hash final payload without publishing
        run: |
          python3 - <<'PY'
          import pathlib,zipfile,hashlib,json
          root=pathlib.Path('artifacts'); payload=root/'payload'
          with zipfile.ZipFile(root/'release-delta.zip','w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
            for f in sorted(payload.rglob('*')):
              if f.is_file(): z.write(f,str(f.relative_to(payload)))
          b=(root/'release-delta.zip').read_bytes()
          (root/'artifact-checksum.json').write_text(json.dumps({'file':'release-delta.zip','bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'published':False},indent=2)+'\n')
          (root/'CHECKS_PASSED.txt').write_text('Official default build, scoped web-split graph and web-build-retention passed. Artifact only; not deployed.\n')
          PY
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: stage3-K-release-preparation
          path: |
            artifacts/*.json
            artifacts/*.log
            artifacts/*.txt
            artifacts/release-delta.zip
          if-no-files-found: error
