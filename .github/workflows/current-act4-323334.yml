name: Current stock Act4 32 33 34 continuity audit
on:
  push:
    branches: ['audit/current-act4-323334-20261120']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        stage: [32,33,34]
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 0
      - name: Reject all production edits
        shell: bash
        run: |
          git diff --name-only 1e043b09d4ce107e1d2dcf70fe2274dff7098476 HEAD > /tmp/changed
          cat /tmp/changed
          if grep -vE '^(tools/current-act4-323334/capture.mjs|.github/workflows/current-act4-323334.yml)$' /tmp/changed; then exit 1; fi
          test "$(git merge-base HEAD 1e043b09d4ce107e1d2dcf70fe2274dff7098476)" = 1e043b09d4ce107e1d2dcf70fe2274dff7098476
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci && npm ci --prefix game
      - name: Capture original runtime fixed cameras without ticking simulation
        env:
          HONRO_NATIVE_OUT: /tmp/terrain-current-evidence
        run: |
          mkdir -p "$HONRO_NATIVE_OUT"
          git rev-parse HEAD > "$HONRO_NATIVE_OUT/test-head.txt"
          echo 1e043b09d4ce107e1d2dcf70fe2274dff7098476 > "$HONRO_NATIVE_OUT/production-parent.txt"
          node --expose-gc --max-old-space-size=12000 tools/current-act4-323334/capture.mjs ${{ matrix.stage }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-act4-stage-${{ matrix.stage }}
          path: /tmp/terrain-current-evidence

