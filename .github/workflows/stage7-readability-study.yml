name: Stage7 nonwalk domain readability study
on:
  workflow_dispatch:
  push:
    branches: [art/stage7-semantic-rock-study-20261117]
    paths:
      - game/tools/stage7-readability-study/**
      - .github/workflows/stage7-readability-study.yml
permissions:
  contents: read
jobs:
  readability:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci && npm ci --prefix game
      - run: python -m pip install numpy==2.2.4 Pillow==11.1.0
      - run: node game/tools/stage7-readability-study/test.mjs
      - run: node game/tools/stage7-readability-study/fixture.mjs "$RUNNER_TEMP/stage7-readability"
      - name: Render identical original BODY with old or scoped readability
        run: |
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          node game/tools/stage7-readability-study/run.mjs "$RUNNER_TEMP/stage7-readability" artifacts/stage7-readability-study
      - run: python game/tools/stage7-readability-study/check.py
      - name: Production unchanged
        if: always()
        run: git diff --exit-code -- shared tools/map-forge
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage7-readability-study-${{ github.sha }}
          path: artifacts/stage7-readability-study
          if-no-files-found: error
          retention-days: 14
