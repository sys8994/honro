name: Two-root exact Stage 1 startup preflight
on:
  push:
    branches:
      - qa/terrain-cumulative-52119985-startup-only-20261120
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
      - name: Verify exact two immutable trees and their QA-only observer
        run: |
          set -euo pipefail
          Q="$GITHUB_WORKSPACE/tools/terrain-cumulative-verify"
          W="$RUNNER_TEMP/terrain-cumulative"
          mkdir -p "$W/out"
          printf 'QA=%s\nSTOCK=%s\nTARGET=%s\nOUT=%s\n' "$Q" "$W/stock" "$W/target" "$W/out" >> "$GITHUB_ENV"
          python "$Q/guard.py" | tee "$W/out/source-scope.txt"
          git worktree add --detach "$W/stock" 1e043b09d4ce107e1d2dcf70fe2274dff7098476
          git worktree add --detach "$W/target" 52119985ad21a7d3de04245ee146293045edbeba
          for v in stock target; do
            test -z "$(git -C "$W/$v" status --porcelain)"
            git -C "$W/$v" log -1 --format='%H %T' >>"$W/out/root-pin.txt"
          done
      - name: Official builds and contracts with separate stock legacy fixture receipt
        run: |
          set -euo pipefail
          for mode in stock target; do
            if [ "$mode" = stock ]; then cd "$STOCK"; else cd "$TARGET"; fi
            export CI=true
            npm ci >"$OUT/npm-root-$mode.log" 2>&1
            npm ci --prefix game >"$OUT/npm-game-$mode.log" 2>&1
            npm run test:release-guard >"$OUT/release-$mode.log" 2>&1
            npm run build >"$OUT/build-$mode.log" 2>&1
            if [ "$mode" = stock ]; then
              set +e
              npm run test:production-contract >"$OUT/contract-stock.log" 2>&1
              contract_status=$?
              set -e
              printf '%s\n' "$contract_status" >"$OUT/contract-stock.exit"
              python - "$OUT/contract-stock.log" "$contract_status" <<'PYCODE'
          import pathlib,re,sys
          file,rc=sys.argv[1:]
          text=pathlib.Path(file).read_text('utf-8')
          lines=text.splitlines()
          message='기존 미술에서 가져온 에셋이 아니면 사용 사유를 먼저 기록하십시오.'
          scope='Production contract: actual Stage31 fails; fake approvals cannot pass; edits expire reviews; no source mutation.'
          errors=[s for s in lines if re.match(r'^[A-Za-z]*Error:',s)]
          stacks=[s.strip() for s in lines if re.match(r'^\s+at ',s)]
          assert rc=='1',('Unexpected stock exit',rc)
          assert lines.count(scope)==1,('Unexpected first contract block')
          assert errors==['Error: '+message],('Unexpected stock error class or text',len(errors))
          assert len(stacks)==2 and stacks[0]=='at Object.placeScenery (evalmachine.<anonymous>:85:520)',('Unexpected stack root',len(stacks))
          assert re.fullmatch(r'at file://[^\n]+/stock/tests/production-contract\.mjs:77:22',stacks[1]),('Unexpected stock failing fixture')
          assert lines[-1].startswith('Node.js v22.'),('Unexpected stock failure termination')
          print('LEGACY STOCK CONTRACT FAILED at exact unapproved positive fixture, not a pass. Artifact diagnostics may continue.')
          PYCODE
              printf '%s\n' 'FAILED_LEGACY_STOCK_FIXTURE_TEST_77_22' >"$OUT/stock-contract-classification.txt"
            else
              npm run test:production-contract >"$OUT/contract-target.log" 2>&1
              printf '%s\n' 'PASS_UNMODIFIED_TARGET_CONTRACT' >"$OUT/target-contract-classification.txt"
            fi
          done
          python "$QA/verify.py" "$STOCK" "$TARGET" "$OUT"
      - name: One normal Stage 1 startup per root, no terrain matrix
        timeout-minutes: 8
        run: |
          set -euo pipefail
          python -m pip install playwright==1.58.0 pillow
          python -m playwright install --with-deps chromium
          python -m http.server 18841 --bind 127.0.0.1 --directory "$STOCK" >"$OUT/http-stock.log" 2>&1 &
          h1=$!
          python -m http.server 18842 --bind 127.0.0.1 --directory "$TARGET" >"$OUT/http-target.log" 2>&1 &
          h2=$!
          trap 'kill "$h1" "$h2" 2>/dev/null || true' EXIT
          for p in 18841 18842; do
            curl -fsS --retry 5 --retry-connrefused "http://127.0.0.1:$p/HONRO.html" -o /dev/null
          done
          timeout 85s python "$QA/smoke-init.py" --mode stock --root "$STOCK" --port 18841 --out "$OUT/init-stock.json" >"$OUT/init-stock.log" 2>&1 &
          p1=$!
          timeout 85s python "$QA/smoke-init.py" --mode target --root "$TARGET" --port 18842 --out "$OUT/init-target.json" >"$OUT/init-target.log" 2>&1 &
          p2=$!
          set +e
          wait "$p1"; r1=$?
          wait "$p2"; r2=$?
          set -e
          printf 'stock=%s\ntarget=%s\n' "$r1" "$r2" >"$OUT/preflight-status.txt"
          test "$r1" = 0 && test "$r2" = 0
          python - "$OUT" <<'PYCODE'
          from pathlib import Path
          import json,sys
          d=Path(sys.argv[1])
          errors={}
          for mode in ('stock','target'):
              j=json.loads((d/f'init-{mode}.json').read_text())
              checks={'stage1':j.get('stage1',{}).get('stage')==1,'sky':j.get('stage1',{}).get('sky')=='function',
                      'entryBody':j.get('entryHTTP',{}).get('sha256')==j['entrySHA256'],'ready':any(x['stockPredicate'] for x in j['timeline']),
                      'noErrors':not j['errors'] and not j.get('probeError'),'no404':all(x[1]<400 for x in j['status']),
                      'settledAppPromise':any((x.get('promise') or {}).get('state')=='fulfilled' for x in j['timeline'])}
              print(mode,checks)
              if not all(checks.values()):errors[mode]=checks
          assert not errors,errors
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terrain-exact-two-root-stage1-init-only
          path: ${{ env.OUT }}
          retention-days: 7
