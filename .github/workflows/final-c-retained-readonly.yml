name: Verify final C retained generated bytes without deployment
on:
  push:
    branches: [qa/final-c-retained-readonly-20261121]
permissions:
  contents: read
  actions: read
jobs:
  assemble-readonly:
    if: github.event_name == 'push' && github.ref == 'refs/heads/qa/final-c-retained-readonly-20261121'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
      - name: Verify same-run camera receipts and prepare generated delta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE=affc9a7849f25a6fd08a65b5c90228b84e029fc1
          D=tools/final-c-retained
          W="$RUNNER_TEMP/final-c-retained"
          test "$(git show -s --format=%P HEAD)" = "$BASE"
          test "$(git rev-parse "$BASE^{tree}")" = 36e4284bb26cb6ea8e6465727564ad2821d39d32
          printf 'A\t%s\n' .github/workflows/final-c-retained-readonly.yml "$D/RELEASE-PINS.json" "$D/read_qa_inputs.py" "$D/validate_generated.py" "$D/same-repo-readonly.layout.sh" | LC_ALL=C sort > "$RUNNER_TEMP/final-c-retained-expected.tsv"
          git diff --name-status --no-renames "$BASE" HEAD | LC_ALL=C sort | diff - "$RUNNER_TEMP/final-c-retained-expected.tsv"
          bash "$D/same-repo-readonly.layout.sh" "$GITHUB_WORKSPACE" "$W" "$GITHUB_WORKSPACE/$D"
      - uses: actions/upload-artifact@v4
        with:
          name: final-c-retained-generated-delta-qa-only
          path: |
            ${{ runner.temp }}/final-c-retained/read-only-generated-delta.tar.gz
            ${{ runner.temp }}/final-c-retained/read-only-generated-delta.sha256
            ${{ runner.temp }}/final-c-retained/RETAINED-DELTA-RECEIPT.json
            ${{ runner.temp }}/final-c-retained/retained-registrations.json
            ${{ runner.temp }}/final-c-retained/preassembly.json
            ${{ runner.temp }}/final-c-retained/qa-download-pins.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
