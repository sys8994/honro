name: Act1 body candidate UI check
on:
  push:
    branches: ['work/act1-body-rollout/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      HONRO_ACT1_BODY_CANDIDATE: '1'
      HONRO_QA_URL: http://127.0.0.1:8770/HONRO.html
      HONRO_QA_OUT: _local/reports/act1-body-browser
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Focused candidate checks and unchanged production build gate
        run: |
          npm ci
          npm ci --prefix game
          node tests/act1-body-candidate.mjs
          HONRO_ACT1_BODY_CANDIDATE=1 npm run build
          python -m pip install 'playwright==1.58.0'
          python -m playwright install --with-deps chromium
      - name: Fresh UI and movement evidence
        run: |
          set -euo pipefail
          mkdir -p "$HONRO_QA_OUT"
          git rev-parse HEAD > "$HONRO_QA_OUT/source-commit.txt"
          sha256sum HONRO.html web/manifest.json > "$HONRO_QA_OUT/served-sha256.txt"
          python -m http.server 8770 --bind 127.0.0.1 > "$HONRO_QA_OUT/server.log" 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          sleep 2
          python tools/act1-vector-production/browser-candidate.py > "$HONRO_QA_OUT/browser.log" 2>&1
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: act1-body-candidate-${{ github.sha }}
          path: _local/reports/act1-body-browser/
          retention-days: 7
