name: Stage46 exact snapshot-copy native comparison no deploy
on:
  push:
    branches: [qa/stage46-snapshot-native-ab-eaf-r2]
    paths: [".github/workflows/stage46-snapshot-ab.yml", "tools/stage46-snapshot-ab/**"]
permissions:
  contents: read
  actions: read
jobs:
  paired-native:
    if: github.repository == 'sys8994/honro' && github.event_name == 'push' && github.ref == 'refs/heads/qa/stage46-snapshot-native-ab-eaf-r2'
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
      - name: Match exact master and successful official Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          const_path=tools/stage46-snapshot-ab/PINS.json
          python - "$const_path" <<'PY'
          from pathlib import Path
          import json,sys,subprocess as s
          x=json.loads(Path(sys.argv[1]).read_bytes())
          assert x['enabled'] is True, 'disabled until separate exact review'
          get=lambda p:json.loads(s.check_output(['gh','api','repos/sys8994/honro/'+p],timeout=45))
          m=get('branches/master');r=get('actions/runs/'+str(x['pages']['run']));j=get('actions/jobs/'+str(x['pages']['job']))
          assert m['commit']['sha']==r['head_sha']==j['head_sha']==x['head'] and r['head_branch']=='master' and j['run_id']==r['id']
          assert r['status']==j['status']=='completed' and r['conclusion']==j['conclusion']=='success' and any(z['name']=='Deploy to GitHub Pages' and z['conclusion']=='success' for z in j['steps'])
          import hashlib,urllib.request
          for key,path in [('manifest','web/manifest.json'),('nativeShell','HONRO.html')]:
            url=x['publicRoot']+path
            with urllib.request.urlopen(urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'HONRO-readonly-QA'}),timeout=35) as f:
              assert f.status==200 and f.geturl()==url
              data=f.read(x[key]['bytes']+1)
            assert (len(data),hashlib.sha256(data).hexdigest())==(x[key]['bytes'],x[key]['sha256']), 'public live '+key+' differs from exact eaf'
          PY
      - name: A is tracked exact stock and B is a single standard normal build
        run: |
          set -euo pipefail
          W=$(mktemp -d "$RUNNER_TEMP/stage46-snapshot.XXXXXX"); echo "W=$W" >> "$GITHUB_ENV"
          T="$GITHUB_WORKSPACE/tools/stage46-snapshot-ab"; mkdir "$W/out"
          python "$T/guard.py" pre "$W"
          cd "$W/B"
          npm ci > "$W/out/npm-root.log" 2>&1
          npm ci --prefix game > "$W/out/npm-game.log" 2>&1
          npm run build > "$W/out/build.log" 2>&1
          npm run test:production-contract > "$W/out/contract.log" 2>&1
          python "$T/guard.py" graph "$W"
          node "$T/graph.mjs" "$W"
          python "$T/guard.py" graph "$W"
      - name: Native cold launch timing, matched raw and ordinary A save continued in B
        run: |
          set -euo pipefail
          T="$GITHUB_WORKSPACE/tools/stage46-snapshot-ab"
          python -m venv "$W/venv"; V="$W/venv/bin/python"
          "$V" -m pip --disable-pip-version-check install playwright==1.62.0 Pillow==13.0.0
          "$V" -m playwright install --with-deps chromium
          python -m http.server 18961 --bind 127.0.0.1 --directory "$W/A" > "$W/out/http-A.log" 2>&1 & a=$!
          python -m http.server 18962 --bind 127.0.0.1 --directory "$W/B" > "$W/out/http-B.log" 2>&1 & b=$!
          trap 'kill "$a" "$b" 2>/dev/null || true' EXIT
          for p in 18961 18962; do curl -fsS --retry 8 --retry-connrefused "http://127.0.0.1:$p/HONRO.html" -o /dev/null; done
          "$V" "$T/capture.py" "$W"
      - if: always() && env.W != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: honro-stage46-snapshot-native-exact-no-deploy
          path: ${{ env.W }}/out/
          retention-days: 7
          if-no-files-found: warn
