name: Verify actual temporary score through the normal Act 6 ending
on:
  push:
    branches: ['qa/act6-ending-20261125']
    paths: ['.github/workflows/act6-ending-candidate.yml']
permissions:
  contents: read
jobs:
  candidate:
    if: github.repository == 'sys8994/honro' && github.ref == 'refs/heads/qa/act6-ending-20261125'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 5
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Checkout exact R3 product with audio-only witness
        shell: bash
        run: |
          set -euo pipefail
          BASE=13470b4bce757ac894cfbabdee83dc52e9bc75c1
          PROOF=027052f5831180f42e24762b910cddc7fd0178f5
          OFF=b607164fd31da526373efb12d06063c2b564719d
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          test "$(git rev-list --count "$BASE..HEAD")" = 4
          test "$(git ls-remote origin refs/heads/master | cut -f1)" = "$BASE"
          PRODUCT=2cd0382d8484e024389455d8c6f52f6560ccfc54
          test "$(git rev-parse HEAD^)" = "$PRODUCT"
          test -z "$(git diff --name-only "$PRODUCT" HEAD -- shared web game index.html HONRO.html)"
          git fetch --depth=1 origin "$PROOF" "$OFF"
          W="$(realpath "$(mktemp -d /tmp/honro-act6-web-qa-XXXXXXXX)")"
          OUT="$RUNNER_TEMP/act6-ending-audio-proof"
          mkdir -p "$OUT"
          echo "WITNESS_ROOT=$W" >> "$GITHUB_ENV"
          git -c core.hooksPath=/dev/null worktree add --detach "$W" "$BASE"
          git -c core.hooksPath=/dev/null worktree add --detach "$RUNNER_TEMP/act6-stock" "$OFF"
          git -C "$W" checkout "$GITHUB_SHA" -- shared/act6-ending-replan shared/{act6-app-qa,web-build}.mjs tools/act6-ending-qa
          cd "$W"
          npm ci --no-audit --no-fund > "$OUT/NPM.log" 2>&1
          npm ci --prefix game --include=dev --no-audit --no-fund > "$OUT/NPM-GAME.log" 2>&1
          git archive "$PROOF" tools/act6-qa/rest-51 | tar -x
          cp tools/act6-ending-qa/debug_ui.py tools/act6-qa/rest-51/
          python tools/act6-ending-qa/patch-witness.py tools/act6-qa/rest-51
          python tools/act6-qa/rest-51/normal-late-readbacks.py shared/act6-app-qa.mjs
          HONRO_ACT6_QA_NORMAL_LATE_WITNESS=1 HONRO_ACT6_RELEASE_HOST_TEST=1 HONRO_ACT6_QA_NORMAL_BOUNDARY=1 HONRO_ACT6_QA_QUIET_MATTE_WITNESS=1 HONRO_ACT6_QA_PAGES_SHAPE=1 HONRO_ACT6_QA_NORMAL_FAR=1 HONRO_ACT6_QA_NORMAL_LATE_FAR=1 HONRO_ACT6_QA_NORMAL_FINAL_FAR=1 HONRO_ACT6_QA_NORMAL_ENDING_STOCK=1 HONRO_ACT6_QA_WEB_ROOT="$W" npm run build > "$OUT/WITNESS-BUILD.log" 2>&1
      - name: Verify sound starts on the normal record action and continues through credits
        run: |
          set -euo pipefail
          python -m pip install 'playwright==1.58.0' 'Pillow==11.3.0'
          python -m playwright install --with-deps chromium
          cd "$WITNESS_ROOT"
          HONRO_ACT6_ENDING_AUDIO_ONLY=1 HONRO_ACT6_TERRAIN_PROOF=1 HONRO_ACT6_RELEASE_HOST_TEST=1 HONRO_ACT6_QA_NORMAL_BOUNDARY=1 HONRO_ACT6_QA_QUIET_MATTE_WITNESS=1 HONRO_ACT6_QA_PAGES_SHAPE=1 HONRO_ACT6_QA_NORMAL_FAR=1 HONRO_ACT6_QA_NORMAL_LATE_FAR=1 HONRO_ACT6_QA_NORMAL_FINAL_FAR=1 HONRO_ACT6_QA_NORMAL_ENDING_STOCK=1 python tools/act6-qa/rest-51/smoke.py "$RUNNER_TEMP/act6-stock" "$WITNESS_ROOT" "$RUNNER_TEMP/act6-ending-audio-proof" > "$RUNNER_TEMP/act6-ending-audio-proof/PLAYWRIGHT.log" 2>&1
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: act6-ending-audio-proof
          path: ${{ runner.temp }}/act6-ending-audio-proof/
          retention-days: 7
