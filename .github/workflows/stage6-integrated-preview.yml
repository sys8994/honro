name: Stage6 unshipped integrated review
on:
  push:
    branches: ['work/stage6-integrated-review-20261103']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      HONRO_STAGE6_ART_PREVIEW: '1'
      HONRO_STAGE6_INTEGRATED_PREVIEW: '1'
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Verify exact nonproduction composition and build
        run: |
          set -euo pipefail
          npm ci
          npm ci --prefix game
          node tests/stage6-art-preview.mjs
          node tests/stage6-integrated-preview.mjs
          node tests/stage6-render-coverage-preview.mjs
          node tests/stage6-integrated-entry.mjs
          # Unshipped diagnostic builder, not release-gate or deployment evidence.
          node workshop/build.mjs
          python -m pip install 'playwright==1.58.0'
          python -m playwright install --with-deps chromium
      - name: Restore exact natural gameplay checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Reuse the verified natural checkpoint, not a new full-play attempt.
          mkdir -p _local/stage6-prior
          gh api repos/sys8994/honro/actions/artifacts/13269315735 > _local/stage6-prior-meta.json
          gh api repos/sys8994/honro/actions/artifacts/13269315735/zip > _local/stage6-prior.zip
          python - <<'PY'
          import json,hashlib,zipfile
          from pathlib import Path
          m=json.loads(Path('_local/stage6-prior-meta.json').read_text())
          assert m['workflow_run']['head_sha']=='4fa4a106d4e42215f0f67a799385e07627fb2c66'
          z=Path('_local/stage6-prior.zip')
          assert hashlib.sha256(z.read_bytes()).hexdigest()=='ad8980ec5668d80a4e3c06987e5f07ac46ccca6827445d62a460ee54311546e2'
          with zipfile.ZipFile(z) as f:f.extract('integrated-play/natural-lookout-save.json.gz','_local/stage6-prior')
          assert hashlib.sha256(Path('HONRO.html').read_bytes()).hexdigest()=='724521d1f9ef023ad9cb2374a3fd9551d4cc1ea4f608ea4836bef17f8ea67af7'
          PY
      - name: Check integrated render, save, and actual input route
        run: |
          set -euo pipefail
          mkdir -p _local/reports/stage6-art-preview
          sha256sum HONRO.html > _local/reports/stage6-art-preview/served-sha256.txt
          python -m http.server 8870 --bind 127.0.0.1 > _local/reports/stage6-art-preview/server.log 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          sleep 2
          # Keep each independent result even if a prior QA script fails.
          status=0
          for script in capture-preview input-camera-review integrated-save-boundary integrated-checkpoint-review; do
            python "tools/stage6-prototype/$script.py" || status=1
          done
          exit "$status"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: stage6-integrated-review-${{ github.sha }}
          path: _local/reports/stage6-art-preview/
          retention-days: 7
