name: Stage32 registered App one-page bounded diagnostic
on:
  workflow_dispatch:
  push:
    branches: [inspect/stage32-scanline-20261118]
    paths:
      - tests/stage32-registered-one-probe.mjs
      - .github/workflows/stage32-registered-one-probe.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci && npm ci --prefix game
      - name: Generate unchanged registered App fixtures
        run: HONRO_ACT4_RELEASE=1 node tests/stage32-registered-ss2-perf-fixture.mjs "$RUNNER_TEMP/probe-input"
      - name: Only first frozen-baseline lower page, bounded CDP commands
        shell: bash
        run: |
          browser=$(command -v google-chrome || command -v chromium)
          mkdir -p "$RUNNER_TEMP/probe-evidence"
          "$browser" --version > "$RUNNER_TEMP/probe-evidence/chrome-version.txt"
          timeout 150s node tests/stage32-registered-one-probe.mjs "$browser" "$RUNNER_TEMP/probe-profile" "$RUNNER_TEMP/probe-input/stage32-candidate-lower.html" "$RUNNER_TEMP/probe-evidence"
          node tests/stage32-supersample-perf-result.mjs "$RUNNER_TEMP/probe-evidence/result.html" "$RUNNER_TEMP/probe-evidence" candidate lower
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: stage32-registered-one-probe
          path: ${{ runner.temp }}/probe-evidence
          if-no-files-found: warn
