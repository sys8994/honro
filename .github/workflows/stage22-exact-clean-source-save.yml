name: Save only the verified Stage22 clean source work branch
on:
  push:
    branches: ['qa/stage22-exact-clean-source-save-20261120']
permissions:
  contents: write
concurrency:
  group: stage22-clean-work-branch-exact-save
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 0
      - name: Verify untouched default branch and assemble already validated source only
        run: |
          set -euo pipefail
          base=b81245966bc7f68b41ecc0581c82ab8b2e7d2714
          parent=e55e8528639376881642d880bcc91e6f6f1e964f
          master=1e043b09d4ce107e1d2dcf70fe2274dff7098476
          workref=refs/heads/work/stage22-buried-join-clean-20261120
          D="$RUNNER_TEMP/stage22-clean-source"; mkdir -p "$D/out" "$D/private"
          echo "D=$D" >> "$GITHUB_ENV"
          git merge-base --is-ancestor "$parent" HEAD
          test "$(git diff --name-status "$parent" HEAD)" = $'A\t.github/workflows/stage22-exact-clean-source-save.yml'
          test "$(git rev-parse "$base^{tree}")" = e879e16e84eece516a61d355d33ac8e4512ca5ba
          test "$(git ls-remote --refs origin refs/heads/master | cut -f1)" = "$master"
          test -z "$(git ls-remote --refs origin "$workref")"
          for n in stock joint clean target; do git worktree add --detach "$D/$n" "$base"; done
          q="$GITHUB_WORKSPACE/tools/stage13-18-proof"
          python "$q/ci/verify.py" "$D/stock" "$D/joint" "$D/private"
          python "$q/ci/range.py" "$D/joint/shared/data/campaign.json" "$D/private/range.json"
          for p in shared/data/act2/stage18-compact-package.json tools/map-forge/stage18-short-quest.mjs; do cp "$D/joint/$p" "$D/clean/$p"; done
          python "$q/stage21-explicit-defaults/splice-stage21.py" joint-canonical "$D/joint/shared/data/campaign.json" "$D/clean/shared/data/campaign.json" "$D/private/stage21.json"
          node "$q/consolidated-qa/contract.mjs" metadata "$D/joint" "$D/clean" "$D/out/exact-21-contract.json" >"$D/private/metadata.log" 2>&1
          cmp "$D/stock/shared/data/act2/stage13-compact-package.json" "$D/clean/shared/data/act2/stage13-compact-package.json"
          cp "$D/clean/shared/data/act2/stage18-compact-package.json" "$D/target/shared/data/act2/stage18-compact-package.json"
          cp "$D/clean/tools/map-forge/stage18-short-quest.mjs" "$D/target/tools/map-forge/stage18-short-quest.mjs"
          cp "$D/clean/shared/data/campaign.json" "$D/target/shared/data/campaign.json"
          python "$q/consolidated-qa/target.py" "$D/clean" "$D/target" "$D/out/exact-two-plane-splice.json"
          node "$q/consolidated-qa/contract.mjs" stage22 "$D/clean" "$D/target" "$D/out/exact-22-contract.json" >"$D/private/target.log" 2>&1
      - name: Verify two independently pinned trees and push once without force, to the named work ref only
        run: |
          set -euo pipefail
          base=b81245966bc7f68b41ecc0581c82ab8b2e7d2714
          master=1e043b09d4ce107e1d2dcf70fe2274dff7098476
          workref=refs/heads/work/stage22-buried-join-clean-20261120
          cd "$D/clean"
          mpaths=(shared/data/act2/stage18-compact-package.json shared/data/campaign.json tools/map-forge/stage18-short-quest.mjs)
          tpaths=(shared/data/campaign.json tools/environment/stage22-vertical-art.mjs)
          metadata_tree=3549cab085dd5183e2fb96cf355233b5315fecd6
          target_tree=746fafe4563775327f4ce87e65c87ae1d9a0b159
          gcommit() { git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "$1"; }
          no_other_work() { test -z "$(git status --porcelain=v1 --untracked-files=all)"; }
          check_commit() {
            local expected_parent="$1" expected_tree="$2"
            test "$(git rev-parse HEAD^)" = "$expected_parent"
            test "$(git rev-parse HEAD^{tree})" = "$expected_tree"
            no_other_work
          }
          base_scope="$(git diff --name-only)"
          test "$base_scope" = "$(printf '%s\n' "${mpaths[@]}")"
          test "$(git hash-object shared/data/campaign.json)" = 91a4ada62984145fdc2eda8fd612fe0bc19f0ad7
          test "$(git hash-object shared/data/act2/stage18-compact-package.json)" = 37b1ed2ff28cbee8d084af3a9472803021a42962
          test "$(git hash-object tools/map-forge/stage18-short-quest.mjs)" = 512d50cc9f922994151b30746d93110183596e42
          git add -- "${mpaths[@]}"
          test "$(git write-tree)" = "$metadata_tree"
          test "$(git diff --cached --name-only)" = "$(printf '%s\n' "${mpaths[@]}")"
          gcommit 'Reconcile authored campaign metadata with strict validation'
          check_commit "$base" "$metadata_tree"; meta="$(git rev-parse HEAD)"
          for p in "${tpaths[@]}"; do cp "$D/target/$p" "$p"; done
          test "$(git diff --name-only)" = "$(printf '%s\n' "${tpaths[@]}")"
          test "$(git hash-object shared/data/campaign.json)" = 9f760cdcc0744b2c84d8fdcb480e7ce2f5069c7b
          test "$(git hash-object tools/environment/stage22-vertical-art.mjs)" = 2b272c0afcb9724ff7f2b15173fb64fc3feef5e3
          test "$(sha256sum tools/environment/stage22-vertical-art.mjs | cut -d' ' -f1)" = c4a92f67cde8ebdddf517dedc121c13022abbc5cff0f7c9f4c96da54724bed76
          git add -- "${tpaths[@]}"
          test "$(git write-tree)" = "$target_tree"
          test "$(git diff --cached --name-only)" = "$(printf '%s\n' "${tpaths[@]}")"
          gcommit 'Remove two buried Stage22 archive paint seams'
          check_commit "$meta" "$target_tree"; target="$(git rev-parse HEAD)"
          test "$(git rev-list --count "$base..HEAD")" = 2
          for head in "$meta" "$target"; do git diff-tree --no-commit-id --name-status -r "$head" >"$D/out/$head-scope.txt"; done
          printf 'ref=%s\nbase=%s\nmetadata=%s\nmetadataTree=%s\ntarget=%s\ntargetTree=%s\nmasterPinned=%s\n' "$workref" "$base" "$meta" "$metadata_tree" "$target" "$target_tree" "$master" >"$D/out/verified-commit-candidates.txt"
          test "$(git -C "$GITHUB_WORKSPACE" cat-file -t "$target")" = commit
          test "$(git -C "$GITHUB_WORKSPACE" ls-remote --refs origin refs/heads/master | cut -f1)" = "$master"
          test -z "$(git -C "$GITHUB_WORKSPACE" ls-remote --refs origin "$workref")"
          git -C "$GITHUB_WORKSPACE" push --porcelain origin "$target:$workref"
          hash="$(git -C "$GITHUB_WORKSPACE" ls-remote --refs origin "$workref" | cut -f1)"
          current_master="$(git -C "$GITHUB_WORKSPACE" ls-remote --refs origin refs/heads/master | cut -f1)"
          printf 'work=%s\nmaster=%s\n' "$hash" "$current_master" >"$D/out/remote-readback.txt"
          test "$hash" = "$target"
          test "$current_master" = "$master"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage22-clean-source-ref-proof
          path: ${{ env.D }}/out
          retention-days: 7
