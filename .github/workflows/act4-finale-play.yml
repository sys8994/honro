name: Act4 finale actual input diagnostic
on:
  push:
    branches: ['work/act4-finale-play/**']
permissions:
  contents: read
jobs:
  play:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HONRO_ACT4_RELEASE: '1'
      HONRO_CAPTURE_URL: http://127.0.0.1:8870/HONRO.html
      HONRO_CAPTURE_OUT: _local/reports/finale40-browser
      HONRO40_FINISH: '1'
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Build isolated candidate
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix game --no-audit --no-fund
          python -m pip install 'playwright==1.58.0'
          python -m playwright install --with-deps chromium
          sha256sum HONRO.html web/manifest.json > /tmp/public-before.txt
          node workshop/build.mjs --preview finale40-browser
          sha256sum -c /tmp/public-before.txt
      - name: Actual inputs through combat and return
        run: |
          mkdir -p "$HONRO_CAPTURE_OUT"
          python -m http.server 8870 --bind 127.0.0.1 --directory _local/previews/finale40-browser > "$HONRO_CAPTURE_OUT/server.log" 2>&1 &
          server=$!; trap 'kill "$server" 2>/dev/null || true' EXIT
          sleep 2
          python tools/act4-ci/finale40/play.py > "$HONRO_CAPTURE_OUT/play.log" 2>&1
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: finale40-input-diagnostic-${{ github.sha }}
          path: _local/reports/finale40-browser/
          retention-days: 7
