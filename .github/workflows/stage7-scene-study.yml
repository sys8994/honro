name: Stage7 actual Scene candidate study
on:
  workflow_dispatch:
  push:
    branches: [art/stage7-semantic-rock-study-20261117]
    paths:
      - game/tools/stage7-scene-study/**
      - game/tools/stage7-vector-study/**
      - game/tools/stage7-svg-study/**
      - .github/workflows/stage7-scene-study.yml
permissions:
  contents: read
jobs:
  scene:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        controls: ['0', '1']
    env:
      STAGE7_CONTROLS: ${{ matrix.controls }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci && npm ci --prefix game
      - run: python -m pip install numpy==2.2.4 Pillow==11.1.0
      - name: Regenerate test-only native candidate
        run: python game/tools/stage7-vector-study/convert.py
      - name: Generate isolated production Scene fixtures
        run: |
          node game/tools/stage7-scene-study/fixture.mjs "$RUNNER_TEMP/stage7-scenes"
          mkdir -p artifacts/stage7-scene-study
          cp "$RUNNER_TEMP/stage7-scenes/source-adapter-contract.json" artifacts/stage7-scene-study/
      - name: Render controls or six art variants at constrained cameras
        run: |
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          node game/tools/stage7-scene-study/run.mjs "$RUNNER_TEMP/stage7-scenes" artifacts/stage7-scene-study
      - name: Check physics, original source, footholds, movement, save and camera equality
        run: node game/tools/stage7-scene-study/compare.mjs artifacts/stage7-scene-study
      - name: Strict original source-region pixels in actual Scene
        run: python game/tools/stage7-scene-study/pixels.py
      - name: Independent control attribution (strict gate remains above)
        if: ${{ always() && matrix.controls == '1' }}
        run: python game/tools/stage7-scene-study/controls-check.py
      - name: Independent closure source-over
        if: ${{ always() && matrix.controls == '0' }}
        run: python game/tools/stage7-scene-study/closure-check.py
      - name: Explicit narrow nonwalk join scope and independent expected composite
        if: ${{ always() && matrix.controls == '0' }}
        run: python game/tools/stage7-scene-study/joined-check.py
      - name: Quantization attribution without waiving strict failures
        if: ${{ always() && matrix.controls == '0' }}
        run: python game/tools/stage7-scene-study/transmission-check.py artifacts/stage7-scene-study artifacts/stage7-scene-study
      - name: Explicit deep nonwalk material role and independent composition
        if: ${{ always() && matrix.controls == '0' }}
        run: python game/tools/stage7-scene-study/lower-check.py
      - name: Production sources remain unchanged
        if: always()
        run: git diff --exit-code -- shared tools/map-forge
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage7-scene-study-${{ github.sha }}-controls-${{ matrix.controls }}
          path: artifacts/stage7-scene-study
          if-no-files-found: error
          retention-days: 14
