name: Combined scoped built smoke
on:
  push:
    branches: ['qa/combined-scoped-stage3-smoke-20261120']
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      INCLUDE_STAGE14: '1'
      HONRO_ACT4_RELEASE: '1'
      HONRO_ACT5_RELEASE: '1'
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
      - name: Exact approved source and QA-only child
        run: python tools/combined-stage3-smoke/guard.py
      - run: npm ci && npm ci --prefix game
      - run: python -m pip install playwright pillow numpy && python -m playwright install --with-deps chromium
      - name: Baseline normal compiled launch
        run: python tools/combined-stage3-smoke/launch.py stock
      - name: Official Stage3 pristine build and baseline capture
        env:
          HONRO_ACT4_RELEASE: '1'
          HONRO_ACT5_RELEASE: '1'
        run: |
          cp tools/map-forge/naru-body-finish.mjs /tmp/verified-stage3-candidate.mjs
          git show 1e043b09:tools/map-forge/naru-body-finish.mjs > tools/map-forge/naru-body-finish.mjs
          npm run build
          python tools/combined-stage3-smoke/stage3.py baseline
          cp /tmp/verified-stage3-candidate.mjs tools/map-forge/naru-body-finish.mjs
          test "$(git hash-object tools/map-forge/naru-body-finish.mjs)" = 8d781191027ad34da6a5f86630502d6a4fa61c1e
      - name: Official build with existing guards
        run: |
          npm run test:release-guard
          npm run build
          npm run test:production-contract
      - name: Combined built normal launch
        run: |
          python tools/combined-stage3-smoke/launch.py integrated
          python tools/combined-stage3-smoke/verify.py
          python tools/combined-stage3-smoke/stage3.py candidate
          python tools/combined-stage3-smoke/stage3-verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combined-stage3-smoke-proof
          path: |
            _local/reports/combined-stage3-smoke
            _local/reports/stage3-source
