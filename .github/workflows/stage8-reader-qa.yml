name: Stage8 physical movement and manual reader regression
on:
  push:
    branches: ['work/act1-stage8-staging/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-and-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HONRO_QA_OUT: _local/reports/stage8-reader-browser
      HONRO_QA_URL: http://127.0.0.1:8870/HONRO.html
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610
        with:
          node-version: '24'
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - run: npm ci && npm --prefix game ci
      - name: Focused production-native regression
        run: node tests/stage8-staging-reader-regression.mjs && node tests/caption-world-motion.mjs
      - name: Normal gated production build (no bypass)
        run: npm run build
      - run: python -m pip install 'playwright==1.58.0' && python -m playwright install --with-deps chromium
      - name: Actual UI saved-run regression
        run: |
          mkdir -p "$HONRO_QA_OUT"
          git rev-parse HEAD > "$HONRO_QA_OUT/source.txt"
          sha256sum HONRO.html web/manifest.json > "$HONRO_QA_OUT/served-sha256.txt"
          python -m http.server 8870 --bind 127.0.0.1 > "$HONRO_QA_OUT/server.log" 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          sleep 2
          python tests/stage8-staging-reader-browser.py > "$HONRO_QA_OUT/browser.log" 2>&1
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: stage8-reader-${{ github.sha }}
          path: _local/reports/
          retention-days: 7
