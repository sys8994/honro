name: Stage42 V4 concave rim Workshop evidence
on:
  push:
    branches: ['qa/stage42-editor-irregular-v4']
    paths: ['.github/workflows/stage42-editor-irregular-v4.yml', 'tests/stage42-editor-irregular-v4/**']
permissions:
  contents: read
jobs:
  workshop:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      HONRO_ACT4_RELEASE: '1'
      HONRO_ACT5_RELEASE: '1'
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Build disposable Workshop and pin active source
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/qa/stage42-editor-irregular-v4
          mkdir -p "$RUNNER_TEMP/stage42-rim-v4"
          npm ci
          npm ci --prefix game
          npm run build
          echo "a11f9067618fd6d05d55574e8e6f32e4b7d467234c7f09273b56adc56e292869  tests/stage42-editor-irregular-v4/workpad.json" | sha256sum --check -
          node tests/stage42-editor-irregular-v4/source-check.mjs . | tee "$RUNNER_TEMP/stage42-rim-v4/source.json"
          node tests/stage42-editor-irregular-v4/prepare.mjs .
      - name: Author concave rim through real Workshop
        run: |
          set -euo pipefail
          python -m pip install 'playwright==1.58.0' 'Pillow==12.0.0'
          export HONRO_CHROME="$(command -v google-chrome || command -v chromium)"
          test -x "$HONRO_CHROME"
          "$HONRO_CHROME" --version
          python -m http.server 8870 --bind 127.0.0.1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for ((i=0;i<20;i++)); do
            if curl -fsS -o /dev/null http://127.0.0.1:8870/HONRO_WORKSHOP.html; then break; fi
            sleep 1
          done
          python tests/stage42-editor-irregular-v4/smoke.py "$RUNNER_TEMP/stage42-rim-v4"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: stage42-native-v4-browser-evidence
          path: |
            ${{ runner.temp }}/stage42-rim-v4/*.png
            ${{ runner.temp }}/stage42-rim-v4/result.json
            ${{ runner.temp }}/stage42-rim-v4/source.json
          if-no-files-found: warn
          retention-days: 7
