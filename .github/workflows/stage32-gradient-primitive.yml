name: Stage32 original lower gradient primitive diagnostic
on:
  workflow_dispatch:
  push:
    branches: [inspect/stage32-scanline-20261118]
    paths: ['tools/testing/stage32-gradient-primitive/**', '.github/workflows/stage32-gradient-primitive.yml']
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with: {node-version: '22', package-manager-cache: false}
      - run: |
          node tools/testing/stage32-gradient-primitive/fixture.mjs "$RUNNER_TEMP/gradient"
          node tools/testing/stage32-live-ss/actual/run.mjs "$RUNNER_TEMP/gradient" artifacts/evidence
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with: {name: stage32-gradient-primitive, path: artifacts, if-no-files-found: error}
