name: HONRO Stage23 volatile blank terrain-face neutrality (QA only)
on:
  push:
    branches: [qa/stage23-native-blank-a0-21809]
    paths:
      - '.github/workflows/stage23-native-blank-a0.yml'
      - 'tools/stage23-native-neutral/**'
permissions:
  contents: read
  actions: read
jobs:
  stage23-neutral:
    if: github.repository == 'sys8994/honro' && github.event_name == 'push' && github.ref == 'refs/heads/qa/stage23-native-blank-a0-21809'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    strategy:
      fail-fast: false
      matrix:
        canvas: ['1440x900','390x844']
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 4
          persist-credentials: false
      - name: Verify current pinned public release and add-only transport
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          W="$(mktemp -d "$RUNNER_TEMP/stage23-native-neutral.XXXXXX")"
          mkdir "$W/out"
          echo "WORK=$W" >> "$GITHUB_ENV"
          python tools/stage23-native-neutral/audit.py authority "$W"
      - name: Observe anonymous stock A1 A2 and volatile empty A0
        env:
          CANVAS: ${{ matrix.canvas }}
        run: |
          set -euo pipefail
          test -z "${GH_TOKEN:-}${GITHUB_TOKEN:-}"
          python -m venv "$WORK/venv"
          V="$WORK/venv/bin/python"
          "$V" -m pip --disable-pip-version-check install playwright==1.62.0 Pillow==13.0.0
          "$V" -m playwright install --with-deps chromium
          "$V" tools/stage23-native-neutral/audit.py app "$WORK" "$CANVAS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && env.WORK != ''
        with:
          name: honro-stage23-native-blank-a0-21809-${{ matrix.canvas }}
          path: ${{ env.WORK }}/out
          if-no-files-found: error
          retention-days: 7
