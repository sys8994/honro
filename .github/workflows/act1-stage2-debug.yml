name: Diagnose Stage2 entry without publication
on:
  push:
    branches: ['work/act1-stage2-debug/**']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HONRO_ACT1_STAGE2_CANDIDATE: '1'
      HONRO_ACT4_RELEASE: '1'
      HONRO_QA_URL: http://127.0.0.1:8870/HONRO.html
      HONRO_QA_OUT: _local/reports/stage2-entry-debug
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Prepare isolated diagnostic preview
        run: |
          set -euo pipefail
          npm ci
          npm ci --prefix game
          node tests/stage2-continuous-candidate.mjs
          node tests/stage2-art-entry-fixture.mjs
          node tools/act4-ci/refresh-stage31-probes.mjs prepare "$HONRO_QA_OUT/engine-probes"
          # Evidence preview only, never published or promoted. Release still requires the unchanged production gate.
          node workshop/build.mjs
          python -m pip install 'playwright==1.58.0'
          python -m playwright install --with-deps chromium
      - name: Capture actual navigation and failure state
        run: |
          set -euo pipefail
          mkdir -p "$HONRO_QA_OUT"
          python -m http.server 8870 --bind 127.0.0.1 > "$HONRO_QA_OUT/server.log" 2>&1 &
          server=$!; trap 'kill "$server" 2>/dev/null || true' EXIT
          sleep 2
          python tools/act1-vector-production/browser-stage2.py > "$HONRO_QA_OUT/browser.log" 2>&1
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: stage2-entry-debug-${{ github.sha }}
          path: _local/reports/stage2-entry-debug/
          retention-days: 7
