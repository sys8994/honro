name: Stage15 H cave-facing rim native evidence (never deploy)
on:
  push:
    branches: [qa/stage15-native-rim-f-2939958-20261121]
permissions:
  contents: read
jobs:
  stage15-f-native:
    if: github.repository == 'sys8994/honro' && github.event_name == 'push' && github.ref == 'refs/heads/qa/stage15-native-rim-f-2939958-20261121'
    runs-on: ubuntu-24.04
    timeout-minutes: 33
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 6
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
      - name: Exact disposable B and F source/real build, no publish
        shell: bash
        run: |
          set -euo pipefail
          ROOT=$GITHUB_WORKSPACE
          BASE=2939958cc87407ef60b58720bb6e086b8559031b
          R1=50c30591fea555ee50e13264e301544d24ed1059
          R2=b0aea1b6e2976ca7bbbcf0b794a5922087afb800
          R3=7c766a0166b44b0f8cbf11c6943ec62e1f66b551
          R4=6ef700a544228f6d1d3e97d73cf91b54cf696bd1
          test "$(git show -s --format=%P HEAD)" = "$R4"
          test "$(git show -s --format=%P "$R4")" = "$R3"
          test "$(git show -s --format=%P "$R3")" = "$R2"
          test "$(git show -s --format=%P "$R2")" = "$R1"
          test "$(git show -s --format=%P "$R1")" = "$BASE"
          diff -u <(printf 'M\t%s\n' .github/workflows/stage15-native-rim-F-qa.yml tools/stage15-F-native-qa/{f_asset.py,source.py,study-F-proof.json}) <(git diff --name-status --no-renames "$R4" HEAD)
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "$BASE^{tree}")" = 08e22a8cc0ab608e125ad73f8e8e1c288d8c4c74
          test "$(git rev-parse "$BASE:shared/data/act2/stage15-compact-package.json")" = ac4fb9854c5bf713507564755848b6c2af1f8f1b
          Q="$ROOT/tools/stage15-F-native-qa"
          W="$(mktemp -d "$RUNNER_TEMP/stage15-native-rim-f.XXXXXX")"
          mkdir "$W/out"
          echo "WORK=$W" >> "$GITHUB_ENV"
          echo "QA=$Q" >> "$GITHUB_ENV"
          printf 'A\t%s\n' .github/workflows/stage15-native-rim-F-qa.yml tools/stage15-F-native-qa/{PINS.json,B-native-44844285051.json,capture.py,mask.json,method.txt,patch.py,source.py,verify.py,f_asset.py,study-F-proof.json,roof-contact.json} | LC_ALL=C sort > "$W/files"
          git diff --name-status --no-renames "$BASE" HEAD | LC_ALL=C sort | diff - "$W/files"
          for side in A B F; do git worktree add --detach "$W/$side" "$BASE"; done
          for side in B F; do
            python "$Q/patch.py" "$W/A" "$W/$side" > "$W/out/upper-$side.json"
            node --check "$W/$side/shared/runtime/renderer.js"
          done
          python "$Q/f_asset.py" "$W/A" "$W/F" > "$W/out/rim-F.json"
          test "$(git hash-object "$W/F/shared/data/act2/stage15-compact-package.json")" = 7a406b33edc5dac942245fc018cf827c2b66ad3c
          node - "$W/F" <<'JS'
          const [,,root]=process.argv;
          require(root+'/shared/map/vector-art.js');
          const p=require(root+'/shared/data/act2/stage15-compact-package.json');
          const v=p.assets.find(a=>a.id==='act2-compact:stage15-act2-stage15-traced-west-flat-v2-1').vector;
          const issues=HonroVectorArt.validate(v);
          if(issues.length)throw Error(issues.join(';'));
          JS
          (cd "$W/A" && npm ci) > "$W/out/deps-A.log" 2>&1 || { tail -100 "$W/out/deps-A.log"; exit 1; }
          for side in B F; do
            (
              cd "$W/$side"
              npm ci && npm ci --prefix game && npm run test:release-guard && npm run build && npm run test:production-contract
            ) > "$W/out/build-$side.log" 2>&1 || { tail -100 "$W/out/build-$side.log"; exit 1; }
          done
          for side in A B F; do
            want=''
            if [[ "$side" == B ]]; then want=$' M shared/runtime/renderer.js'; fi
            if [[ "$side" == F ]]; then want=$' M shared/data/act2/stage15-compact-package.json\n M shared/runtime/renderer.js'; fi
            test "$(git -C "$W/$side" status --porcelain=v1 -uall -- shared tools game tests package.json package-lock.json workshop/build.mjs)" = "$want"
          done
      - name: Normal application captures, exact scope, original renderer only
        timeout-minutes: 23
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$WORK/venv"
          V="$WORK/venv/bin/python"
          "$V" -m pip --disable-pip-version-check install playwright==1.62.0 Pillow==13.0.0 numpy
          "$V" -m playwright install --with-deps chromium
          python -m http.server 18842 --bind 127.0.0.1 --directory "$WORK/B" > "$WORK/out/http-B.log" 2>&1 &
          bp=$!
          python -m http.server 18843 --bind 127.0.0.1 --directory "$WORK/F" > "$WORK/out/http-F.log" 2>&1 &
          fp=$!
          trap 'kill "$bp" "$fp" 2>/dev/null || true' EXIT
          for p in 18842 18843; do curl -fsS --retry 10 --retry-connrefused "http://127.0.0.1:$p/HONRO.html" -o /dev/null; done
          export AUDIT_A="$WORK/A" AUDIT_B="$WORK/B" AUDIT_STAGE=15
          for side in B F; do
            export AUDIT_ARM="$side" AUDIT_TREE="$WORK/$side" AUDIT_OUT="$WORK/out/$side"
            if [[ "$side" == B ]]; then export AUDIT_PORT=18842; else export AUDIT_PORT=18843; fi
            "$V" "$QA/source.py"
          done
          for side in B F; do
            export AUDIT_ARM="$side" AUDIT_TREE="$WORK/$side" AUDIT_OUT="$WORK/out/$side"
            if [[ "$side" == B ]]; then export AUDIT_PORT=18842; else export AUDIT_PORT=18843; fi
            "$V" "$QA/capture.py"
          done
          "$V" "$QA/verify.py" "$WORK/out"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: stage15-rim-H-native-b-vs-h
          path: ${{ env.WORK }}/out
          if-no-files-found: error
          retention-days: 7
