name: Verify the published Act 6 ending preview
on:
  push:
    branches: ['qa/act6-ending-live-20261125']
    paths: ['.github/workflows/act6-ending-readback.yml']
permissions:
  contents: read
jobs:
  live:
    if: github.repository == 'sys8994/honro' && github.ref == 'refs/heads/qa/act6-ending-live-20261125'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Verify published asset digests and actual debug clicks
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/ending-live"
          mkdir -p "$OUT"
          git fetch --depth=1 origin 2cd0382d8484e024389455d8c6f52f6560ccfc54
          git fetch --depth=1 origin fba1d8be263e36121f276d2b5100f90312fcb60c
          git show "fba1d8be263e36121f276d2b5100f90312fcb60c:tools/act6-journey/witness.py" > tools/act6-journey/witness.py
          git show "2cd0382d8484e024389455d8c6f52f6560ccfc54:tools/act6-ending-qa/debug_ui.py" > tools/act6-ending-readback/debug_ui.py
          python -m pip install 'playwright==1.58.0' 'Pillow==12.0.0'
          python -m playwright install --with-deps chromium
          mkdir -p "$OUT/map" "$OUT/ending"
          python tools/act6-ending-readback/live.py 9a5bc8cd24f709b620079a2e873cf1e0eabda230a56fe889d23538adf9eab1f1 "$OUT/ending" > "$OUT/ending/CHROME.log" 2>&1 &
          ending=$!
          python tools/act6-journey/live.py 9a5bc8cd24f709b620079a2e873cf1e0eabda230a56fe889d23538adf9eab1f1 "$OUT/map" > "$OUT/map/CHROME.log" 2>&1 &
          map=$!
          fail=0
          wait "$ending" || fail=1
          wait "$map" || fail=1
          exit "$fail"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: ending-live-verified
          path: ${{ runner.temp }}/ending-live/
          retention-days: 7
