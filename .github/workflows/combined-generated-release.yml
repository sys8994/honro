name: Build combined generated release candidate only
on:
  push:
    branches: ['work/terrain-monster-generated-rc-20261118']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      OUT: _local/reports/terrain-monster-generated-rc
      HONRO_ACT4_RELEASE: '1'
      HONRO_ACT5_RELEASE: '1'
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Verify source and public head
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          git fetch --depth=1 origin 09ac90235b89031b6df8d88cde4c16f39aba78f7 7d238d20663c3ceffe430eb0304e01516ae625cf
          git diff --exit-code 09ac90235b89031b6df8d88cde4c16f39aba78f7 -- shared game/src game/config tools/map-forge tools/environment tools/stage6-prototype
          test "$(git ls-remote origin refs/heads/master | cut -f1)" = 7d238d20663c3ceffe430eb0304e01516ae625cf
      - run: npm ci && npm ci --prefix game
      - name: Register actual successful public graph and build officially
        run: |
          set -euo pipefail
          node --input-type=module -e 'import fs from "node:fs";const m=JSON.parse(fs.readFileSync("web/manifest.json"));for(const sha of new Set((m.publishedGenerations||[]).map(g=>g.sourceSha||g.commit))){if(!/^[a-f0-9]{40}$/.test(sha))throw Error("Invalid published source "+sha);console.log(sha);}' > "$OUT/published-source-refs.txt"
          while read -r sha; do git fetch --no-tags --depth=1 origin "$sha"; done < "$OUT/published-source-refs.txt"
          node tools/release/retain-published-web.mjs 7d238d20663c3ceffe430eb0304e01516ae625cf --published-at 2026-11-17T05:51:48.1757357Z --evidence https://github.com/sys8994/honro/actions/runs/44026770659 | tee "$OUT/retention.log"
          npm run build > "$OUT/build.log" 2>&1
          node tests/combined-generated-release-graph.mjs
          git diff --exit-code 09ac90235b89031b6df8d88cde4c16f39aba78f7 -- shared game/src game/config tools/map-forge tools/environment tools/stage6-prototype
      - name: Independent final generated Game and Workshop boot
        run: |
          set -euo pipefail
          python -m pip install 'playwright==1.58.0'
          python -m playwright install --with-deps chromium
          python -m http.server 8870 --bind 127.0.0.1 > "$OUT/server.log" 2>&1 &
          server=$!; trap 'kill "$server" 2>/dev/null || true' EXIT
          sleep 2
          timeout 600s python tests/combined-generated-release-boot.py
      - name: Preserve generated candidate on separate branch only
        run: |
          set -euo pipefail
          git add -- HONRO.html HONRO_WORKSHOP.html index.html web workshop/HONRO_MAP_WORKSHOP.html
          git diff --cached --stat > "$OUT/generated-diff.txt"
          git diff --cached --name-status > "$OUT/generated-files.txt"
          git -c user.name='honro release automation' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Build verified combined terrain monster candidate from $GITHUB_SHA"
          git push origin "HEAD:refs/heads/release/terrain-monster-generated/$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree} > "$OUT/generated-commit.txt"
          git ls-remote origin "refs/heads/release/terrain-monster-generated/$GITHUB_SHA" > "$OUT/remote-generated-ref.txt"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: terrain-monster-generated-rc
          path: ${{ env.OUT }}
          if-no-files-found: error
