name: Verify stage28 source foundation domain
on:
  push:
    branches: ['fix/stage28-foundation-domain-20261117']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci && npm ci --prefix game
      - name: Preserve integrated candidates, geometry and collision
        run: |
          node tools/act1-vector-production/check-edge-integration-manifest.mjs
          node tests/stage28-foundation-domain.mjs
      - name: Independent Native lower portrait view
        run: HONRO_AUDIT_STAGE=28 HONRO_AUDIT_LABEL=stage28-ci HONRO_AUDIT_VIEW=edge-portrait-2 node tools/act1-vector-production/capture-stage-independent-audit.mjs
      - name: Build official runtime
        run: npm run build
