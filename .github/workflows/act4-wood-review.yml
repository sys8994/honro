name: Review Act4 timber layer cleanup
on:
  push:
    branches: ['work/act4-wood-direct/**']
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HONRO_CAPTURE_URL: http://127.0.0.1:8870/HONRO.html
      OUT: _local/reports/wood-review
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Install and capture the unchanged published baseline
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          npm ci
          npm ci --prefix game
          python -m pip install 'playwright==1.58.0'
          python -m playwright install chromium
          if ! python -c 'from playwright.sync_api import sync_playwright; w=sync_playwright().start(); b=w.chromium.launch(headless=True); b.close(); w.stop()'; then python -m playwright install-deps chromium; fi
          python -m http.server 8870 --bind 127.0.0.1 > "$OUT/server-before.log" 2>&1 &
          server=$!;trap 'kill "$server" 2>/dev/null || true' EXIT
          sleep 2
          HONRO_CAPTURE_OUT="$OUT/before" python tools/act4-ci/wood-cleanup/capture.py
      - name: Prepare artwork only and build through the unchanged release gate
        run: |
          set -euo pipefail
          cp shared/data/act4/world.json _local/wood-before.json
          python tools/act4-ci/wood-cleanup/prepare.py _local/wood-before.json shared/data/act4/world.json | tee "$OUT/change.json"
          node tools/act4-source/world-source.mjs pack
          mapfile -t refs < <(node --input-type=module -e 'import fs from "node:fs";import {selectPublishedGenerations} from "./shared/web-retention.mjs";for(const g of selectPublishedGenerations(JSON.parse(fs.readFileSync("web/manifest.json")).publishedGenerations,{now:Date.now()})){if(!/^[a-f0-9]{40}$/.test(g.sourceSha))throw Error("Invalid ref");console.log(g.sourceSha)}')
          git fetch --no-tags --depth=1 origin 64b79c64a3ddcf030402d69455f90d91cae952f0 "${refs[@]}"
          node tools/release/retain-published-web.mjs 64b79c64a3ddcf030402d69455f90d91cae952f0 --published-at 2026-11-01T03:56:50Z --evidence https://github.com/sys8994/honro/actions/runs/41271024772
          HONRO_ACT4_RELEASE=1 npm run build | tee "$OUT/build.log"
      - name: Capture the candidate in the actual engine
        run: |
          set -euo pipefail
          python -m http.server 8870 --bind 127.0.0.1 > "$OUT/server-after.log" 2>&1 &
          server=$!;trap 'kill "$server" 2>/dev/null || true' EXIT
          sleep 2
          HONRO_CAPTURE_OUT="$OUT/after" python tools/act4-ci/wood-cleanup/capture.py
          python tools/act4-ci/wood-cleanup/resume.py
      - name: Preserve the unapproved candidate separately
        run: |
          git add shared/data/act4/world.parts web HONRO.html HONRO_WORKSHOP.html index.html
          git -c user.name='honro release automation' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Prepare bounded Inkscape timber candidate for visual review'
          git push origin HEAD:refs/heads/work/act4-wood-candidate/${GITHUB_SHA}
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: wood-review-${{ github.sha }}
          path: _local/reports/wood-review/
          retention-days: 7
