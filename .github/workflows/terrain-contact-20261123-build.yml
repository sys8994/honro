name: Verify campaign terrain contact before publication
run-name: Terrain contact baseline parity · b7a3ecd3
on:
  push:
    branches: ['qa/contact-art-collision-20261123-build']
permissions:
  contents: write
concurrency:
  group: terrain-contact-20261123
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'sys8994/honro' && github.ref == 'refs/heads/qa/contact-art-collision-20261123-build'
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    env:
      SOURCE_SHA: b7a3ecd3f33309c6f11c0106a9bf228d76487937
      SOURCE_TREE: 41350b5546c8261c41b8c9689ce9ba4ea15b9438
      GENERATED_TREE: 09c3663fd8e2bffb5a9c0b9471c010ee7a8dbe1c
      GENERATED_REF: refs/heads/repair/contact-art-collision-20261123-generated
      OUT: _local/reports/contact-art-collision-20261123
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Verify exact source and focused contact contracts
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test ! -e .github/workflows/terrain-contact-20261123-build.yml
          mkdir -p "$OUT"
          { git rev-parse HEAD HEAD^{tree}; node --version; python --version; } > "$OUT/source.txt"
          sha256sum package-lock.json game/package-lock.json >> "$OUT/source.txt"
          npm ci
          npm ci --prefix game
          {
            node game/tests/terrain-contact-ink.mjs
            node tests/act5-terrain-contact.mjs
            node tests/terrain-readability.mjs
            node tests/one-way-platform-physics.mjs
            python -X utf8 tests/release-guard.py
          } 2>&1 | tee "$OUT/contracts.log"
      - name: Build official graph and bind exact generated tree
        run: |
          set -euo pipefail
          npm run build | tee "$OUT/build.log"
          sha256sum HONRO.html HONRO_WORKSHOP.html index.html web/manifest.json > "$OUT/build.sha256"
          git add -A -- web HONRO.html HONRO_WORKSHOP.html index.html
          git diff --cached --check
          git diff --cached --name-status > "$OUT/generated-paths.txt"
          actual=$(git write-tree)
          printf 'expected %s\nactual   %s\n' "$GENERATED_TREE" "$actual" | tee "$OUT/tree.txt"
          test "$actual" = "$GENERATED_TREE"
      - name: Chromium route recovery on the same generated build
        run: |
          set -euo pipefail
          python -m pip install 'playwright==1.58.0'
          python -m playwright install --with-deps chromium
          python -X utf8 tests/act5-route-recovery-browser.py --skip-save | tee "$OUT/browser.log"
          BASE_SHA=0bbb8aadd3e7416edc5a20fbf8969f300904047e
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/contact-baseline" "$BASE_SHA"
          export CONTACT_BASELINE="$RUNNER_TEMP/contact-baseline"
          python -X utf8 - <<'PY' | tee "$OUT/browser-objectives.log"
          import collections,hashlib,os,pathlib,re,subprocess,sys
          test="tests/act5-encounter-browser.py"
          out=pathlib.Path(os.environ['OUT']).absolute()
          candidate=pathlib.Path.cwd()
          baseline=pathlib.Path(os.environ['CONTACT_BASELINE'])
          allow_known_46='assert start["counts"]["spawned"]==0 and start["n"]==declared["enemyBudget"]'
          results={}
          def case(root,stage,tag):
              p=subprocess.run([sys.executable,'-X','utf8',test],cwd=root,env={**os.environ,'HONRO_ACT5_CHECK':str(stage)},capture_output=True,text=True,timeout=210)
              (out/f'{stage}-{tag}.stdout').write_text(p.stdout)
              (out/f'{stage}-{tag}.stderr').write_text(p.stderr)
              if p.stdout: print(p.stdout,end='')
              if p.stderr: print(p.stderr,end='',file=sys.stderr)
              return p
          for stage in (42,43,44,46,47,50):
              a=case(baseline,stage,'baseline')
              b=case(candidate,stage,'candidate')
              if a.returncode==0 and b.returncode==0:
                  results[stage]='PASS actual Chromium campaign'
              elif stage==46 and a.returncode==b.returncode==1 and allow_known_46 in a.stderr and allow_known_46 in b.stderr:
                  results[stage]='BASELINE_MATCH existing opening enemy-budget assertion; native direct route check passed separately'
              else:
                  results[stage]=f'UNVERIFIED baseline={a.returncode} candidate={b.returncode}'
          import json
          (out/'stage-objective-results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2))
          assert all(not x.startswith('UNVERIFIED') for x in results.values()),results
          PY
          python -X utf8 - <<'PY'
          import os,sys,pathlib,runpy,json,functools,http.server,threading,contextlib
          from playwright.sync_api import sync_playwright
          out=pathlib.Path(os.environ['OUT'])
          sys.path.insert(0,'tests')
          m=runpy.run_path('tests/act5-encounter-browser.py')
          with m['serve_game']() as url,sync_playwright() as pw:
              browser=m['launch'](pw)
              page=browser.new_page(viewport={'width':1280,'height':800})
              errors=[]
              page.on('pageerror',lambda error:errors.append(str(error)))
              page.goto(url+'/HONRO.html',wait_until='domcontentloaded')
              page.wait_for_function('!!window.HonroApp')
              def launch(stage):
                  page.evaluate(m['SETUP'],stage)
                  m['skip'](page)
                  page.wait_for_function('HonroApp.canInput()')
              @contextlib.contextmanager
              def baseline_http():
                  h=functools.partial(http.server.SimpleHTTPRequestHandler,directory=os.environ['CONTACT_BASELINE'])
                  with http.server.ThreadingHTTPServer(('127.0.0.1',0),h) as server:
                      thread=threading.Thread(target=server.serve_forever,daemon=True)
                      thread.start()
                      try: yield f'http://127.0.0.1:{server.server_port}'
                      finally: server.shutdown();thread.join()
              def measure_46(location):
                  page.goto(location+'/HONRO.html',wait_until='domcontentloaded')
                  page.wait_for_function('!!window.HonroApp')
                  launch(46)
                  return page.evaluate("""()=>{const b=HonroApp.engine.b,d=HONRO_CONTENT.stages[45],u=b.units.filter(v=>v.side===1&&!v.honroObjectiveTarget);return {stage:b.honroStage,active:b.enemyLimit,declaredActive:d.active,budget:d.enemyBudget,total:u.length,units:u.map(v=>v.id).sort(),spawned:b.honroCounters.spawned,initial:b.honroCounters.initialEnemies,declaredInitial:d.enemies};}""")
              with baseline_http() as prior:
                  parity={'baseline':measure_46(prior),'candidate':measure_46(url)}
              assert parity['baseline']==parity['candidate'],parity
              (out/'46-opening-budget-parity.json').write_text(json.dumps(parity,ensure_ascii=False,indent=2))
              launch(38)
              receipt=page.evaluate("""()=>{const b=HonroApp.engine.b;return {stage:b.honroStage,canonical:b.honroCanonical,origin:b.honroMapOrigin,provider:b.honroLandmarks?.some(l=>l.asset?.id==='act4-handoff:38:cave-contact')}}""")
              assert receipt=={'stage':38,'canonical':True,'origin':'campaign','provider':True},receipt
              page.evaluate("""()=>Object.assign(HonroApp.scene,{x:4530,y:1680,scale:.67,manual:true})""")
              page.wait_for_timeout(600)
              page.screenshot(path=str(out/'38-chromium.png'))
              assert not errors,errors
              (out/'38-normal-launch.json').write_text(json.dumps(receipt))
              browser.close()
          PY
          sha256sum -c "$OUT/build.sha256"
          test "$(git write-tree)" = "$GENERATED_TREE"
      - name: Preserve the approved generated child on one new repair verification ref
        run: |
          set -euo pipefail
          test -z "$(git ls-remote origin "$GENERATED_REF")"
          commit=$(git -c user.name='honro release automation' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit-tree "$GENERATED_TREE" -p "$SOURCE_SHA" -m "Build verified campaign terrain contact candidate")
          test "$(git rev-parse "$commit^")" = "$SOURCE_SHA"
          git push origin "$commit:$GENERATED_REF"
          printf '%s\n' "$commit" | tee "$OUT/generated-commit.txt"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: terrain-contact-b7a3ecd3-proof
          path: |
            _local/reports/contact-art-collision-20261123/
            _local/reports/act5/recovery/local.json
            _local/reports/act5/combat-checkpoints.json
          retention-days: 7
