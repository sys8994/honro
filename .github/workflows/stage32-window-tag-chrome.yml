name: Stage32 window sequential foreground roles
on:
  workflow_dispatch:
  push:
    branches: [inspect/stage32-scanline-20261118]
    paths:
      - tools/testing/stage32-window-tag-chrome/**
      - .github/workflows/stage32-window-tag-chrome.yml
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          path: harness
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          ref: af5b77e15accea03470fdfd0c6cb00a0bb12c5e9
          path: product
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci && npm ci --prefix game
        working-directory: product
      - run: python3 -m pip install Pillow numpy
      - name: One-page sequential foreground-role diagnostic
        run: |
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          D=harness/tools/testing/stage32-window-tag-chrome
          node "$D/prepare.mjs" "$PWD/product" "$PWD/harness" "$RUNNER_TEMP/window-tags/input"
          node harness/tools/testing/stage32-j-window-active/run.mjs "$RUNNER_TEMP/window-tags/input" "$RUNNER_TEMP/window-tags/evidence"
          python3 "$D/check.py" "$RUNNER_TEMP/window-tags/evidence"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: stage32-window-tags
          path: ${{ runner.temp }}/window-tags/evidence
          if-no-files-found: warn
