name: Read back the published Act 6 journey map
on:
  push:
    branches: ['qa/act6-journey-map-live-20261125']
    paths: ['.github/workflows/act6-journey-map-live.yml']
permissions:
  contents: read
jobs:
  live:
    if: github.repository == 'sys8994/honro' && github.ref == 'refs/heads/qa/act6-journey-map-live-20261125'
    runs-on: ubuntu-22.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Verify asset and open the map on both viewports
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/act6-journey-live"
          python -m pip install 'playwright==1.58.0'
          python -m playwright install --with-deps chromium
          python tools/act6-journey/live.py 955c983c3f6a1c1e810d8b6a495834fecb0f7470c557d9aaec1627dde4f102fd "$RUNNER_TEMP/act6-journey-live" > "$RUNNER_TEMP/act6-journey-live/CHROME.log" 2>&1
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: act6-journey-map-live
          path: ${{ runner.temp }}/act6-journey-live/
          retention-days: 7
