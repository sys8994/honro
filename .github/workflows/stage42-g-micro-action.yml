name: Stage42 G one ordinary input action
on:
  push:
    branches: ['qa/stage42-g-micro-action']
    paths: ['.github/workflows/stage42-g-micro-action.yml','tests/stage42-g-micro-action/**']
permissions:
  contents: read
jobs:
  entry:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 5
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Exact G-only packet and detached host
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/qa/stage42-g-micro-action
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          PIN=1e043b09d4ce107e1d2dcf70fe2274dff7098476
          test "$(git rev-parse HEAD^)" = 634394c8a86e31c70976550407bb5c63a8fba113
          M=tests/stage42-g-micro-action/manifest.json
          echo "73179d57c7b3a26cecc36561f6d9ce9808874111be192bdae99c0e134990933b  $M" | sha256sum -c -
          python - <<'PYGUARD'
          import json,hashlib,pathlib,subprocess
          m=json.loads(pathlib.Path('tests/stage42-g-micro-action/manifest.json').read_text())
          def git(*a):return subprocess.check_output(['git',*a],text=True).strip()
          assert git('rev-parse','HEAD^')==m['parent']
          assert sorted(git('diff','--name-only','HEAD^','HEAD').splitlines())==sorted(m['modifyOnly'])
          assert sorted(git('diff','--name-only','--diff-filter=M','HEAD^','HEAD').splitlines())==sorted(m['modifyOnly'])
          assert hashlib.sha256(pathlib.Path('tests/stage42-g-micro-action/micro.py').read_bytes()).hexdigest()==m['microSha256']
          for name,sha in m['inherited'].items():assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==sha,name
          for r in m['workflowBlobs']:assert git('rev-parse','HEAD:'+r['path'])==r['sha'],r['path']
          assert len(m['workflowBlobs'])==89
          PYGUARD
          test ! -e "$RUNNER_TEMP/g-entry-fixture"
          git worktree add --detach "$RUNNER_TEMP/g-entry-fixture" "$PIN"
      - name: Prepare G source and exact 46 contacts in temporary host only
        run: |
          set -euo pipefail
          Q="$GITHUB_WORKSPACE/tests/stage42-g-campaign-entry"
          cd "$RUNNER_TEMP/g-entry-fixture"
          npm ci
          npm ci --prefix game
          mkdir -p "$RUNNER_TEMP/g-evidence"
          export G_SOURCE_DIAGNOSTICS="$RUNNER_TEMP/g-evidence"
          node "$Q/source-contract.mjs" baseline "$PWD" "$RUNNER_TEMP/g-source-baseline.json"
          python "$Q/prepare.py" "$PWD"
          mkdir -p "$RUNNER_TEMP/g-evidence"
          node "$Q/source-contract.mjs" candidate "$PWD" "$RUNNER_TEMP/g-source-baseline.json" "$RUNNER_TEMP/g-evidence/source-invariants.json"
          sha256sum shared/act5-world.mjs shared/data/act5/stage42-g-domain.witness.mjs > "$RUNNER_TEMP/g-owned.sha"
          HONRO_ACT4_RELEASE=1 HONRO_ACT5_RELEASE=1 npm run build
          test "$(git rev-parse HEAD)" = 1e043b09d4ce107e1d2dcf70fe2274dff7098476
          if git symbolic-ref -q HEAD; then exit 1; fi
          sha256sum -c "$RUNNER_TEMP/g-owned.sha"
          git -C "$GITHUB_WORKSPACE" diff --exit-code
          git -C "$GITHUB_WORKSPACE" diff --cached --exit-code
      - name: Bounded normal clearance walking and one displayed shot only
        run: |
          set -euo pipefail
          python -m pip install 'playwright==1.58.0'
          export HONRO_CHROME="$(command -v google-chrome || command -v chromium)"
          python -m http.server 8884 --bind 127.0.0.1 --directory "$RUNNER_TEMP/g-entry-fixture" &
          pid=$!; trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..20}; do if curl -fsS -o /dev/null http://127.0.0.1:8884/HONRO.html; then break; fi; sleep 1; done
          timeout 150s python tests/stage42-g-micro-action/micro.py http://127.0.0.1:8884/HONRO.html "$RUNNER_TEMP/g-evidence/micro" tests/stage42-g-campaign-entry/observe.py "$RUNNER_TEMP/g-evidence/source-invariants.json"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: stage42-g-one-ordinary-action
          path: |
            ${{ runner.temp }}/g-evidence/source-invariants.json
            ${{ runner.temp }}/g-evidence/source-baseline-diagnostics.json
            ${{ runner.temp }}/g-evidence/source-candidate-diagnostics.json
            ${{ runner.temp }}/g-evidence/micro/micro.json
            ${{ runner.temp }}/g-evidence/micro/before.png
            ${{ runner.temp }}/g-evidence/micro/after.png
          if-no-files-found: warn
          retention-days: 7
