name: Verify P1-2 encounter revisions
on:
  push:
    branches: ['qa/encounter-p12-20261124-*']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    env:
      HONRO_ACT4_RELEASE: '1'
      SOURCE_REF: 8de0477a054f47ed2b8c6c6047075ef8f786623e
      OUT: _local/reports/encounter-p12
      HONRO_INTENDED: "8,10,12,17,20,21,25,26,28,39,41,42,44"
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 5
      - name: Use reviewed source, without verification-only files
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/encounter-p12"
          cp -r .github/encounter-p12/. "$RUNNER_TEMP/encounter-p12/"
          git switch --detach "$SOURCE_REF"
          test "$(git rev-parse HEAD)" = "$SOURCE_REF"
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile production bundle
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          npm ci
          npm ci --prefix game
          npm --prefix game run typecheck | tee "$OUT/typecheck.log"
          cp web/manifest.json "$RUNNER_TEMP/encounter-p12/published-f59.json"
          node tools/release/register-current-publication.mjs --source-manifest "$RUNNER_TEMP/encounter-p12/published-f59.json" --expected-blob-sha 5c23ecf3522b3aad2678886d07f00d314bd1a31a --source-sha f59c3365e4e19ad8ec6ca2c23edf1c814bafefa9 --published-at 2026-11-24T00:00:42Z --evidence https://github.com/sys8994/honro/actions/runs/45293242952 | tee "$OUT/retention.log"
          npm run build | tee "$OUT/build.log"
          printf '%s\n' "$SOURCE_REF" > "$OUT/exact-source.txt"
          sha256sum web/manifest.json HONRO.html > "$OUT/compiled-hashes.txt"
      - name: Validate focused encounter invariants
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/encounter-p12/run.sh" 2>&1 | tee "$OUT/encounter-gates.log"
      - name: Create verified scoped build branch
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          paths=set(subprocess.check_output(['git','diff','HEAD','--name-only','-z']).decode().split('\0'))|set(subprocess.check_output(['git','ls-files','--others','--exclude-standard','-z']).decode().split('\0'))
          roots={'HONRO.html','HONRO_WORKSHOP.html','index.html','workshop/HONRO_MAP_WORKSHOP.html'}
          unexpected=sorted(p for p in paths if p and p not in roots and not p.startswith('web/'))
          assert not unexpected, unexpected
          PY
          git add -- HONRO.html HONRO_WORKSHOP.html index.html workshop/HONRO_MAP_WORKSHOP.html web
          git diff --cached --check
          git config user.name 'HONRO release verification'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Build verified P1-2 encounter revisions"
          target="repair/encounter-p12-generated-${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/$target"
          expected="$(git rev-parse HEAD)"
          actual="$(git ls-remote origin "refs/heads/$target" | cut -f1)"
          test "$actual" = "$expected"
          printf '%s\n' "$expected" > "$OUT/generated-head.txt"
          printf '%s\n' "$target" > "$OUT/generated-branch.txt"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: encounter-p12-${{ github.run_id }}
          path: _local/reports/encounter-p12/
          retention-days: 7
