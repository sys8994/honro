name: Observe published Stage23 combat and HUD
on:
  push:
    branches: ['work/stage23-public-combat-20261104']
permissions:
  contents: read
  actions: read
concurrency:
  group: stage23-public-combat-observation
  cancel-in-progress: false
jobs:
  public-combat:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned existing test dependencies
        run: pip install playwright==1.51.0 && python -m playwright install --with-deps chromium
      - name: Reuse exact earned original40 checkpoints without another native run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 41803426491 --repo sys8994/honro --name stage23-public-combat-observation --dir _local/stage23-earned
          mkdir -p _local/reports
          cp -R _local/stage23-earned/stage23-public-combat-native _local/reports/stage23-public-combat-native
          echo '64f7eb520228ef2d96c3b17b3c643d86d478450794dc5682b1fabeb83ac65e6c  _local/reports/stage23-public-combat-native/round-8.json' | sha256sum --check
          echo 'd4e2d551ebf01a6c610799bc52d0fbb75f57519ba814ffbf2ac43c2ac6855fb1  _local/reports/stage23-public-combat-native/round-19.json' | sha256sum --check
      - name: Observe existing published HTML with real keyboard and touch
        run: python tools/stage23-qa/public-combat-review.py
      - name: Preserve approved synthetic Stage23 observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage23-public-combat-observation
          path: |
            _local/reports/stage23-public-combat-native
            _local/reports/stage23-public-combat
          if-no-files-found: warn
          retention-days: 14
