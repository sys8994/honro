name: HONRO Stage40 and Stage46 exact anonymous public readback
on:
  push:
    branches: [qa/stage40-46-native-public-eaf-successor-r3]
    paths: [".github/workflows/stage40-46-native-public.yml", "tools/stage40-46-native-public/**"]
permissions:
  contents: read
  actions: read
jobs:
  read-public:
    if: github.repository == 'sys8994/honro' && github.event_name == 'push' && github.ref == 'refs/heads/qa/stage40-46-native-public-eaf-successor-r3'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact published master and approved real union artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/stage40-46-native-public/guard.py acquire "$RUNNER_TEMP/stage40-46-native-public-successor"
      - name: Verify anonymously retained URL bytes; use read-only live native app
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/stage40-46-native-public-successor"
          T="$GITHUB_WORKSPACE/tools/stage40-46-native-public"
          python3 -B "$T/guard.py" prepare "$W"
          python3 -m venv "$W/playwright"
          V="$W/playwright/bin/python"
          "$V" -m pip --disable-pip-version-check install playwright==1.62.0 Pillow==13.0.0
          "$V" -m playwright install --with-deps chromium
          python3 -m http.server 18961 --bind 127.0.0.1 --directory "$W/A" >"$W/out/http-A.log" 2>&1 & a=$!
          trap 'kill "$a" 2>/dev/null || true' EXIT
          curl -fsS --retry 8 --retry-connrefused "http://127.0.0.1:18961/HONRO.html" -o /dev/null
          "$V" -B "$T/capture.py" "$W"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: honro-stage40-46-anonymous-eaf-successor
          path: ${{ runner.temp }}/stage40-46-native-public-successor/out/
          if-no-files-found: warn
          retention-days: 7
