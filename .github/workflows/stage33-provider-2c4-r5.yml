name: HONRO Stage33 canonical 2c4-only old-save provider recovery proof
on:
  push:
    branches: [qa/stage33-provider-2c4-r5-joint]
    paths: [".github/workflows/stage33-provider-2c4-r5.yml", "tools/stage33-saved-provider/**"]
permissions:
  contents: read
jobs:
  one-build:
    if: github.repository == 'sys8994/honro' && github.ref == 'refs/heads/qa/stage33-provider-2c4-r5-joint'
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
      - name: Verify retained joint and historic 2c4, c60 sources, normal B build only
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/stage33-saved-provider"; mkdir "$W" "$W/out"; echo "W=$W" >> "$GITHUB_ENV"
          T="$GITHUB_WORKSPACE/tools/stage33-saved-provider"
          python "$T/guard.py" pre "$W"
          (cd "$W/B"; npm ci >"$W/out/npm.log" 2>&1; npm ci --prefix game >"$W/out/npm-game.log" 2>&1; npm run build >"$W/out/build.log" 2>&1; npm run test:production-contract >"$W/out/production-contract.log" 2>&1)
          python "$T/guard.py" observe "$W"
      - name: Genuine old normal app saves and candidate cold resume
        run: |
          set -euo pipefail
          T="$GITHUB_WORKSPACE/tools/stage33-saved-provider"
          python -m venv "$W/v"; V="$W/v/bin/python"
          "$V" -m pip --disable-pip-version-check install playwright==1.62.0
          "$V" -m playwright install --with-deps chromium
          python -m http.server 18843 --bind 127.0.0.1 --directory "$W/B" >"$W/out/http-B.log" 2>&1 &
          x=$!
          python -m http.server 18844 --bind 127.0.0.1 --directory "$W/A" >"$W/out/http-A.log" 2>&1 &
          y=$!; trap 'kill "$x" "$y" 2>/dev/null || true' EXIT
          curl -fsS --retry 8 --retry-connrefused 'http://127.0.0.1:18843/HONRO.html' -o /dev/null
          curl -fsS --retry 8 --retry-connrefused 'http://127.0.0.1:18844/HONRO.html' -o /dev/null
          "$V" "$T/capture.py" "$W"
          python "$T/guard.py" seal "$W"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: honro-stage33-2c4-post-joint-native-pc-m
          path: ${{ runner.temp }}/stage33-saved-provider/out/
          if-no-files-found: warn
          retention-days: 7
