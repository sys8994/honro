name: HONRO Stage24 front6 terminal facet actual isolated comparison
on:
  push:
    branches: [qa/stage24-front6-side-face-b79]
    paths:
      - '.github/workflows/stage24-front6-side-face.yml'
      - 'tools/stage24-front6-native/**'
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'sys8994/honro' && github.event_name == 'push' && github.ref == 'refs/heads/qa/stage24-front6-side-face-b79'
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
      - name: Exact stock checkout and Stage24 authored normal rebuild only
        shell: bash
        run: |
          set -euo pipefail
          test -z "${GITHUB_TOKEN:-}${GH_TOKEN:-}"
          W="$RUNNER_TEMP/honro-stage24-front6"
          T="$GITHUB_WORKSPACE/tools/stage24-front6-native"
          mkdir -p "$W/out"
          echo "WORK=$W" >> "$GITHUB_ENV"
          python3 "$T/guard.py" pre "$W"
          node "$T/prepare.mjs" "$W" > "$W/out/prepare.log" 2>&1
          (
            cd "$W/B"
            npm ci > "$W/out/npm-root.log" 2>&1
            npm ci --prefix game > "$W/out/npm-game.log" 2>&1
            npm run build > "$W/out/build.log" 2>&1
            npm run test:production-contract > "$W/out/production-contract.log" 2>&1
          )
          python3 "$T/guard.py" built "$W"
      - name: Genuine Stage24 raw and DOM A/B under matching stock camera
        timeout-minutes: 18
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          test -z "${GITHUB_TOKEN:-}${GH_TOKEN:-}"
          T="$GITHUB_WORKSPACE/tools/stage24-front6-native"
          python3 -m venv "$WORK/venv"
          V="$WORK/venv/bin/python"
          "$V" -m pip --disable-pip-version-check install playwright==1.62.0 Pillow==13.0.0
          "$V" -m playwright install --with-deps chromium
          python3 -m http.server 18861 --bind 127.0.0.1 --directory "$WORK/A" > "$WORK/out/http-A.log" 2>&1 &
          a=$!
          python3 -m http.server 18862 --bind 127.0.0.1 --directory "$WORK/B" > "$WORK/out/http-B.log" 2>&1 &
          b=$!
          trap 'kill "$a" "$b" 2>/dev/null || true' EXIT
          for p in 18861 18862; do curl -fsS --retry 8 --retry-connrefused "http://127.0.0.1:$p/HONRO.html" -o /dev/null; done
          "$V" "$T/capture.py" "$WORK"
      - name: Seal exact compiled Stage24 delta after verified captures
        run: python3 "$GITHUB_WORKSPACE/tools/stage24-front6-native/guard.py" archive "$WORK"
      - if: always() && env.WORK != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: honro-stage24-front6-authored-side-facet-no-deploy
          path: ${{ runner.temp }}/honro-stage24-front6/out
          if-no-files-found: error
          retention-days: 7
