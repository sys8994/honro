name: Diagnose Stage3 readability stroke independently
on:
  push:
    branches: ['inspect/stage3-readability-core-20261117']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: act1
            stages: '3,7'
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci && npm ci --prefix game
      - run: node tests/vector-snap-collapse.mjs
      - name: Reproduce collapsed Chrome clip and verify exact fallback
        shell: bash
        run: |
          node tests/vector-snap-collapse-browser-fixture.mjs "$RUNNER_TEMP/snap-unit"
          browser=$(command -v google-chrome || command -v chromium)
          for mode in previous fixed unsnapped; do
            timeout 60s "$browser" --headless --no-first-run --no-default-browser-check --force-device-scale-factor=1 --user-data-dir="$RUNNER_TEMP/snap-$mode" --dump-dom "file://$RUNNER_TEMP/snap-unit/$mode.html" > "$RUNNER_TEMP/snap-unit/$mode.dump.html"
          done
          node tests/vector-snap-collapse-browser-result.mjs "$RUNNER_TEMP/snap-unit" "$RUNNER_TEMP/evidence"
      - name: Retain prior source registrations and actual save compatibility
        if: matrix.name == 'act1'
        run: |
          node tools/act1-vector-production/check-edge-integration-manifest.mjs
          node tests/terrain-edge-act1-save-compat.mjs
          node tests/terrain-edge-save-roundtrip.mjs
          node tests/act2-local-art-save.mjs
      - name: Prepare untouched public source in an independent temporary worktree
        shell: bash
        run: |
          git fetch --depth=1 origin 7d238d20663c3ceffe430eb0304e01516ae625cf
          git worktree add --detach "$RUNNER_TEMP/public-baseline" 7d238d20663c3ceffe430eb0304e01516ae625cf
          cmp package-lock.json "$RUNNER_TEMP/public-baseline/package-lock.json"
          cmp game/package-lock.json "$RUNNER_TEMP/public-baseline/game/package-lock.json"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/public-baseline/node_modules"
          ln -s "$GITHUB_WORKSPACE/game/node_modules" "$RUNNER_TEMP/public-baseline/game/node_modules"
          cp tests/act123-terrain-browser-fixture.mjs "$RUNNER_TEMP/public-baseline/tests/act123-terrain-browser-fixture.mjs"
      - name: Generate baseline and combined candidate without saved game access
        shell: bash
        run: |
          (cd "$RUNNER_TEMP/public-baseline" && node tests/act123-terrain-browser-fixture.mjs "$RUNNER_TEMP/baseline-fixtures" '${{ matrix.stages }}' baseline)
          node tests/act123-terrain-browser-fixture.mjs "$RUNNER_TEMP/candidate-fixtures" '${{ matrix.stages }}' candidate
      - name: Actual Chrome two changed views per stage
        shell: bash
        run: |
          browser=$(command -v google-chrome || command -v chromium)
          for variant in baseline candidate; do
            node -e "for(const q of require(process.argv[1]))console.log(q.stage+':'+q.view)" "$RUNNER_TEMP/$variant-fixtures/capture-list.json" > "$RUNNER_TEMP/capture-list.txt"
            while IFS=: read -r stage view; do
              name="stage$stage-$variant-$view"
              timeout 300s "$browser" --headless --no-first-run --no-default-browser-check --force-device-scale-factor=1 --virtual-time-budget=60000 --user-data-dir="$RUNNER_TEMP/profile-$name" --dump-dom "file://$RUNNER_TEMP/$variant-fixtures/$name.html" > "$RUNNER_TEMP/$name.html"
              node tests/act123-terrain-browser-result.mjs "$RUNNER_TEMP/$name.html" "$RUNNER_TEMP/evidence" "$stage" "$variant" "$view"
            done < "$RUNNER_TEMP/capture-list.txt"
          done
      - name: Compare unchanged physics and camera and require an actual candidate effect
        run: node tests/act123-terrain-browser-compare.mjs "$RUNNER_TEMP/evidence" '${{ matrix.stages }}'
      - name: Preserve immutable Stage7 original reference
        run: |
          cp shared/assets/environment/act1-sites/stage07.webp "$RUNNER_TEMP/evidence/stage07-original.webp"
          sha256sum shared/assets/environment/act1-sites/stage07.webp > "$RUNNER_TEMP/evidence/stage07-original.sha256"
      - name: Diagnostic only original readability on fixed candidate
        shell: bash
        run: |
          STAGE3_READABILITY_CONTROL=1 node tests/stage3-readability-browser-fixture.mjs "$RUNNER_TEMP/control-fixtures" '3' candidate
          browser=$(command -v google-chrome || command -v chromium)
          for view in portrait-bl desktop-br; do
            name="stage3-candidate-$view"
            timeout 300s "$browser" --headless --no-first-run --no-default-browser-check --force-device-scale-factor=1 --virtual-time-budget=60000 --user-data-dir="$RUNNER_TEMP/control-$view" --dump-dom "file://$RUNNER_TEMP/control-fixtures/$name.html" > "$RUNNER_TEMP/control-$view.html"
            node tests/act123-terrain-browser-result.mjs "$RUNNER_TEMP/control-$view.html" "$RUNNER_TEMP/control-evidence" 3 candidate "$view"
            cp "$RUNNER_TEMP/control-evidence/$name.png" "$RUNNER_TEMP/evidence/stage3-control-$view.png"
            cp "$RUNNER_TEMP/control-evidence/$name.json" "$RUNNER_TEMP/evidence/stage3-control-$view.json"
          done
          node tests/stage3-readability-core-report.mjs "$RUNNER_TEMP/evidence"
      - name: Require exact original Stage3 core and unchanged Stage7 candidate
        run: node tests/stage3-snap-protected-core.mjs "$RUNNER_TEMP/evidence"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: terrain-chrome-${{ matrix.name }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
