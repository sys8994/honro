name: Workshop selected native polygon fill QA (disposable patch)
on:
  push:
    branches: ['qa/stage42-native-fill']
    paths: ['.github/workflows/stage42-native-fill.yml','tests/stage42-native-fill/**']
permissions:
  contents: read
jobs:
  stock_smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Confirm exact stock base and narrow QA additions
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/qa/stage42-native-fill
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = 1e043b09d4ce107e1d2dcf70fe2274dff7098476
          Q=tests/stage42-native-fill
          printf '%s\n' .github/workflows/stage42-native-fill.yml "$Q/smoke.SHA256SUMS" "$Q/apply-native-fill.mjs" "$Q/native-fill-proof.py" | LC_ALL=C sort > "$RUNNER_TEMP/solid-allowlist"
          git diff --name-only HEAD^ HEAD | LC_ALL=C sort | diff -u "$RUNNER_TEMP/solid-allowlist" -
          git diff --name-only --diff-filter=A HEAD^ HEAD | LC_ALL=C sort | diff -u "$RUNNER_TEMP/solid-allowlist" -
          echo '2163e51758c1e82f31952b6c157e31dd3d45e6e5fea1c53fc74ae24e0fc05938  tests/stage42-native-fill/smoke.SHA256SUMS' | sha256sum -c -
          (cd "$Q" && sha256sum -c smoke.SHA256SUMS)
      - name: Build original Workshop and patch only exact disposable bundle
        run: |
          set -euo pipefail
          npm ci
          npm ci --prefix game
          npm run build
          D="$RUNNER_TEMP/stage42-native-fill-disposable"
          mkdir -p "$D"
          cp -a web HONRO_WORKSHOP.html HONRO.html "$D/"
          HONRO_NATIVE_FILL_PROOF=1 node tests/stage42-native-fill/apply-native-fill.mjs "$D"
          node --check "$D/web/runtime/workshop-app.489f733634454986.js"
      - name: Real Elements pointer authoring, native style round-trip and game render
        run: |
          set -euo pipefail
          python -m pip install 'playwright==1.58.0' 'Pillow==12.0.0'
          export HONRO_CHROME="$(command -v google-chrome || command -v chromium)"
          D="$RUNNER_TEMP/stage42-native-fill-disposable"
          python -m http.server 8884 --bind 127.0.0.1 --directory "$D" &
          pid=$!; trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..20};do if curl -fsS -o /dev/null http://127.0.0.1:8884/HONRO_WORKSHOP.html;then break;fi;sleep 1;done
          timeout 240s python tests/stage42-native-fill/native-fill-proof.py "$RUNNER_TEMP/native-fill-evidence" http://127.0.0.1:8884/HONRO_WORKSHOP.html
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: stage42-native-fill-qa
          path: |
            ${{ runner.temp }}/native-fill-evidence/01-true-stage-before-sibling-fill.png
            ${{ runner.temp }}/native-fill-evidence/02-selected-native-fill-ui.png
            ${{ runner.temp }}/native-fill-evidence/03-exact-reopen-stage-after-sibling-fill.png
            ${{ runner.temp }}/native-fill-evidence/04-native-playtest.png
            ${{ runner.temp }}/native-fill-evidence/proof.json
          if-no-files-found: warn
          retention-days: 7
