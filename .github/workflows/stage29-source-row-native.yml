name: HONRO Stage29 detached source-row native A B proof only
on:
  push:
    branches: [qa/stage29-source-row-detached-native-acb]
    paths:
      - .github/workflows/stage29-source-row-native.yml
      - tools/stage29-source-row-native/**
permissions:
  contents: read
jobs:
  positive-and-controls:
    if: github.repository == 'sys8994/honro' && github.event_name == 'push' && github.ref == 'refs/heads/qa/stage29-source-row-detached-native-acb'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 9
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
      - name: Official exact A and B normal compiled candidate, with strict source guards
        shell: bash
        run: |
          set -euo pipefail
          test -z "${GH_TOKEN:-}${GITHUB_TOKEN:-}"
          T="$RUNNER_TEMP/stage29-row-native"
          mkdir "$T" "$T/out"
          echo "WORK=$T" >> "$GITHUB_ENV"
          Q="$GITHUB_WORKSPACE/tools/stage29-source-row-native"
          python "$Q/preflight.py" pre "$T"
          (
            cd "$T/B"
            npm ci > "$T/out/npm-root-B.log" 2>&1
            npm ci --prefix game > "$T/out/npm-game-B.log" 2>&1
            npm run test:release-guard > "$T/out/release-guard-B.log" 2>&1
            npm run build > "$T/out/build-B.log" 2>&1
            npm run test:production-contract > "$T/out/production-contract-B.log" 2>&1
          )
          python "$Q/preflight.py" built "$T"
      - name: Same Chrome real native stock A A and candidate B, negative east and original raster
        shell: bash
        timeout-minutes: 24
        run: |
          set -euo pipefail
          test -z "${GH_TOKEN:-}${GITHUB_TOKEN:-}"
          Q="$GITHUB_WORKSPACE/tools/stage29-source-row-native"
          python3 -m venv "$WORK/venv"
          V="$WORK/venv/bin/python"
          "$V" -m pip --disable-pip-version-check install playwright==1.62.0 Pillow==13.0.0
          "$V" -m playwright install --with-deps chromium
          python -m http.server 18891 --bind 127.0.0.1 --directory "$WORK/A" > "$WORK/out/http-A.log" 2>&1 &
          a=$!
          python -m http.server 18892 --bind 127.0.0.1 --directory "$WORK/B" > "$WORK/out/http-B.log" 2>&1 &
          b=$!
          trap 'kill "$a" "$b" 2>/dev/null || true' EXIT
          for p in 18891 18892; do curl -fsS --retry 8 --retry-connrefused "http://127.0.0.1:$p/HONRO.html" -o /dev/null; done
          "$V" "$Q/capture.py" "$WORK"
      - if: always() && env.WORK != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: honro-stage29-source-row-native-readonly
          path: ${{ runner.temp }}/stage29-row-native/out/
          retention-days: 7
          if-no-files-found: error
