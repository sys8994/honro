name: Debug normal saved-game Stage31 boarding
on:
  push:
    branches: ['work/act1-board-resume/**']
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - run: |
          python -m pip install 'playwright==1.58.0'
          python -m playwright install --with-deps chromium
          python tools/act4-ci/boarding-resume.py > /tmp/boarding.log 2>&1
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: stage31-boarding-resume-${{ github.sha }}
          path: _local/reports/stage31-boarding-resume/
          retention-days: 7
