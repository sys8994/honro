name: Combined Stage34 active edge correction
on:
  push:
    branches: ['test/combined-stage34-active-edge-20261118']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      HONRO_ACT4_RELEASE: '1'
      HONRO_ACT5_RELEASE: '1'
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci && npm ci --prefix game
      - run: node tests/combined-stage34-edge-browser-fixture.mjs "$RUNNER_TEMP/fixtures"
      - name: Actual combined edge control and correction
        run: |
          browser=$(command -v google-chrome || command -v chromium)
          for variant in baseline candidate; do
            name="stage34-$variant-desktop"
            timeout 300s "$browser" --headless --no-first-run --no-default-browser-check --force-device-scale-factor=1 --virtual-time-budget=60000 --user-data-dir="$RUNNER_TEMP/profile-$name" --dump-dom "file://$RUNNER_TEMP/fixtures/$name.html" > "$RUNNER_TEMP/$name.html"
            node tests/stage34-edge-browser-result.mjs "$RUNNER_TEMP/$name.html" "$RUNNER_TEMP/evidence" "$variant" desktop
          done
          node tests/combined-stage34-edge-browser-compare.mjs "$RUNNER_TEMP/evidence" > "$RUNNER_TEMP/evidence/kernel-comparison.json"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: combined-stage34-active-edge
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
