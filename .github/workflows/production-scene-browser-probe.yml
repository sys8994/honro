name: Diagnose isolated production Scene in Chrome
on:
  push:
    branches: ['audit/production-scene-browser-20261117']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci && npm ci --prefix game
      - name: Generate isolated production fixtures
        run: node tests/actual-scene-browser-fixture.mjs "$RUNNER_TEMP/honro-scene-fixtures"
      - name: Render three stages without app, storage or network
        shell: bash
        run: |
          browser=$(command -v google-chrome || command -v chromium)
          "$browser" --version
          for stage in 23 26 29; do
            timeout 300s "$browser" --headless --no-first-run --no-default-browser-check --force-device-scale-factor=1 --virtual-time-budget=60000 --user-data-dir="$RUNNER_TEMP/honro-scene-profile-$stage" --dump-dom "file://$RUNNER_TEMP/honro-scene-fixtures/stage$stage.html" > "$RUNNER_TEMP/honro-scene-dump-$stage.html"
            node tests/actual-scene-browser-result.mjs "$RUNNER_TEMP/honro-scene-dump-$stage.html" "$RUNNER_TEMP/honro-scene-evidence" "$stage"
          done
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: isolated-chrome-scenes-23-26-29
          path: ${{ runner.temp }}/honro-scene-evidence
          if-no-files-found: error
