name: Act 6 ordinary app boundary (unpublished)
on:
  push:
    branches: ['production/act6-restart-20261124']
    paths:
      - '.github/workflows/act6-finale-browser-qa.yml'
      - 'tools/act6-qa/finale-gameplay-r1/browser/**'
permissions:
  contents: read
jobs:
  browser:
    if: github.repository == 'sys8994/honro'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Capture exact input; install isolated browser
        run: |
          set -euo pipefail
          mkdir -p _local/act6-browser
          git rev-parse HEAD HEAD^{tree} > _local/act6-browser/source.txt
          python -m pip install 'playwright==1.58.0'
          python -m playwright install --with-deps chromium
      - name: Enter through real ordinary UI; 6th act remains isolated
        run: |
          set -euo pipefail
          python tools/act6-qa/finale-gameplay-r1/browser/off-app-smoke.py --root . --out _local/act6-browser > _local/act6-browser/runner.log 2>&1
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: act6-unpublished-boundary-${{ github.sha }}
          path: _local/act6-browser/
          retention-days: 7
