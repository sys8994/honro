name: Observe Stage38 stationary pressure
on:
  push:
    branches: ['work/act4-pressure-direct/**']
permissions:
  contents: read
jobs:
  pressure:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      HONRO_CAPTURE_URL: http://127.0.0.1:8870/HONRO.html
      HONRO_CAPTURE_OUT: _local/reports/stage38-pressure
      HONRO38_CONTROL: hold
      HONRO38_ROUTE: upper
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - run: |
          python -m pip install 'playwright==1.58.0'
          python -m playwright install chromium
          if ! python -c 'from playwright.sync_api import sync_playwright; w=sync_playwright().start(); b=w.chromium.launch(headless=True); b.close(); w.stop()'; then python -m playwright install-deps chromium; fi
      - run: |
          set -euo pipefail
          mkdir -p "$HONRO_CAPTURE_OUT"
          python -m http.server 8870 --bind 127.0.0.1 > "$HONRO_CAPTURE_OUT/server.log" 2>&1 &
          server=$!;trap 'kill "$server" 2>/dev/null || true' EXIT
          sleep 2
          python tools/act4-ci/stage38-play.py > "$HONRO_CAPTURE_OUT/play.log" 2>&1
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: stage38-pressure-${{ github.sha }}
          path: _local/reports/stage38-pressure/
          retention-days: 7
