name: Stage32 internal seam solid-fill support replay
on:
  workflow_dispatch:
  push:
    branches: [inspect/stage32-scanline-20261118]
    paths:
      - tests/stage32-internal-support-*
      - tests/stage32-internal-fill-replay.mjs
      - tests/fixtures/stage32-internal-support-*
      - .github/workflows/stage32-internal-support-experiment.yml
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
      - name: Generate independent replay over immutable actual Scene PNGs
        run: node tests/stage32-internal-support-fixture.mjs "$RUNNER_TEMP/input"
      - name: Actual Chrome fill versus historical clip primitive
        run: |
          browser=$(command -v google-chrome || command -v chromium)
          timeout 150s node tests/stage32-registered-one-probe.mjs "$browser" "$RUNNER_TEMP/profile" "$RUNNER_TEMP/input/probe.html" "$RUNNER_TEMP/evidence/probe"
          node tests/stage32-internal-support-result.mjs "$RUNNER_TEMP/evidence/probe/result.html" "$RUNNER_TEMP/evidence"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: stage32-internal-support-experiment
          path: ${{ runner.temp }}/evidence
          if-no-files-found: warn
