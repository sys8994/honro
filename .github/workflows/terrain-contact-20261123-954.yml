name: Verify campaign terrain contact before publication
run-name: Terrain contact verification · 0b30742e
on:
  push:
    branches: ['qa/contact-art-collision-20261123-954']
permissions:
  contents: write
concurrency:
  group: terrain-contact-20261123
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'sys8994/honro' && github.ref == 'refs/heads/qa/contact-art-collision-20261123-954'
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    env:
      SOURCE_SHA: 0b30742e110a28b247b63704244b0a32f5bbaa05
      SOURCE_TREE: a84aacfb01ad0afe831ffb41f1a75b8d3ca2d417
      BASE: 954e0ea4e68a0838038822d2e2e84517f4ee8126
      GENERATED_TREE: 3269b7d5fe59de1067b7b1d9493055773db74025
      GENERATED_REF: refs/heads/repair/contact-art-collision-20261123-954-generated
      OUT: _local/reports/contact-art-collision-20261123
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 2
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Verify exact source and focused contact contracts
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test ! -e .github/workflows/terrain-contact-20261123-954.yml
          mkdir -p "$OUT"
          { git rev-parse HEAD HEAD^{tree}; node --version; python --version; } > "$OUT/source.txt"
          sha256sum package-lock.json game/package-lock.json >> "$OUT/source.txt"
          npm ci
          npm ci --prefix game
          {
            node game/tests/terrain-contact-ink.mjs
            node tests/act5-terrain-contact.mjs
            node tests/terrain-readability.mjs
            node tests/one-way-platform-physics.mjs
            python -X utf8 tests/release-guard.py
          } 2>&1 | tee "$OUT/contracts.log"
      - name: Build official graph and bind exact generated tree
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$BASE"
          npm run build | tee "$OUT/build.log"
          test "$(sha256sum web/manifest.json | cut -d ' ' -f 1)" = 31b0621cb153606bca6763b9e1f3290d5dd039e0f2357c674a71a251c05931ca
          cp web/manifest.json "$OUT/manifest-before.json"
          node --input-type=module > "$OUT/refs.txt" <<'JS'
          import fs from 'node:fs';
          import {selectPublishedGenerations} from './shared/web-retention.mjs';
          const m=JSON.parse(fs.readFileSync('web/manifest.json','utf8'));
          for(const {sourceSha} of selectPublishedGenerations(m.publishedGenerations,{now:Date.now()})){
            if(!/^[a-f0-9]{40}$/.test(sourceSha))throw Error('Unexpected source ref');
            console.log(sourceSha);
          }
          JS
          mapfile -t refs < "$OUT/refs.txt"
          git fetch --no-tags --filter=blob:none --depth=1 origin "$BASE" "${refs[@]}"
          node tools/release/retain-published-web.mjs "$BASE" --published-at 2026-11-23T19:38:45.578Z --evidence https://github.com/sys8994/honro/actions/runs/45250691712 > "$OUT/retainer.json"
          test "$(sha256sum web/manifest.json | cut -d ' ' -f 1)" = eac443cb2b7a7ac19c1b0cde108cc9b9b00a1802788c667d40d20faad57b57e8
          rm "$OUT/manifest-before.json"
          sha256sum HONRO.html HONRO_WORKSHOP.html index.html web/manifest.json > "$OUT/build.sha256"
          git add -A -- web HONRO.html HONRO_WORKSHOP.html index.html
          git diff --cached --check
          git diff --cached --name-status > "$OUT/generated-paths.txt"
          actual=$(git write-tree)
          printf 'expected %s\nactual   %s\n' "$GENERATED_TREE" "$actual" | tee "$OUT/tree.txt"
          test "$actual" = "$GENERATED_TREE"
      - name: Chromium route recovery on the same generated build
        run: |
          set -euo pipefail
          python -m pip install 'playwright==1.58.0'
          python -m playwright install --with-deps chromium
          python -X utf8 tests/act5-route-recovery-browser.py --skip-save | tee "$OUT/browser.log"
          HONRO_ACT5_CHECK=42,43,44,47,50 python -X utf8 tests/act5-encounter-browser.py | tee "$OUT/browser-objectives.log"
          sha256sum -c "$OUT/build.sha256"
          test "$(git write-tree)" = "$GENERATED_TREE"
      - name: Preserve the approved generated child on one new repair verification ref
        run: |
          set -euo pipefail
          test -z "$(git ls-remote origin "$GENERATED_REF")"
          commit=$(git -c user.name='honro release automation' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit-tree "$GENERATED_TREE" -p "$SOURCE_SHA" -m "Build verified campaign terrain contact candidate")
          test "$(git rev-parse "$commit^")" = "$SOURCE_SHA"
          git push origin "$commit:$GENERATED_REF"
          printf '%s\n' "$commit" | tee "$OUT/generated-commit.txt"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: terrain-contact-0b30742e-proof
          path: |
            _local/reports/contact-art-collision-20261123/
            _local/reports/act5/recovery/local.json
            _local/reports/act5/combat-checkpoints.json
          retention-days: 7
