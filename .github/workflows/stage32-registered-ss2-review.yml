name: Stage32 registered SS2 production helper review
on:
  workflow_dispatch:
  push:
    branches: [inspect/stage32-scanline-20261118]
    paths:
      - shared/runtime/stage32-foundation-art.js
      - tests/stage32-registered-ss2-*
      - .github/workflows/stage32-registered-ss2-review.yml
permissions:
  contents: read
jobs:
  registered:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci && npm ci --prefix game
      - name: Production-source six-buffer contracts
        run: node tests/stage32-registered-ss2-native-contract.mjs
      - name: Original providers, paths, physics and codec contracts
        run: |
          git fetch origin e89242eedb5c040d38a9077c7289fbdc97786bdf --depth=1
          BASELINE_REF=e89242eedb5c040d38a9077c7289fbdc97786bdf node tests/stage32-foundation-contract.mjs
      - name: Actual registered Workshop and Game builds
        run: |
          HONRO_ACT4_RELEASE=1 node workshop/build.mjs
          HONRO_ACT4_RELEASE=1 node game/build.mjs
          git diff --exit-code -- shared/runtime/stage32-foundation-art.js
      - name: Registered runtimeEntries and provider Scene fixtures
        run: |
          HONRO_ACT4_RELEASE=1 node tests/stage32-registered-ss2-perf-fixture.mjs "$RUNNER_TEMP/registered-perf"
          HONRO_ACT4_RELEASE=1 node tests/stage32-registered-ss2-matrix-fixture.mjs "$RUNNER_TEMP/registered-matrix"
      - name: Actual Chrome, frozen baseline and registered production SS2
        shell: bash
        run: |
          browser=$(command -v google-chrome || command -v chromium)
          mkdir -p "$RUNNER_TEMP/registered-evidence/perf" "$RUNNER_TEMP/registered-evidence/matrix"
          "$browser" --version > "$RUNNER_TEMP/registered-evidence/chrome-version.txt"
          failed=0
          for kind in perf matrix; do
            views='lower left'; prefix=''; extractor='tests/stage32-supersample-perf-result.mjs'
            if [ "$kind" = matrix ]; then views='portrait-overview landscape-overview portrait-bottom landscape-bottom desktop-walk'; prefix='matrix-'; extractor='tests/stage32-ss2-overview-result.mjs'; fi
            for variant in candidate ss2; do
              for view in $views; do
                probe="$RUNNER_TEMP/registered-evidence/probes/$kind-$variant-$view"
                if timeout 150s node tests/stage32-registered-one-probe.mjs "$browser" "$RUNNER_TEMP/registered-profile-$kind-$variant-$view" "$RUNNER_TEMP/registered-$kind/stage32-$prefix$variant-$view.html" "$probe"; then
                  node "$extractor" "$probe/result.html" "$RUNNER_TEMP/registered-evidence/$kind" "$variant" "$view" || failed=1
                else
                  printf '{"ok":false,"reason":"Chrome timeout/process failure"}\n' > "$RUNNER_TEMP/registered-evidence/$kind/$variant-$view-process-failure.json"
                  failed=1
                fi
              done
            done
          done
          exit "$failed"
      - name: Frozen original, protected pixels and registration-only equivalence
        if: ${{ !cancelled() }}
        run: |
          node tests/stage32-registered-ss2-perf-compare.mjs "$RUNNER_TEMP/registered-evidence/perf"
          node tests/stage32-registered-ss2-matrix-compare.mjs "$RUNNER_TEMP/registered-evidence/matrix" ss2
          node tests/stage32-registered-ss2-output-contract.mjs "$RUNNER_TEMP/registered-evidence"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: stage32-registered-ss2-review
          path: ${{ runner.temp }}/registered-evidence
          if-no-files-found: error
