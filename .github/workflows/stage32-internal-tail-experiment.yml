name: Stage32 internal gray asset seam proof
on:
  workflow_dispatch:
  push:
    branches: [inspect/stage32-scanline-20261118]
    paths:
      - tests/stage32-internal-tail-*
      - tests/fixtures/stage32-internal-tail-*
      - .github/workflows/stage32-internal-tail-experiment.yml
permissions:
  contents: read
jobs:
  seam:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci && npm ci --prefix game
      - name: Preserve production and original source contracts
        run: |
          node tests/stage32-registered-empty-native-contract.mjs
          node tests/stage32-bodyguard-static-contract.mjs
          node tests/stage32-internal-tail-static-contract.mjs
          git fetch origin e89242eedb5c040d38a9077c7289fbdc97786bdf --depth=1
          BASELINE_REF=e89242eedb5c040d38a9077c7289fbdc97786bdf node tests/stage32-foundation-contract.mjs
      - name: Nine paired actual Scene fixtures
        run: HONRO_ACT4_RELEASE=1 node tests/stage32-internal-tail-fixture.mjs "$RUNNER_TEMP/input"
      - name: Chrome internal seam and transparent terrain union
        shell: bash
        run: |
          browser=$(command -v google-chrome || command -v chromium)
          mkdir -p "$RUNNER_TEMP/evidence"
          "$browser" --version > "$RUNNER_TEMP/evidence/chrome-version.txt"
          failed=0
          for variant in candidate ss2; do
            for view in gray-left portrait-overview portrait-bottom landscape-overview landscape-bottom desktop-walk maximum renderer-below renderer-above; do
              probe="$RUNNER_TEMP/evidence/probes/$variant-$view"
              if timeout 150s node tests/stage32-registered-one-probe.mjs "$browser" "$RUNNER_TEMP/profile-$variant-$view" "$RUNNER_TEMP/input/stage32-$variant-$view.html" "$probe"; then
                node tests/stage32-internal-tail-result.mjs "$probe/result.html" "$RUNNER_TEMP/evidence" "$variant" "$view" || failed=1
              else
                failed=1
              fi
            done
          done
          exit "$failed"
      - name: Independent declared-support and final terrain protection
        if: ${{ !cancelled() }}
        run: node tests/stage32-internal-tail-compare.mjs "$RUNNER_TEMP/evidence"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: stage32-internal-tail-experiment
          path: ${{ runner.temp }}/evidence
          if-no-files-found: warn
