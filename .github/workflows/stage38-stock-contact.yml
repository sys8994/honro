name: Stage38 stock contact diagnostic
on:
  push:
    branches: ['qa/stage38-stock-contact-20261120']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HONRO_ACT4_RELEASE: '1'
      HONRO_ACT5_RELEASE: '1'
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 3
      - name: Exact add-only gate
        run: |
          test "$(git merge-base HEAD 1e043b09d4ce107e1d2dcf70fe2274dff7098476)" = 1e043b09d4ce107e1d2dcf70fe2274dff7098476
          git diff --name-status 1e043b09d4ce107e1d2dcf70fe2274dff7098476 HEAD > /tmp/diff
          cat /tmp/diff
          test "$(wc -l < /tmp/diff)" = 3
          if grep -vE '^A[[:space:]]+(tests/stage38-stock-contact-fixture.mjs|tests/stage38-stock-contact-extract.mjs|.github/workflows/stage38-stock-contact.yml)$' /tmp/diff; then exit 1; fi
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci && npm ci --prefix game
      - run: node tools/act4-source/world-source.mjs materialize
      - run: node tests/stage38-stock-contact-fixture.mjs "$RUNNER_TEMP/fixtures"
      - name: Isolated stock Chrome contact evidence
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/evidence/qa-head.txt"
          browser=$(command -v google-chrome || command -v chromium)
          for view in whole middle upper; do
            name="stage38-integrated-$view"
            timeout 300s "$browser" --headless --no-first-run --no-default-browser-check --force-device-scale-factor=1 --virtual-time-budget=60000 --user-data-dir="$RUNNER_TEMP/profile-$view" --dump-dom "file://$RUNNER_TEMP/fixtures/$name.html" > "$RUNNER_TEMP/$name.html"
            node tests/stage38-stock-contact-extract.mjs "$RUNNER_TEMP/$name.html" "$RUNNER_TEMP/evidence" "$name"
          done
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: stage38-stock-contact
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
