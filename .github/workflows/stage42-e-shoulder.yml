name: Stage42 E single west shoulder native material proof
on:
  push:
    branches: ['qa/stage42-e-shoulder']
    paths: ['.github/workflows/stage42-e-shoulder.yml','tests/stage42-e-shoulder/**']
permissions:
  contents: read
jobs:
  stock_smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 7
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Confirm exact stock base and narrow QA additions
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/qa/stage42-e-shoulder
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = e969ae3f170d0d80eaccf584db1149aa3989c1c8
          test "$(git rev-parse HEAD~2)" = a7be465657459c33b5efe98c9470a256f57e98d6
          test "$(git rev-parse HEAD~3)" = 85132315f1c0eea1ef03a0d067739e372a5cbe33
          test "$(git rev-parse HEAD~4)" = f75f7d2129384dd0cf33a0a4f5f196ceb301df5c
          test "$(git rev-parse HEAD~5)" = 370000cb5aa6be42bb33b8a72a2cd81b21ea8096
          test "$(git rev-parse HEAD~6)" = 1e043b09d4ce107e1d2dcf70fe2274dff7098476
          Q=tests/stage42-e-shoulder
          printf '%s\n' .github/workflows/stage42-e-shoulder.yml "$Q/smoke.SHA256SUMS" "$Q/e-shoulder-proof.py" | LC_ALL=C sort > "$RUNNER_TEMP/solid-allowlist"
          git diff --name-only HEAD^ HEAD | LC_ALL=C sort | diff -u "$RUNNER_TEMP/solid-allowlist" -
          git diff --name-only --diff-filter=M HEAD^ HEAD | LC_ALL=C sort | diff -u "$RUNNER_TEMP/solid-allowlist" -
          echo '196375e22b97ef14f9a64969677d6512a90d8228dec13ad56bfc92dcb4ee406c  tests/stage42-e-shoulder/smoke.SHA256SUMS' | sha256sum -c -
          (cd "$Q" && sha256sum -c smoke.SHA256SUMS)
          printf '%s  %s\n' e3ff41106d86a5003d2d518172d17bf7f4b371e1e6695882fbe8782fbddef268 tests/stage42-full-e-stock-native/full-e-proof.py | sha256sum -c -
      - name: Build original Workshop and patch only exact disposable bundle
        run: |
          set -euo pipefail
          npm ci
          npm ci --prefix game
          npm run build
          D="$RUNNER_TEMP/stage42-native-fill-disposable"
          mkdir -p "$D"
          cp -a web HONRO_WORKSHOP.html HONRO.html "$D/"
          HONRO_NATIVE_FILL_PROOF=1 node tests/stage42-e-shoulder/apply-native-fill.mjs "$D"
          node --check "$D/web/runtime/workshop-app.489f733634454986.js"
      - name: Real Elements pointer authoring, native style round-trip and game render
        run: |
          set -euo pipefail
          python -m pip install 'playwright==1.58.0' 'Pillow==12.0.0'
          export HONRO_CHROME="$(command -v google-chrome || command -v chromium)"
          D="$RUNNER_TEMP/stage42-native-fill-disposable"
          python -m http.server 8884 --bind 127.0.0.1 --directory "$D" &
          pid=$!; trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..20};do if curl -fsS -o /dev/null http://127.0.0.1:8884/HONRO_WORKSHOP.html;then break;fi;sleep 1;done
          timeout 240s python tests/stage42-e-shoulder/e-shoulder-proof.py "$RUNNER_TEMP/native-fill-evidence" http://127.0.0.1:8884/HONRO_WORKSHOP.html tests/stage42-full-e-stock-native/full-e-proof.py
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: stage42-e-shoulder-qa
          path: |
            ${{ runner.temp }}/native-fill-evidence/1[1-7]-*.png
            ${{ runner.temp }}/native-fill-evidence/pointer-fit.json
            ${{ runner.temp }}/native-fill-evidence/shoulder-proof.json
          if-no-files-found: warn
          retention-days: 7
