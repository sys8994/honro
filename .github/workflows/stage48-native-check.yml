name: Verify Stage48 native continuity candidate
on:
  push:
    branches: ['fix/stage48-resume-20261117']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HONRO_ACT4_RELEASE: '1'
      HONRO_ACT5_RELEASE: '1'
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install locked dependencies
        run: |
          npm ci
          npm ci --prefix game
          node tools/act4-source/world-source.mjs materialize
      - name: Authored gameplay, tunnel, contacts and single-alpha composition
        run: |
          node tests/stage48-continuity.mjs --baseline-all
          node tests/stage48-composite.mjs
          node tests/act5-terrain-contact.mjs
          node tests/web-build-retention.mjs
      - name: Rebuild verification only
        run: |
          npm run build
          sha256sum HONRO.html web/manifest.json
