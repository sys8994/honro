name: Stage 7 actual VectorArt material study (not game Scene)
on:
  workflow_dispatch:
  push:
    branches: [art/stage7-semantic-rock-study-20261117]
    paths:
      - game/tools/stage7-vector-study/**
      - .github/workflows/stage7-vector-study.yml
      - game/tools/stage7-svg-study/**
permissions:
  contents: read
jobs:
  vector-study:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical image-check dependencies
        run: python -m pip install numpy==2.2.4 Pillow==11.1.0 scipy==1.15.2
      - name: Locate existing Chrome (normal sandbox only)
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME_BIN"
          "$CHROME_BIN" --version
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Convert reviewed subset and preserve authoritative source and 13 footholds
        run: python game/tools/stage7-vector-study/convert.py
      - name: Fail closed on unsupported reachable SVG and altered source
        run: python game/tools/stage7-vector-study/test-converter.py
      - name: Validate with unchanged actual production VectorArt validator
        run: node game/tools/stage7-vector-study/validate.mjs
      - name: Render actual VectorArt on attached correctly sized canvases
        run: node game/tools/stage7-vector-study/run.mjs
      - name: Check original protection and real extended sole support
        run: python game/tools/stage7-vector-study/check.py
      - name: Assert production source was not modified by this study
        if: always()
        run: git diff --exit-code -- shared tools/map-forge
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage7-vector-study-${{ github.sha }}
          path: |
            artifacts/stage7-vector-study
            game/tools/stage7-vector-study/generated
          if-no-files-found: error
          retention-days: 14
