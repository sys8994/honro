name: HONRO public Stage46 performance bootstrap-r2 (read only)
on:
  push:
    branches: [qa/stage46-performance-bootstrap-r2]
    paths:
      - .github/workflows/stage46-performance-bootstrap-r2.yml
      - tools/stage46-performance/**
permissions:
  contents: read
  actions: read
jobs:
  observe:
    if: github.repository == 'sys8994/honro' && github.event_name == 'push' && github.ref == 'refs/heads/qa/stage46-performance-bootstrap-r2'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 8
          persist-credentials: false
      - name: Verify exact published and source authority without Pages prefetch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          O="$(mktemp -d "$RUNNER_TEMP/honro-stage46-perf.XXXXXX")"
          echo "OUT=$O" >> "$GITHUB_ENV"
          python3 tools/stage46-performance/run.py authority "$O"
      - name: Three actual cold and same-canvas warm Chrome observations
        run: |
          set -euo pipefail
          test -z "${GH_TOKEN:-}${GITHUB_TOKEN:-}"
          V="$RUNNER_TEMP/honro-stage46-perf-venv"
          python3 -m venv "$V"
          "$V/bin/python" -m pip --disable-pip-version-check install playwright==1.62.0 Pillow==13.0.0
          "$V/bin/python" -m playwright install --with-deps chromium
          PYTHONDONTWRITEBYTECODE=1 "$V/bin/python" tools/stage46-performance/run.py suite "$OUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && env.OUT != ''
        with:
          name: honro-stage46-public-performance-bootstrap-r2
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 7
