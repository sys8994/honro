name: Exact final C Act1 camera regression in nine shards
on:
  push:
    branches: [qa/final-c-act1-camera-parallel-20261121]
permissions:
  contents: read
jobs:
  build-proof:
    if: github.event_name == 'push' && github.ref == 'refs/heads/qa/final-c-act1-camera-parallel-20261121'
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
      - name: Exact QA-only child and normal C graph authority
        shell: bash
        run: |
          set -euo pipefail
          BASE=affc9a7849f25a6fd08a65b5c90228b84e029fc1
          D=tools/final-c-act1
          W="$RUNNER_TEMP/final-c-act1"
          mkdir -p "$W/out"
          echo "WORK=$W" >> "$GITHUB_ENV"
          echo "OUT=$W/out" >> "$GITHUB_ENV"
          echo "QA=$GITHUB_WORKSPACE/$D" >> "$GITHUB_ENV"
          test "$(git show -s --format=%P HEAD)" = "$BASE"
          printf 'A\t%s\n' .github/workflows/final-c-act1-camera.yml "$D/dag.py" \
            "$D/pins.json" "$D/poses.json" "$D/rows-4.json" "$D/rows-5.json" "$D/rows-6.json" "$D/rows-10.json" \
            "$D/verify_final_c.py" "$D/capture_final_c.py" "$D/snapshot_c.py" "$D/join_cameras.py" | LC_ALL=C sort > "$W/expected-open"
          git diff --name-status --no-renames "$BASE" HEAD | LC_ALL=C sort | diff - "$W/expected-open"
          git worktree add --detach "$W/C" "$BASE"
          Q="$PWD/$D"
          python "$Q/verify_final_c.py" source "$W/C"
          cd "$W/C"
          npm ci > "$W/out/npm-root.log" 2>&1
          npm ci --prefix game > "$W/out/npm-game.log" 2>&1
          npm run test:release-guard > "$W/out/release-guard.log" 2>&1
          npm run build > "$W/out/build.log" 2>&1
          npm run test:production-contract > "$W/out/production-contract.log" 2>&1
          python "$Q/verify_final_c.py" built "$W/C" "$W/out/C-GRAPH.json"
      - name: One exact normal C serving bundle for all nine shards
        run: python "$QA/snapshot_c.py" pack "$WORK/C" "$WORK/runtime" --graph "$OUT/C-GRAPH.json"
      - uses: actions/upload-artifact@v4
        with:
          name: final-c-runtime-bundle
          path: ${{ env.WORK }}/runtime/
          retention-days: 7
          compression-level: 0
      - name: Retain generated bytes as a QA artifact only
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK/C"
          mkdir -p "$WORK/generated"
          node --input-type=module - "$WORK/generated/retention-receipt.json" <<'JS'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          import assert from 'node:assert/strict';
          import {graphSha256,validateAsset,selectPublishedGenerations} from './shared/web-retention.mjs';
          const b=fs.readFileSync('web/manifest.json'),m=JSON.parse(b);
          const sha=a=>createHash('sha256').update(a).digest('hex');
          const pub=selectPublishedGenerations(m.publishedGenerations);
          assert.deepEqual(pub,m.publishedGenerations);
          const all=new Map();
          for(const r of [...m.files,...m.previousFiles,...pub.flatMap(g=>g.files)]){
            validateAsset(r);const before=all.get(r.path);
            if(before)assert.deepEqual(before,r);else all.set(r.path,r);
          }
          for(const r of all.values()){
            const bytes=fs.readFileSync(r.path);assert.equal(bytes.length,r.bytes,r.path);assert.equal(sha(bytes),r.sha256,r.path);
          }
          const shells=['HONRO.html','HONRO_WORKSHOP.html','index.html','workshop/HONRO_MAP_WORKSHOP.html'];
          const checks=Object.fromEntries(shells.map(p=>[p,sha(fs.readFileSync(p))]));
          fs.writeFileSync(process.argv[2],JSON.stringify({role:'normal built QA candidate; no page publication',manifestSHA256:sha(b),shells:checks,graphSHA256:graphSha256(m.files),current:m.files.length,retained:m.previousFiles.length,published:pub.map(g=>g.sourceSha)},null,2)+'\n');
          JS
          tar --sort=name --mtime=@0 --numeric-owner --owner=0 --group=0 -cf - HONRO.html HONRO_WORKSHOP.html index.html workshop/HONRO_MAP_WORKSHOP.html web | gzip -1 > "$WORK/generated/final-c-normal-generated.tar.gz"
          cd "$WORK/generated"
          sha256sum final-c-normal-generated.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: final-c-generated-normal-qa-only
          path: ${{ env.WORK }}/generated/
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-c-single-build-proof
          path: ${{ env.OUT }}
          retention-days: 7

  camera:
    needs: build-proof
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-24.04
    timeout-minutes: 44
    env:
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: final-c-runtime-bundle
          path: ${{ runner.temp }}/final-c-runtime-bundle
      - name: Reconstitute exact serving bytes and install Chromium
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          T="$GITHUB_WORKSPACE/tools/final-c-act1"
          W="$RUNNER_TEMP/final-c-shard"
          mkdir -p "$W/out"
          python "$T/snapshot_c.py" unpack "$W/C" "$RUNNER_TEMP/final-c-runtime-bundle"
          python -m pip install playwright==1.58.0 pillow
          python -m playwright install --with-deps chromium
      - name: Capture at most ten exact normal App cameras
        shell: bash
        timeout-minutes: 31
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/final-c-shard"
          python -m http.server 18841 --bind 127.0.0.1 --directory "$W/C" > "$W/out/http-C.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          curl -fsS --retry 8 --retry-connrefused http://127.0.0.1:18841/HONRO.html -o /dev/null
          python tools/final-c-act1/capture_final_c.py "$W/C" "$RUNNER_TEMP/final-c-runtime-bundle/C-GRAPH.json" "$W/out" --shard "$SHARD"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-c-act1-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/final-c-shard/out/
          retention-days: 7
  join-proof:
    if: always() && needs.build-proof.result == 'success'
    needs: [build-proof, camera]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: final-c-runtime-bundle
          path: ${{ runner.temp }}/final-c-runtime-bundle
      - uses: actions/download-artifact@v4
        with:
          pattern: final-c-act1-shard-*
          path: ${{ runner.temp }}/final-c-shots
      - run: |
          set -euo pipefail
          python -m pip install pillow
          python tools/final-c-act1/join_cameras.py "$RUNNER_TEMP/final-c-shots" "$RUNNER_TEMP/final-c-runtime-bundle" "$RUNNER_TEMP/final-c-joined"
          test "${{ needs.camera.result }}" = success
      - uses: actions/upload-artifact@v4
        with:
          name: final-c-act1-camera-exact-84
          path: ${{ runner.temp }}/final-c-joined/
          retention-days: 7
