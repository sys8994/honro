name: Diagnose browser and Native gradient semantics
on:
  push:
    branches: ['audit/canvas-gradient-browser-20261117']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - name: Execute isolated Chrome Canvas2D fixture
        shell: bash
        run: |
          browser=$(command -v google-chrome || command -v chromium)
          "$browser" --version
          timeout 60s "$browser" --headless --no-first-run --no-default-browser-check --user-data-dir="$RUNNER_TEMP/honro-gradient-probe" --dump-dom "file://$PWD/tests/fixtures/canvas/transformed-gradient.html" > "$RUNNER_TEMP/honro-gradient-result.html"
          node tests/canvas-gradient-browser-result.mjs "$RUNNER_TEMP/honro-gradient-result.html"
      - name: Install locked Native canvas dependencies
        run: npm ci
      - name: Compare actual production handoff tiles
        shell: bash
        run: |
          node tests/handoff-tile-browser-fixture.mjs "$RUNNER_TEMP/honro-handoff-tile.html"
          browser=$(command -v google-chrome || command -v chromium)
          timeout 120s "$browser" --headless --no-first-run --no-default-browser-check --user-data-dir="$RUNNER_TEMP/honro-handoff-tile-profile" --dump-dom "file://$RUNNER_TEMP/honro-handoff-tile.html" > "$RUNNER_TEMP/honro-handoff-tile-result.html"
          node tests/handoff-tile-browser-result.mjs "$RUNNER_TEMP/honro-handoff-tile-result.html" "$RUNNER_TEMP/honro-handoff-tile.html.native.json" "$RUNNER_TEMP/honro-handoff-comparison.json"
