name: Verify Stage16 observer App and browser on current genuine release evidence
on:
  push:
    branches: ['work/stage16-app-review-20261104']
permissions:
  contents: read
concurrency:
  group: stage16-app-review-20261104
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      HONRO_ACT4_RELEASE: '1'
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: npm ci && npm ci --prefix game && pip install playwright==1.58.0 && python -m playwright install --with-deps chromium
      - name: Verify retained genuine Stage31 evidence then normal release build
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const p=JSON.parse(fs.readFileSync('tools/stage31/production-package.json'));
          const r=p.production.probeResults[p.stageId].find(r=>r.id==='boarding-objective');
          assert.equal(r.sourceCommit,'51ce3b25511270f36d26b5e4c277b8b94276c031');
          assert.equal(r.sourceRunId,41938742761);
          assert.equal(r.result,'pass');
          assert.equal(r.observations.find(o=>o.freshUiResult).freshUiResult.final.round,17);
          JS
          npm --prefix game run typecheck
          npm run build
      - name: Focused state and existing actual App cases
        run: node tests/stage16-observer-state.mjs && node tests/act23-v4-reviewed16.mjs
      - name: New actual Engine movement and App Continue cases
        run: node tests/stage16-observer-app-resume.mjs
      - name: Actual Chromium buttons movement and reload
        run: python tests/stage16-observer-browser.py
      - name: Preserve only synthetic game observations
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: stage16-observer-review
          path: |
            _local/reports/stage16-observer-app/
            _local/reports/stage16-observer-browser/
          if-no-files-found: ignore
          retention-days: 14
