name: Verify Stage16 with fresh Stage31 evidence and actual App
on:
  push:
    branches: ['work/stage16-app-review-20261104']
permissions:
  contents: write
concurrency:
  group: stage16-app-review-20261104
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SOURCE_SHA: ${{ github.sha }}
      HONRO_ACT4_RELEASE: '1'
      HONRO_QA_ORIGIN: http://127.0.0.1:8870
      OUT: _local/reports/stage31-refresh-stage16
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Verify and record exact candidate provenance
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          SOURCE_TREE=$(git rev-parse HEAD^{tree})
          echo "SOURCE_TREE=$SOURCE_TREE" >> "$GITHUB_ENV"
          test -z "$(git status --porcelain)"
          mkdir -p "$OUT"
          printf '%s\n' "workflowCommit=$GITHUB_SHA" "sourceCommit=$SOURCE_SHA" "sourceTree=$SOURCE_TREE" "runId=$GITHUB_RUN_ID" > "$OUT/provenance.txt"
      - name: Install pinned dependencies and run real Engine probes
        run: |
          set -euo pipefail
          export GITHUB_SHA="$SOURCE_SHA"
          npm ci
          npm ci --prefix game
          npm --prefix game run typecheck
          node tools/act4-ci/positive-finisher.test.mjs | tee "$OUT/positive-finisher.log"
          python tools/act4-ci/test_stage31_survival.py | tee "$OUT/survival-regression.log"
          python tools/act4-ci/test_recent_damage.py | tee "$OUT/recent-damage-regression.log"
          node tools/act4-ci/refresh-stage31-probes.mjs prepare "$OUT" | tee "$OUT/prepare.log"
          node workshop/build.mjs | tee "$OUT/preview-build.log"
          sha256sum HONRO.html > "$OUT/preview-html.sha256"
          node --input-type=module -e 'import fs from "node:fs";fs.writeFileSync(process.env.OUT+"/preview-active-files.json",JSON.stringify(JSON.parse(fs.readFileSync("web/manifest.json")).files.map(({path,bytes,sha256})=>({path,bytes,sha256})).sort((a,b)=>a.path.localeCompare(b.path))))'
          python -m pip install 'playwright==1.58.0'
          python -m playwright install --with-deps chromium
      - name: Fresh normal-input Stage31 battle and boarding on exact candidate
        run: |
          set -euo pipefail
          export GITHUB_SHA="$SOURCE_SHA"
          python -m http.server 8870 --bind 127.0.0.1 > "$OUT/server.log" 2>&1 &
          server=$!; trap 'kill "$server" 2>/dev/null || true' EXIT
          sleep 2
          HONRO_RUN_DIR="$OUT/stage31" python tools/act4-ci/stage31-fullplay.py > "$OUT/stage31.log" 2>&1
      - name: Attach genuine evidence and pass unchanged release guard
        run: |
          set -euo pipefail
          export GITHUB_SHA="$SOURCE_SHA"
          node tools/act4-ci/refresh-stage31-probes.mjs attach "$OUT" | tee "$OUT/attach.log"
          npm run build | tee "$OUT/normal-gated-build.log"
          sha256sum -c "$OUT/preview-html.sha256"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {runtimeDigest} from './tools/stage31/probes.mjs';
          const files=JSON.parse(fs.readFileSync('web/manifest.json')).files.map(({path,bytes,sha256})=>({path,bytes,sha256})).sort((a,b)=>a.path.localeCompare(b.path));
          assert.deepEqual(files,JSON.parse(fs.readFileSync(process.env.OUT+'/preview-active-files.json')));
          const digest=await runtimeDigest(),focused=JSON.parse(fs.readFileSync(process.env.OUT+'/focused-probes.json'));
          assert.equal(digest,focused.digest);
          assert.equal(focused.sourceCommit,process.env.SOURCE_SHA);
          const ui=JSON.parse(fs.readFileSync(process.env.OUT+'/stage31/result.json'));
          assert.equal(ui.sourceCommit,process.env.SOURCE_SHA);
          assert.equal(ui.passed,true);assert.equal(ui.complete,true);
          assert.equal(ui.final.phase,'won');assert.ok(ui.final.round<=20);
          assert.equal(ui.final.heroes.length,4);assert.ok(ui.final.heroes.every(h=>h.hp>0&&!h.dead));
          const pkg=JSON.parse(fs.readFileSync('tools/stage31/production-package.json'));
          const objective=pkg.production.probeResults[pkg.stageId].find(p=>p.id==='boarding-objective');
          assert.equal(objective.sourceCommit,process.env.SOURCE_SHA);
          assert.equal(objective.sourceRunId,Number(process.env.GITHUB_RUN_ID));
          assert.deepEqual(objective.observations.find(o=>o.freshUiResult).freshUiResult,ui);
          fs.writeFileSync(process.env.OUT+'/runtime-equivalence.json',JSON.stringify({sourceCommit:process.env.SOURCE_SHA,sourceTree:process.env.SOURCE_TREE,runId:process.env.GITHUB_RUN_ID,runtimeSha256:digest,htmlIdentical:true,activeFilesIdentical:true,scope:ui.scope,round:ui.final.round,allFourSurvive:true},null,2));
          console.log(JSON.stringify({sourceCommit:ui.sourceCommit,runId:process.env.GITHUB_RUN_ID,round:ui.final.round,phase:ui.final.phase,allFourSurvive:true,runtimeSha256:digest}));
          JS
          git diff --exit-code -- shared/map shared/runtime shared/engine/src tools/stage31/probes.mjs tools/stage31/pilot-runtime.mjs tools/stage31/app-adapter.mjs tests/app-regression-helpers.mjs game/tests/helpers.mjs shared/build.mjs shared/data/act4/pilot-combat-reference.json
          cp tools/stage31/production-package.json "$OUT/stage31-production-package.json"
      - name: Commit only verified Stage31 package to a separate branch
        run: |
          set -euo pipefail
          git add -- tools/stage31/production-package.json
          test "$(git diff --cached --name-only)" = tools/stage31/production-package.json
          git diff --cached --check
          git -c user.name='HONRO release verification' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Refresh genuine Stage31 evidence on Stage16 candidate $SOURCE_SHA"
          target="work/stage31-refresh-stage16-generated/$GITHUB_RUN_ID"
          git push origin "HEAD:refs/heads/$target"
          expected=$(git rev-parse HEAD)
          actual=$(git ls-remote origin "refs/heads/$target" | cut -f1)
          test "$actual" = "$expected"
          printf '%s\n' "$expected" > "$OUT/generated-head.txt"
          printf '%s\n' "$target" > "$OUT/generated-branch.txt"
      - name: Existing focused observer and actual App checks
        run: node tests/stage16-observer-state.mjs && node tests/act23-v4-reviewed16.mjs
      - name: Actual Engine movement and App Continue with explicit synthetic states
        run: node tests/stage16-observer-app-resume.mjs
      - name: Actual Chromium inputs and reload on this built product
        run: python tests/stage16-observer-browser.py
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: stage16-observer-review
          path: |
            _local/reports/stage31-refresh-stage16/
            _local/reports/stage16-observer-app/
            _local/reports/stage16-observer-browser/
          if-no-files-found: error
          retention-days: 14

