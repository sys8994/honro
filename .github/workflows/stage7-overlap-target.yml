name: Stage7 Q narrow overlap native and phone actual Scene
on:
  workflow_dispatch:
  push:
    branches: [inspect/stage32-scanline-20261118]
    paths: ['tools/testing/stage7-overlap-target/**', '.github/workflows/stage7-overlap-target.yml']
permissions: {contents: read}
jobs:
  study:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env: {HONRO_ACT4_RELEASE: '1', HONRO_ACT5_RELEASE: '1'}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with: {path: study}
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with: {path: product, ref: 279d0ef80cfc2977266c819fde809e4f9889fde7, fetch-depth: 2}
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with: {path: baseline, ref: de8234e486633152fa376aa37633629dfecc83ee}
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with: {node-version: '22', package-manager-cache: false}
      - run: npm ci && npm ci --prefix game
        working-directory: product
      - run: npm ci && npm ci --prefix game
        working-directory: baseline
      - run: python -m pip install pillow numpy
      - run: node study/tools/testing/stage7-overlap-target/source-contract.mjs product
      - name: Own official builds
        run: |
          (cd product && node workshop/build.mjs && node game/build.mjs)
          (cd baseline && node workshop/build.mjs && node game/build.mjs)
          mkdir -p artifacts/evidence
      - name: Four normal Scenes and explicit diagnostic masks
        run: |
          node study/tools/testing/stage7-overlap-target/fixture.mjs baseline "$RUNNER_TEMP/edge-before" baseline
          node study/tools/testing/stage32-live-ss/actual/run.mjs "$RUNNER_TEMP/edge-before" artifacts/evidence
          node study/tools/testing/stage7-overlap-target/fixture.mjs product "$RUNNER_TEMP/edge-after" candidate
          node study/tools/testing/stage32-live-ss/actual/run.mjs "$RUNNER_TEMP/edge-after" artifacts/evidence
          python study/tools/testing/stage7-overlap-target/check.py artifacts/evidence
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with: {name: stage7-overlap-target, path: artifacts, if-no-files-found: error}
