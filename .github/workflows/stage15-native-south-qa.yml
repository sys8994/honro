name: Stage15 signed South actual B/S evidence only
on:
  push:
    branches: [qa/stage15-south-native-2939958-20261121]
permissions:
  contents: read
jobs:
  stage15-south-native:
    if: github.repository == 'sys8994/honro' && github.event_name == 'push' && github.ref == 'refs/heads/qa/stage15-south-native-2939958-20261121'
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
      - name: Verify add-only package, build two exact detached renderer probes
        shell: bash
        run: |
          set -euo pipefail
          ROOT=$GITHUB_WORKSPACE
          BASE=2939958cc87407ef60b58720bb6e086b8559031b
          test "$(git show -s --format=%P HEAD)" = "$BASE"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "$BASE^{tree}")" = 08e22a8cc0ab608e125ad73f8e8e1c288d8c4c74
          Q="$ROOT/tools/stage15-native-south-qa"
          W="$(mktemp -d "$RUNNER_TEMP/stage15-native-south.XXXXXX")"
          mkdir "$W/out"
          echo "WORK=$W" >> "$GITHUB_ENV"
          echo "QA=$Q" >> "$GITHUB_ENV"
          printf 'A\t%s\n' .github/workflows/stage15-native-south-qa.yml tools/stage15-native-south-qa/{PINS.json,baseline.json,capture.py,mask.json,method.txt,north_patch.py,signed-mask.json,source.py,south.py,verify.py} | LC_ALL=C sort > "$W/files"
          git diff --name-status --no-renames "$BASE" HEAD | LC_ALL=C sort | diff - "$W/files"
          R=shared/runtime/renderer.js
          C=shared/data/act2/stage15-compact-package.json
          for side in stock B S; do
            git worktree add --detach "$W/$side" "$BASE"
            t="$W/$side"
            test "$(realpath "$t")" = "$t"
            test "$(git -C "$t" rev-parse HEAD)" = "$BASE"
            if git -C "$t" symbolic-ref -q HEAD; then exit 1; fi
            test "$(git hash-object "$t/$R")" = 25c34f4a8c246c543389a472eb1746e6e226da88
            test "$(git hash-object "$t/$C")" = ac4fb9854c5bf713507564755848b6c2af1f8f1b
            test -z "$(git -C "$t" status --porcelain)"
          done
          python "$Q/north_patch.py" "$W/stock" "$W/B" > "$W/out/north-reference-edit.json"
          python "$Q/south.py" "$W/B/$R" "$W/S/$C" > "$W/S/$R"
          test "$(git hash-object "$W/B/$R")" = 13995f7a9c56912e74917dcd3454477a8cfbb05d
          test "$(git hash-object "$W/S/$R")" = f3f3780daeafe625573cb3b62cd098717698d6f6
          sha256sum "$W/"{B,S}"/$R" > "$W/out/renderer-probe-hashes.txt"
          for side in B S; do
            node --check "$W/$side/$R"
            (cd "$W/$side"; npm ci && npm ci --prefix game && npm run test:release-guard && npm run build && npm run test:production-contract) > "$W/out/build-$side.log" 2>&1 || { tail -100 "$W/out/build-$side.log"; exit 1; }
            test "$(git -C "$W/$side" status --porcelain=v1 -uall -- shared tools game tests package.json package-lock.json workshop/build.mjs)" = " M $R"
          done
          test -z "$(git -C "$W/stock" status --porcelain)"
      - name: Native current assets, 20 frozen views and full tile RGBA comparison
        timeout-minutes: 24
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$WORK/venv"
          V="$WORK/venv/bin/python"
          "$V" -m pip --disable-pip-version-check install playwright==1.62.0 Pillow==13.0.0 numpy
          "$V" -m playwright install --with-deps chromium
          python -m http.server 18841 --bind 127.0.0.1 --directory "$WORK/B" > "$WORK/out/http-B.log" 2>&1 &
          bp=$!
          python -m http.server 18842 --bind 127.0.0.1 --directory "$WORK/S" > "$WORK/out/http-S.log" 2>&1 &
          sp=$!
          trap 'kill "$bp" "$sp" 2>/dev/null || true' EXIT
          for p in 18841 18842; do curl -fsS --retry 10 --retry-connrefused "http://127.0.0.1:$p/HONRO.html" -o /dev/null; done
          export AUDIT_A="$WORK/stock" AUDIT_B="$WORK/B" AUDIT_STAGE=15
          for side in B S; do
            export AUDIT_ARM="$side" AUDIT_TREE="$WORK/$side" AUDIT_OUT="$WORK/out/$side"
            if [[ "$side" == B ]]; then export AUDIT_PORT=18841; else export AUDIT_PORT=18842; fi
            "$V" "$QA/source.py"
            "$V" "$QA/capture.py"
          done
          "$V" "$QA/verify.py" "$WORK/out"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && env.WORK != ''
        with:
          name: stage15-signed-south-B-S-localhost-proof
          path: ${{ env.WORK }}/out
          if-no-files-found: error
          retention-days: 7
