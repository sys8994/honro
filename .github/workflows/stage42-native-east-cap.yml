name: Stage42 east end-cap actual pointer and stock renderer QA
on:
  push:
    branches: ['qa/stage42-native-east-cap']
    paths: ['.github/workflows/stage42-native-east-cap.yml', 'tests/stage42-native-east-cap/**']
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HONRO_ACT4_RELEASE: '1'
      HONRO_ACT5_RELEASE: '1'
      HONRO_EAST_CAP_QA: '1'
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 4
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Build and verify disposable stock runtime, add only UI host
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/qa/stage42-native-east-cap
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = 9ce7c755b7e122b2ee71a435c82e56e89d6f9657
          test "$(git rev-parse HEAD^^^)" = 1e043b09d4ce107e1d2dcf70fe2274dff7098476
          printf '%s\n' .github/workflows/stage42-native-east-cap.yml tests/stage42-native-east-cap/archived-diagnostic.js tests/stage42-native-east-cap/browser-qa.py tests/stage42-native-east-cap/driver_binding.py tests/stage42-native-east-cap/pixel_gate.py > "$RUNNER_TEMP/east-retry-allowed.txt"
          git diff --name-only HEAD^ HEAD | diff -u "$RUNNER_TEMP/east-retry-allowed.txt" -
          git diff --name-only HEAD^ HEAD | grep -v -E '^(\.github/workflows/stage42-native-east-cap\.yml|tests/stage42-native-east-cap/[^/]+)$' > "$RUNNER_TEMP/unapproved-east-paths.txt" || true
          test ! -s "$RUNNER_TEMP/unapproved-east-paths.txt"
          echo "f3183316ab83edb79570dd66a6750c85acc9b6deb1b5ccd7d8a2dd28f282c05a  tests/stage42-native-east-cap/archived-diagnostic.js" | sha256sum -c -
          npm ci
          npm ci --prefix game
          npm run build
          B="$RUNNER_TEMP/stage42-east-cap-build"; E="$RUNNER_TEMP/stage42-east-cap-evidence"
          mkdir -p "$B" "$E"
          cp -a web HONRO_WORKSHOP.html HONRO.html "$B/"
          node tests/stage42-native-east-cap/source-check.mjs "$B" | tee "$E/source.json"
          node tests/stage42-native-east-cap/prepare-author-only.mjs "$B"
      - name: Real pointer, reopened compact file, independent exact stock A/A then candidate B
        run: |
          set -euo pipefail
          python -m pip install 'playwright==1.58.0' 'Pillow==12.0.0'
          export HONRO_CHROME="$(command -v google-chrome || command -v chromium)"
          test -x "$HONRO_CHROME"
          "$HONRO_CHROME" --version
          python -m http.server 8870 --bind 127.0.0.1 --directory "$RUNNER_TEMP/stage42-east-cap-build" &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for ((i=0;i<20;i++)); do
            if curl -fsS -o /dev/null http://127.0.0.1:8870/HONRO_WORKSHOP.html; then break; fi
            sleep 1
          done
          timeout 1000s python tests/stage42-native-east-cap/browser-qa.py "$RUNNER_TEMP/stage42-east-cap-evidence"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: stage42-native-east-cap-browser-evidence
          path: |
            ${{ runner.temp }}/stage42-east-cap-evidence/*.png
            ${{ runner.temp }}/stage42-east-cap-evidence/result.json
            ${{ runner.temp }}/stage42-east-cap-evidence/source.json
          if-no-files-found: warn
          retention-days: 7
