name: Stage32 independent filtered paint footprint
on:
  workflow_dispatch:
  push:
    branches: [inspect/stage32-scanline-20261118]
    paths:
      - tests/stage32-native-footprint-*
      - tests/fixtures/stage32-native-footprint-*
      - .github/workflows/stage32-native-footprint-experiment.yml
permissions:
  contents: read
jobs:
  narrow:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Independent mask fixture from recorded Scene tile planes
        run: node tests/stage32-native-footprint-fixture.mjs "$RUNNER_TEMP/footprint-input"
      - name: One actual Chrome probe, all seven masks
        shell: bash
        run: |
          browser=$(command -v google-chrome || command -v chromium)
          mkdir -p "$RUNNER_TEMP/narrow-evidence"
          "$browser" --version > "$RUNNER_TEMP/narrow-evidence/chrome-version.txt"
          timeout 90s node tests/stage32-registered-one-probe.mjs "$browser" "$RUNNER_TEMP/footprint-profile" "$RUNNER_TEMP/footprint-input/footprint.html" "$RUNNER_TEMP/narrow-evidence/probe"
          node tests/stage32-native-footprint-check.mjs "$RUNNER_TEMP/narrow-evidence/probe/result.html" "$RUNNER_TEMP/narrow-evidence"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: stage32-native-footprint-experiment
          path: ${{ runner.temp }}/narrow-evidence
          if-no-files-found: warn
