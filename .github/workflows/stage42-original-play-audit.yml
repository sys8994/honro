name: Stage42 untouched baseline game and diagnostic coverage
on:
  push:
    branches: ['qa/stage42-original-play-audit']
    paths: ['.github/workflows/stage42-original-play-audit.yml', 'tests/stage42-original-play-audit/**']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      HONRO_ACT4_RELEASE: '1'
      HONRO_ACT5_RELEASE: '1'
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Pin and build unmodified original game
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/qa/stage42-original-play-audit
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = 1e043b09d4ce107e1d2dcf70fe2274dff7098476
          test "$(git rev-parse HEAD:shared/assets/environment/act5/stage42-registered-body.json)" = 0644364507adadc132c3f1e4da7953c61641e8af
          test "$(git rev-parse HEAD:shared/assets/environment/act5/stage42-surface.json)" = cabd9306550c0ccd742dfd3633f3c266ec9b7819
          git diff --name-only HEAD^ HEAD | grep -v -E '^(\.github/workflows/stage42-original-play-audit\.yml|tests/stage42-original-play-audit/[^/]+)$' > "$RUNNER_TEMP/unapproved-paths.txt" || true
          test ! -s "$RUNNER_TEMP/unapproved-paths.txt"
          npm ci
          npm ci --prefix game
          npm run build
          B="$RUNNER_TEMP/stage42-original-audit-build"
          E="$RUNNER_TEMP/stage42-original-audit-evidence"
          mkdir -p "$B" "$E"
          cp -a web HONRO_WORKSHOP.html HONRO.html "$B/"
          node tests/stage42-original-play-audit/source-check.mjs "$B" > "$E/source.json"
          (cd "$B"; sha256sum HONRO.html HONRO_WORKSHOP.html web/manifest.json) > "$E/build-sha256.txt"
      - name: Live game keys and separate normalized scene camera sampling
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'playwright==1.58.0'
          export HONRO_CHROME="$(command -v google-chrome || command -v chromium)"
          test -x "$HONRO_CHROME"
          "$HONRO_CHROME" --version
          python -m http.server 8870 --bind 127.0.0.1 --directory "$RUNNER_TEMP/stage42-original-audit-build" &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for ((i=0;i<20;i++)); do
            if curl -fsS -o /dev/null http://127.0.0.1:8870/HONRO.html; then break; fi
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:8870/HONRO.html
          timeout 900s python tests/stage42-original-play-audit/audit.py --base http://127.0.0.1:8870 --out "$RUNNER_TEMP/stage42-original-audit-evidence"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: stage42-original-audit-evidence
          path: |
            ${{ runner.temp }}/stage42-original-audit-evidence/*.png
            ${{ runner.temp }}/stage42-original-audit-evidence/source.json
            ${{ runner.temp }}/stage42-original-audit-evidence/result.json
            ${{ runner.temp }}/stage42-original-audit-evidence/build-sha256.txt
          if-no-files-found: warn
          retention-days: 7
