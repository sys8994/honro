name: Stage6 initial placement preview
on:
  push:
    branches: ['work/stage6-initial-preview-20261103']
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Prepare unpublished Stage6 visual preview
        env:
          HONRO_ACT4_RELEASE: '1'
        run: |
          set -euo pipefail
          mkdir -p _local/reports/stage6-preview
          npm ci
          npm ci --prefix game
          python -m pip install 'playwright==1.58.0'
          python -m playwright install --with-deps chromium
          node tools/act4-ci/refresh-stage31-probes.mjs prepare _local/reports/stage6-preview
          node workshop/build.mjs > _local/reports/stage6-preview/build.log 2>&1
          python tests/stage6-initial-capture-local.py
          cp -a _local/reports/stage6-preflight/initial-browser _local/reports/stage6-preview/
          python tests/stage6-warning-browser.py
          sha256sum HONRO.html web/manifest.json > _local/reports/stage6-preview/served-sha256.txt
          printf '%s\n' "$GITHUB_SHA" > _local/reports/stage6-preview/source-sha.txt
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: stage6-initial-preview-${{ github.sha }}
          path: _local/reports/stage6-preview
          retention-days: 7
