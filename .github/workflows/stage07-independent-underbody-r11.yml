name: HONRO Stage7 exact already-reviewed native build producer no deploy
on:
  push:
    branches: [qa/stage07-chapter-sealed-producer-0b9]
    paths: [".github/workflows/stage07-independent-underbody-r11.yml","tools/stage07-independent-underbody-r11/**"]
permissions:
  contents: read
  actions: read
jobs:
  visual:
    if: github.repository == 'sys8994/honro' && github.ref == 'refs/heads/qa/stage07-chapter-sealed-producer-0b9'
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
      - name: Pinned readonly current stock and one ordinary candidate build
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/stage07-r11-proof"; mkdir -p "$W/out"
          echo "W=$W" >> "$GITHUB_ENV"
          T="$GITHUB_WORKSPACE/tools/stage07-independent-underbody-r11"
          python "$T/guard.py" pre "$W"
          (cd "$W/B"; npm ci >"$W/out/npm.log" 2>&1; npm ci --prefix game >"$W/out/npm-game.log" 2>&1; npm run build >"$W/out/build.log" 2>&1; npm run test:production-contract >"$W/out/contract.log" 2>&1)
          python "$T/guard.py" closure "$W"
      - name: Seal only bytes identical to previous qualified browser build; no browser rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: python "$GITHUB_WORKSPACE/tools/stage07-independent-underbody-r11/custody.py" "$W"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage07-chapter-sealed-producer-no-deploy
          path: ${{ runner.temp }}/stage07-r11-proof/out/
          if-no-files-found: warn
          retention-days: 7
