name: Combined monster full isolated Chrome matrix
on:
  push:
    branches: ['test/combined-monster-full-matrix-20261118']
permissions:
  contents: read
jobs:
  m40:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Combined production identity
        run: |
          git fetch --depth=1 origin 09ac90235b89031b6df8d88cde4c16f39aba78f7
          git diff --exit-code 09ac90235b89031b6df8d88cde4c16f39aba78f7 -- shared game/src game/config tools/map-forge tools/environment tools/stage6-prototype
      - run: npm ci && npm ci --prefix game
      - name: Preserve roster, quest, terrain and safe zone
        run: |
          git fetch --no-tags --depth=1 origin 7d238d20663c3ceffe430eb0304e01516ae625cf
          node tests/stage40-placement-contract.mjs
      - name: Audit final generated units for all fifty stages
        run: node tests/monster-placement-survey.mjs
      - name: Generate isolated official Stage40 A/B scenes
        run: HONRO_ACT4_RELEASE=1 node tests/matrix-monster-placement-browser-fixture.mjs "$RUNNER_TEMP/placement40"
      - name: Actual Chrome before and after
        shell: bash
        run: |
          browser=$(command -v google-chrome || command -v chromium)
          for variant in baseline candidate; do
            for view in overview west east; do
              name="stage40-$variant-$view"
              timeout 300s "$browser" --headless --no-first-run --no-default-browser-check --force-device-scale-factor=1 --virtual-time-budget=60000 --user-data-dir="$RUNNER_TEMP/profile-$name" --dump-dom "file://$RUNNER_TEMP/placement40/$name.html" > "$RUNNER_TEMP/$name.html"
              node tests/monster-placement-browser-result.mjs "$RUNNER_TEMP/$name.html" "$RUNNER_TEMP/placement40-results"
            done
          done
      - name: Official app build
        run: HONRO_ACT4_RELEASE=1 HONRO_ACT5_RELEASE=1 npm run build
      - name: Geometry and official loader evidence
        run: node tests/combined-matrix-evidence.mjs "$RUNNER_TEMP/placement40-results" > "$RUNNER_TEMP/placement40-results/matrix-evidence.jsonl"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: monster-placement-review
          path: |
            ${{ runner.temp }}/placement40-results
            _local/reports/monster-placement
          if-no-files-found: warn
  middle:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Combined production identity
        run: |
          git fetch --depth=1 origin 09ac90235b89031b6df8d88cde4c16f39aba78f7
          git diff --exit-code 09ac90235b89031b6df8d88cde4c16f39aba78f7 -- shared game/src game/config tools/map-forge tools/environment tools/stage6-prototype
      - run: npm ci && npm ci --prefix game
      - run: node tests/act4-middle-placement-contract.mjs
      - run: HONRO_ACT4_RELEASE=1 node tests/matrix-act4-middle-placement-browser.mjs "$RUNNER_TEMP/middle"
      - name: Actual Chrome A/B scenes
        shell: bash
        run: |
          browser=$(command -v google-chrome || command -v chromium)
          for stage in 34 35 37 38; do
            for variant in baseline candidate; do
              for view in overview focus; do
                name="stage$stage-$variant-$view"
                timeout 300s "$browser" --headless --no-first-run --no-default-browser-check --force-device-scale-factor=1 --virtual-time-budget=60000 --user-data-dir="$RUNNER_TEMP/profile-$name" --dump-dom "file://$RUNNER_TEMP/middle/$name.html" > "$RUNNER_TEMP/$name.html"
                node tests/act4-middle-placement-result.mjs "$RUNNER_TEMP/$name.html" "$RUNNER_TEMP/middle-results"
              done
            done
          done
      - run: HONRO_ACT4_RELEASE=1 HONRO_ACT5_RELEASE=1 npm run build
      - name: Geometry and official loader evidence
        run: node tests/combined-matrix-evidence.mjs "$RUNNER_TEMP/middle-results" > "$RUNNER_TEMP/middle-results/matrix-evidence.jsonl"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: act4-middle-placement-review
          path: |
            ${{ runner.temp }}/middle-results
            _local/reports/act4-middle-placement
          if-no-files-found: warn
  early:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Combined production identity
        run: |
          git fetch --depth=1 origin 09ac90235b89031b6df8d88cde4c16f39aba78f7
          git diff --exit-code 09ac90235b89031b6df8d88cde4c16f39aba78f7 -- shared game/src game/config tools/map-forge tools/environment tools/stage6-prototype
      - run: npm ci && npm ci --prefix game
      - run: node tests/early-encounter-contract.mjs
      - run: node tests/matrix-early-encounter-browser-fixture.mjs "$RUNNER_TEMP/early"
        if: always()
      - name: Isolated initial Chrome scenes
        if: always()
        shell: bash
        run: |
          browser=$(command -v google-chrome || command -v chromium)
          for stage in 13 29 30 9 17; do
            variants='candidate'; if [[ "$stage" == 9 || "$stage" == 13 || "$stage" == 17 || "$stage" == 29 ]]; then variants='baseline candidate'; fi
            for variant in $variants; do
            for view in focus overview; do
              name="stage$stage-$variant-$view"
              timeout 300s "$browser" --headless --no-first-run --no-default-browser-check --force-device-scale-factor=1 --virtual-time-budget=60000 --user-data-dir="$RUNNER_TEMP/profile-$name" --dump-dom "file://$RUNNER_TEMP/early/$name.html" > "$RUNNER_TEMP/$name.html"
              node tests/early-encounter-browser-result.mjs "$RUNNER_TEMP/$name.html" "$RUNNER_TEMP/early-results"
            done
            done
          done
      - name: Geometry and official loader evidence
        run: node tests/combined-matrix-evidence.mjs "$RUNNER_TEMP/early-results" > "$RUNNER_TEMP/early-results/matrix-evidence.jsonl"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: early-encounter-inspection
          path: |
            ${{ runner.temp }}/early-results
            _local/reports/early-encounters
          if-no-files-found: warn
  act5:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Combined production identity
        run: |
          git fetch --depth=1 origin 09ac90235b89031b6df8d88cde4c16f39aba78f7
          git diff --exit-code 09ac90235b89031b6df8d88cde4c16f39aba78f7 -- shared game/src game/config tools/map-forge tools/environment tools/stage6-prototype
      - run: npm ci && npm ci --prefix game
      - name: Protect roster, required identities and placement gaps
        run: |
          git fetch --no-tags --depth=1 origin 7d238d20663c3ceffe430eb0304e01516ae625cf
          node tests/act5-meaningful-encounters.test.mjs
      - name: Generate isolated official Act5 A/B scenes
        run: HONRO_PLACEMENT_STAGES=43,47,48 HONRO_ACT4_RELEASE=1 HONRO_ACT5_RELEASE=1 node tests/matrix-act5-placement-browser-fixture.mjs "$RUNNER_TEMP/placement-act5"
      - name: Actual Chrome before and after
        shell: bash
        run: |
          browser=$(command -v google-chrome || command -v chromium)
          for stage in 43 47 48; do
          for variant in baseline candidate; do
            for view in overview west east; do
              name="stage$stage-$variant-$view"
              timeout 300s "$browser" --headless --no-first-run --no-default-browser-check --force-device-scale-factor=1 --virtual-time-budget=60000 --user-data-dir="$RUNNER_TEMP/profile-$name" --dump-dom "file://$RUNNER_TEMP/placement-act5/$name.html" > "$RUNNER_TEMP/$name.html"
              node tests/act5-placement-browser-result.mjs "$RUNNER_TEMP/$name.html" "$RUNNER_TEMP/placement-act5-results"
            done
          done
          done
      - name: Official app build
        run: HONRO_ACT4_RELEASE=1 HONRO_ACT5_RELEASE=1 npm run build
      - name: Geometry and official loader evidence
        run: node tests/combined-matrix-evidence.mjs "$RUNNER_TEMP/placement-act5-results" > "$RUNNER_TEMP/placement-act5-results/matrix-evidence.jsonl"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: act5-placement-review
          path: |
            ${{ runner.temp }}/placement-act5-results
            _local/reports/monster-placement
          if-no-files-found: warn
  actions:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Combined production identity
        run: |
          git fetch --depth=1 origin 09ac90235b89031b6df8d88cde4c16f39aba78f7
          git diff --exit-code 09ac90235b89031b6df8d88cde4c16f39aba78f7 -- shared game/src game/config tools/map-forge tools/environment tools/stage6-prototype
      - run: npm ci && npm ci --prefix game
      - name: Protect roster, required identities and placement gaps
        run: |
          git fetch --no-tags --depth=1 origin 7d238d20663c3ceffe430eb0304e01516ae625cf
          node tests/act5-meaningful-encounters.test.mjs
      - name: Generate isolated official Act5 A/B scenes
        run: HONRO_PLACEMENT_STAGES=43,47,48 HONRO_ACT4_RELEASE=1 HONRO_ACT5_RELEASE=1 node tests/matrix-act5-placement-action-fixture.mjs "$RUNNER_TEMP/placement-act5"
      - name: Actual Chrome before and after
        shell: bash
        run: |
          browser=$(command -v google-chrome || command -v chromium)
          for stage in 43 47 48; do
          for variant in candidate; do
            for view in overview; do
              name="stage$stage-$variant-$view"
              timeout 300s "$browser" --headless --no-first-run --no-default-browser-check --force-device-scale-factor=1 --virtual-time-budget=60000 --user-data-dir="$RUNNER_TEMP/profile-$name" --dump-dom "file://$RUNNER_TEMP/placement-act5/$name.html" > "$RUNNER_TEMP/$name.html"
              node tests/act5-placement-browser-result.mjs "$RUNNER_TEMP/$name.html" "$RUNNER_TEMP/placement-act5-results"
            done
          done
          done
      - name: Official app build
        run: HONRO_ACT4_RELEASE=1 HONRO_ACT5_RELEASE=1 npm run build
      - name: Geometry and official loader evidence
        run: node tests/combined-matrix-evidence.mjs "$RUNNER_TEMP/placement-act5-results" > "$RUNNER_TEMP/placement-act5-results/matrix-evidence.jsonl"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: act5-local-actions
          path: |
            ${{ runner.temp }}/placement-act5-results
            _local/reports/monster-placement
          if-no-files-found: warn
