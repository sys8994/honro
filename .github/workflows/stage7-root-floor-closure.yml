name: HONRO Stage7 isolated canonical far-floor stroke verification
on:
  push:
    branches: [qa/stage7-root-floor-closure-9ac-r2]
    paths:
      - .github/workflows/stage7-root-floor-closure.yml
      - tools/stage7-root-floor-closure/**
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'sys8994/honro' && github.event_name == 'push' && github.ref == 'refs/heads/qa/stage7-root-floor-closure-9ac-r2'
    runs-on: ubuntu-24.04
    timeout-minutes: 39
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 4
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
      - name: Exact A/normal B and approved source scope
        shell: bash
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/stage7-root-floor-closure"
          mkdir "$T" "$T/out"
          echo "WORK=$T" >> "$GITHUB_ENV"
          Q="$GITHUB_WORKSPACE/tools/stage7-root-floor-closure"
          python "$Q/guard.py" pre "$T"
          (
            cd "$T/B"
            npm ci > "$T/out/npm-root-B.log" 2>&1
            npm ci --prefix game > "$T/out/npm-game-B.log" 2>&1
            npm run test:release-guard > "$T/out/release-guard-B.log" 2>&1
            node tests/stage7-root-floor-closure.mjs > "$T/out/focused-B.log" 2>&1
            npm run build > "$T/out/build-B.log" 2>&1
            npm run test:production-contract > "$T/out/production-contract-B.log" 2>&1
          )
          python "$Q/guard.py" built "$T"
      - name: Actual normal compiled Chrome A/B (no response injection)
        shell: bash
        timeout-minutes: 25
        run: |
          set -euo pipefail
          Q="$GITHUB_WORKSPACE/tools/stage7-root-floor-closure"
          python3 -m venv "$WORK/venv"
          V="$WORK/venv/bin/python"
          "$V" -m pip --disable-pip-version-check install playwright==1.62.0 Pillow==13.0.0
          "$V" -m playwright install --with-deps chromium
          python -m http.server 18841 --bind 127.0.0.1 --directory "$WORK/A" > "$WORK/out/http-A.log" 2>&1 &
          a=$!
          python -m http.server 18842 --bind 127.0.0.1 --directory "$WORK/B" > "$WORK/out/http-B.log" 2>&1 &
          b=$!
          trap 'kill "$a" "$b" 2>/dev/null || true' EXIT
          for p in 18841 18842; do curl -fsS --retry 8 --retry-connrefused "http://127.0.0.1:$p/HONRO.html" -o /dev/null; done
          PYTHONDONTWRITEBYTECODE=1 "$V" "$Q/views.py" "$WORK"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: honro-stage7-root-floor-line-controlled-normal-r2-qa-only
          path: ${{ runner.temp }}/stage7-root-floor-closure/out/
          if-no-files-found: warn
          retention-days: 7
