name: Immutable gated A1 visual completion
on:
  push:
    branches: ['work/monster-a1-visual-qa/**']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  visual-completion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: 22
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Preflight injected JS and Python before browser setup
        run: |
          set -euo pipefail
          python -m py_compile tests/monster-effects-browser.py tools/monster-a1-qa/verify-candidate.py
          node tests/monster-effects-browser-harness.mjs
      - name: Verify immutable candidate and original gated artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/monster-a1-qa/verify-candidate.py
      - name: Read-only production gate; never rebuild or rerun Stage31
        run: |
          set -euo pipefail
          npm ci
          npm ci --prefix game
          node tools/stage31/check-release.mjs | tee _local/reports/monster-a1-visual-qa/normal-gate.log
          git diff --exit-code -- HONRO.html HONRO_WORKSHOP.html index.html web tools/stage31/production-package.json
      - name: Install native browser
        run: |
          python -m pip install 'playwright==1.58.0'
          python -m playwright install --with-deps chromium
      - name: Complete actual controls and capture normal camera framing
        run: |
          set -euo pipefail
          python -m http.server 8871 --bind 127.0.0.1 > _local/reports/monster-a1-visual-qa/server.log 2>&1 &
          server=$!; trap 'kill "$server" 2>/dev/null || true' EXIT
          sleep 2
          HONRO_MONSTER_BASE_URL="$(cat _local/reports/monster-a1-visual-qa/base-url.txt)" python tests/monster-effects-browser.py
          cp _local/reports/monster-effects-browser/summary.json _local/reports/monster-a1-visual-qa/browser-summary.json
          git diff --exit-code -- HONRO.html HONRO_WORKSHOP.html index.html web tools/stage31/production-package.json
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: monster-a1-visual-${{ github.sha }}
          path: |
            _local/reports/monster-a1-visual-qa/
            _local/reports/monster-effects-browser/
          retention-days: 7
