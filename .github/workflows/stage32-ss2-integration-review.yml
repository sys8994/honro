name: Stage32 SS2 final overview and integration review
on:
  workflow_dispatch:
  push:
    branches: [inspect/stage32-scanline-20261118]
    paths:
      - tests/stage32-ss2-*
      - tests/fixtures/stage32-ss2-*
      - .github/workflows/stage32-ss2-integration-review.yml
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci && npm ci --prefix game
      - name: Preserve previous native contracts, verify new six-buffer contract separately
        run: |
          node tests/stage32-coverage-native-contract.mjs
          node tests/stage32-ss2-native-contract.mjs
      - name: Original providers, paths, physics and codec contracts
        run: |
          git fetch origin e89242eedb5c040d38a9077c7289fbdc97786bdf --depth=1
          BASELINE_REF=e89242eedb5c040d38a9077c7289fbdc97786bdf node tests/stage32-foundation-contract.mjs
      - name: Generate remaining two overview pairs
        run: HONRO_ACT4_RELEASE=1 node tests/stage32-ss2-overview-fixture.mjs "$RUNNER_TEMP/ss2-overviews"
      - name: Actual Chrome, original versus cleanup SS2
        shell: bash
        run: |
          browser=$(command -v google-chrome || command -v chromium)
          mkdir -p "$RUNNER_TEMP/ss2-evidence"
          "$browser" --version > "$RUNNER_TEMP/ss2-evidence/chrome-version.txt"
          failed=0
          for variant in candidate ss2; do
            for view in portrait-overview landscape-overview; do
              dump="$RUNNER_TEMP/ss2-$variant-$view.html"
              if timeout 320s node tests/stage32-real-clock-chrome.mjs "$browser" "$RUNNER_TEMP/ss2-profile-$variant-$view" "$RUNNER_TEMP/ss2-overviews/stage32-matrix-$variant-$view.html" "$dump"; then
                node tests/stage32-ss2-overview-result.mjs "$dump" "$RUNNER_TEMP/ss2-evidence" "$variant" "$view" || failed=1
              else
                printf '{"ok":false,"reason":"Chrome timeout/process failure"}\n' > "$RUNNER_TEMP/ss2-evidence/$variant-$view-process-failure.json"
                failed=1
              fi
            done
          done
          exit "$failed"
      - name: Frozen original and protected overview pixels
        if: ${{ !cancelled() }}
        run: node tests/stage32-ss2-overview-compare.mjs "$RUNNER_TEMP/ss2-evidence" ss2
      - name: Workshop and Game builds with temporary cleanup helper
        shell: bash
        run: |
          cp shared/runtime/stage32-foundation-art.js "$RUNNER_TEMP/original-stage32-helper.js"
          trap 'cp "$RUNNER_TEMP/original-stage32-helper.js" shared/runtime/stage32-foundation-art.js' EXIT
          cp tests/fixtures/stage32-ss2-release-candidate.js shared/runtime/stage32-foundation-art.js
          HONRO_ACT4_RELEASE=1 node workshop/build.mjs
          HONRO_ACT4_RELEASE=1 npm --prefix game run build
      - name: Production helper restored, no persistent registration
        if: always()
        run: git diff --exit-code -- shared/runtime/stage32-foundation-art.js
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: stage32-ss2-integration-review
          path: ${{ runner.temp }}/ss2-evidence
          if-no-files-found: error
