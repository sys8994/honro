name: Stage23 public checkpoint review
on:
  push:
    branches: ['work/stage23-current-public-20261104']
permissions:
  contents: read
  actions: read
jobs:
  public-checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install browser test dependency
        run: pip install playwright==1.51.0 && python -m playwright install --with-deps chromium
      - name: Retrieve exact natural native checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 41759542357 --repo sys8994/honro --name stage23-current-natural --dir _local/stage23-prior
      - name: Verify published Stage23 with actual UI inputs
        run: python tools/stage23-qa/public-checkpoint-review.py
      - name: Preserve public observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage23-public-checkpoint
          path: _local/reports/stage23-public-checkpoint
          if-no-files-found: error
          retention-days: 14
