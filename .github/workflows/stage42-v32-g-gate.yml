name: Stage42 G native small Korean gate witness
on:
  push:
    branches: ['qa/stage42-v32-g-gate']
    paths: ['.github/workflows/stage42-v32-g-gate.yml','tests/stage42-v32-g-gate/**']
permissions:
  contents: read
jobs:
  stock_smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Confirm exact stock base and narrow QA additions
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/qa/stage42-v32-g-gate
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = 1e043b09d4ce107e1d2dcf70fe2274dff7098476
          Q=tests/stage42-v32-g-gate
          printf '%s\n' .github/workflows/stage42-v32-g-gate.yml "$Q/smoke.SHA256SUMS" "$Q/g-gate-proof.py" "$Q/apply-native-fill.mjs" | LC_ALL=C sort > "$RUNNER_TEMP/solid-allowlist"
          git diff --name-only HEAD^ HEAD | LC_ALL=C sort | diff -u "$RUNNER_TEMP/solid-allowlist" -
          git diff --name-only --diff-filter=A HEAD^ HEAD | LC_ALL=C sort | diff -u "$RUNNER_TEMP/solid-allowlist" -
          echo '9868dcedf3051e84c0cc50135ff0d3bce3110f08af2107b31658f9e087523411  tests/stage42-v32-g-gate/smoke.SHA256SUMS' | sha256sum -c -
          (cd "$Q" && sha256sum -c smoke.SHA256SUMS)
      - name: Build unmodified stock Workshop
        run: |
          set -euo pipefail
          npm ci
          npm ci --prefix game
          npm run build
          D="$RUNNER_TEMP/stage42-native-fill-disposable"
          mkdir -p "$D"
          cp -a web HONRO_WORKSHOP.html HONRO.html "$D/"
          HONRO_NATIVE_FILL_PROOF=1 node tests/stage42-v32-g-gate/apply-native-fill.mjs "$D"
          node --check "$D/web/runtime/workshop-app.489f733634454986.js"
      - name: Run a single genuine Solid authoring and Player smoke
        run: |
          set -euo pipefail
          python -m pip install 'playwright==1.58.0'
          export HONRO_CHROME="$(command -v google-chrome || command -v chromium)"
          "$HONRO_CHROME" --version
          mkdir -p "$RUNNER_TEMP/stock-solid-evidence"
          D="$RUNNER_TEMP/stage42-native-fill-disposable"
          python -m http.server 8884 --bind 127.0.0.1 --directory "$D" &
          pid=$!; trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..20}; do if curl -fsS -o /dev/null http://127.0.0.1:8884/HONRO_WORKSHOP.html; then break; fi; sleep 1; done
          timeout 360s python tests/stage42-v32-g-gate/g-gate-proof.py "$RUNNER_TEMP/stock-solid-evidence" http://127.0.0.1:8884/HONRO_WORKSHOP.html
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: stage42-v32-g-gate-evidence
          path: |
            ${{ runner.temp }}/stock-solid-evidence/0[1-8]-*.png
            ${{ runner.temp }}/stock-solid-evidence/blank-diagnostics.json
            ${{ runner.temp }}/stock-solid-evidence/camera-proof.json
            ${{ runner.temp }}/stock-solid-evidence/domain-proof.json
            ${{ runner.temp }}/stock-solid-evidence/bridge-proof.json
            ${{ runner.temp }}/stock-solid-evidence/gate-proof.json
            ${{ runner.temp }}/stock-solid-evidence/gate-pointer-fit.json
            ${{ runner.temp }}/stock-solid-evidence/g-native-geometry-receipt.json
            ${{ runner.temp }}/stock-solid-evidence/bridge-pointer-fit.json
            ${{ runner.temp }}/stock-solid-evidence/pointer-diagnostic.json
            ${{ runner.temp }}/stock-solid-evidence/proof.json
            ${{ runner.temp }}/stock-solid-evidence/movement.json
            ${{ runner.temp }}/stock-solid-evidence/whole-geographic-walk.json
            ${{ runner.temp }}/stock-solid-evidence/spawn-proof.json
            ${{ runner.temp }}/stock-solid-evidence/west-replay-proof.json
          if-no-files-found: warn
          retention-days: 7
