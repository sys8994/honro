name: Act4 candidate actual browser captures
on:
  push:
    branches: ['work/act4-recovery-art/**']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      HONRO_ACT4_RELEASE: '1'
      HONRO_CAPTURE_URL: http://127.0.0.1:8870/HONRO.html
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Build isolated unapproved candidate
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix game --no-audit --no-fund
          python -m pip install 'playwright==1.58.0'
          python -m playwright install --with-deps chromium
          sha256sum HONRO.html web/manifest.json > /tmp/public-before.txt
          node workshop/build.mjs --preview recovery-art
          sha256sum -c /tmp/public-before.txt
      - name: Capture normal journey replay without changing live actors
        run: |
          mkdir -p _local/reports/recovery-art
          python -m http.server 8870 --bind 127.0.0.1 --directory _local/previews/recovery-art > _local/reports/recovery-art/server.log 2>&1 &
          server=$!; trap 'kill "$server" 2>/dev/null || true' EXIT
          sleep 2
          failures=0
          stages="40 39 38 37 36 35 34 33 32 31"
          if [[ "$GITHUB_REF_NAME" == *"/40-only-"* ]]; then stages="40"; fi
          for stage in $stages; do
            export HONRO_CAPTURE_STAGE="$stage"
            export HONRO_CAPTURE_OUT="_local/reports/recovery-art/stage$stage"
            mkdir -p "$HONRO_CAPTURE_OUT"
            python tools/act4-ci/capture-stage-art.py > "$HONRO_CAPTURE_OUT/run.log" 2>&1 || failures=$((failures+1))
          done
          echo "Failed captures: $failures"
          test "$failures" -eq 0
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: act4-candidate-art-${{ github.sha }}
          path: _local/reports/recovery-art/
          retention-days: 7
