name: Stage15 anonymous Pages exact readback (no deploy)
on:
  push:
    branches: [qa/stage15-public-readback-71fb443-20261121]
permissions:
  contents: read
jobs:
  exact-stage15-readback:
    if: github.repository == 'sys8994/honro' && github.event_name == 'push' && github.ref == 'refs/heads/qa/stage15-public-readback-71fb443-20261121'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Hold before network if the public Pages evidence is not filled
        shell: bash
        run: |
          set -euo pipefail
          T="$GITHUB_WORKSPACE/tools/stage15-public-readback"
          python3 - "$T/RELEASE.json" <<'PY'
          import datetime,json,sys
          p=json.load(open(sys.argv[1]))
          assert p['release']=='71fb443675aed659a572b722a4337212e9d2f910'
          assert p['pagesConclusion']=='success' and all(type(p[x]) is int and p[x]>0 for x in ('pagesRun','pagesJob')),'Hold: exact successful Pages run is not yet supplied'
          assert datetime.datetime.fromisoformat(p['pagesCompletedUTC'])<=datetime.datetime.now(datetime.timezone.utc)
          PY
          O="$(mktemp -d "$RUNNER_TEMP/stage15-public-readback.XXXXXX")"
          echo "STAGE15_PUBLIC_OUT=$O" >> "$GITHUB_ENV"
      - name: Anonymous graph and browser readback of exact live source
        shell: bash
        timeout-minutes: 16
        run: |
          set -euo pipefail
          V="$RUNNER_TEMP/stage15-public-native-venv"
          python3 -m venv "$V"
          "$V/bin/python" -m pip --disable-pip-version-check install playwright==1.62.0 Pillow==13.0.0
          "$V/bin/python" -m playwright install --with-deps chromium
          PYTHONDONTWRITEBYTECODE=1 "$V/bin/python" tools/stage15-public-readback/public_native.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && env.STAGE15_PUBLIC_OUT != ''
        with:
          name: stage15-anonymous-public-exact-native-readback
          path: ${{ env.STAGE15_PUBLIC_OUT }}
          if-no-files-found: error
          retention-days: 7
