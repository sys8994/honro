name: Verify Stage12 source skirt join
on:
  push:
    branches: ['fix/stage12-ground-skirt-20261117']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci && npm ci --prefix game
      - name: Verify original art, physics and upper tree bounds
        run: node tests/stage12-ground-skirt.mjs && node tools/act1-vector-production/check-stage12-tree-bounds.mjs
      - name: Verify related stage3 and stage7 renderer regressions
        run: node tools/act1-vector-production/check-stage3-edge-audit.mjs && node tools/act1-vector-production/check-stage7-edge-audit.mjs
      - name: Verify official stage12 packer is reproducible
        run: node tools/map-forge/pack-act2-compact.mjs && git diff --exit-code -- shared/data/act2/stage12-compact-package.json
      - name: Build official runtime
        run: npm run build
