name: Inspect Stage6 while Stage31 release remains blocked
on:
  push:
    branches: ['work/stage6-master-preview-20261104']
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      HONRO_ACT4_RELEASE: '1'
      HONRO_QA_ORIGIN: http://127.0.0.1:8870
      OUT: _local/reports/stage6-master-preview
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Verify original saved checkpoint and preserve publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT/input"
          git rev-parse HEAD HEAD^{tree} > "$OUT/source.txt"
          gh api /repos/${{ github.repository }}/actions/artifacts/13279038512/zip > /tmp/stage6-r7-original.zip
          python - <<'PY'
          import hashlib,zipfile,pathlib,os
          p=pathlib.Path('/tmp/stage6-r7-original.zip');assert hashlib.sha256(p.read_bytes()).hexdigest()=='d262e3dff2e305a9ec44e9e9c010169a4ace3b17816144810ef330332725cb6e'
          b=zipfile.ZipFile(p).read('integrated-play/natural-pursuit-entry-save.json.gz');assert hashlib.sha256(b).hexdigest()=='19f9cbe6c839b02fcf50b1ad952835f8498efb343c054b51835be9aca2ed61ab'
          (pathlib.Path(os.environ['OUT'])/'input/r7-pursuit.json.gz').write_bytes(b)
          PY
          curl -fLsS https://raw.githubusercontent.com/sys8994/honro/08c17f1f5e712f53c97253a70c44185030ad1437/web/manifest.json -o "$RUNNER_TEMP/published-source-manifest.json"
          node --test tools/release/register-current-publication.test.mjs
          node tools/release/register-current-publication.mjs --source-manifest "$RUNNER_TEMP/published-source-manifest.json" --expected-blob-sha 1edc828a71fbc2536bc84a9ec78b5fbd0e762ed0 --source-sha 08c17f1f5e712f53c97253a70c44185030ad1437 --published-at 2026-11-04T00:17:33Z --evidence https://github.com/sys8994/honro/actions/runs/41745380688 | tee "$OUT/retention.log"
      - name: Current source contracts and actual Stage31 probes
        run: |
          set -euo pipefail
          npm ci
          npm ci --prefix game
          npm --prefix game run typecheck
          node tools/stage40-qa/cleanup-corridors.test.mjs | tee "$OUT/corridors.log"
          node tools/act4-ci/positive-finisher.test.mjs | tee "$OUT/positive-finisher.log"
          for test in stage6-art-preview stage6-integrated-preview stage6-render-coverage-preview stage6-descent-view-preview stage6-reviewed-pursuit stage6-pursuit-response stage6-integrated-entry; do
            node "tests/$test.mjs" | tee "$OUT/$test.log"
          done
          node tools/act4-ci/refresh-stage31-probes.mjs prepare "$OUT"
          node workshop/build.mjs | tee "$OUT/preview-build.log"
          sha256sum HONRO.html > "$OUT/preview-html.sha256"
          node --input-type=module -e 'import fs from "node:fs";fs.writeFileSync(process.env.OUT+"/preview-active-files.json",JSON.stringify(JSON.parse(fs.readFileSync("web/manifest.json")).files.map(({path,bytes,sha256})=>({path,bytes,sha256})).sort((a,b)=>a.path.localeCompare(b.path))))'
          python -m pip install 'playwright==1.58.0'
          python -m playwright install --with-deps chromium
      - name: Bind nonpublishing preview to the already-measured exact runtime
        run: |
          set -euo pipefail
          # The failed official Stage31 result is retained, never reclassified.
          echo '48508e7cbf43ad5985092a8fb62840fe9a9dabc7d5c7ac9ff49cf161809ee41a  HONRO.html' | sha256sum -c -
          echo "692b37fce10dcc2158aee23fb9df5db9cd306ebbdbdcb2634a20e558d8f3d721  $OUT/preview-active-files.json" | sha256sum -c -
          node --input-type=module -e 'import fs from "node:fs";import assert from "node:assert/strict";import {runtimeDigest} from "./tools/stage31/probes.mjs";const digest=await runtimeDigest();assert.equal(digest,"71ca9ae69206e43d8d0081d594c77d230970876f3bc80fb1d4c698e6eddd3219");fs.writeFileSync(process.env.OUT+"/preview-scope.json",JSON.stringify({source:process.env.GITHUB_SHA,productSource:"9e4ecc00a28c882ae4a928bac58c47d086ea4264",sameHtml:true,sameActiveFiles:true,runtimeSha256:digest,officialStage31Run:41746180178,officialStage31Passed:false,publishing:false},null,2));'
      - name: Independent Stage6 input checks on the identical nonpublishing runtime
        run: |
          set -euo pipefail
          mkdir -p _local/reports/stage6-art-preview
          sha256sum HONRO.html web/manifest.json shared/runtime/profile-store.js > _local/reports/stage6-art-preview/served-sha256.txt
          git rev-parse HEAD HEAD^{tree} > _local/reports/stage6-art-preview/source.txt
          python -m http.server 8870 --bind 127.0.0.1 > "$OUT/stage6-server.log" 2>&1 &
          server=$!; trap 'kill "$server" 2>/dev/null || true' EXIT
          sleep 2
          status=0
          for script in integrated-browser-play capture-preview integrated-save-boundary integrated-checkpoint-review; do
            python "tools/stage6-prototype/$script.py" > "_local/reports/stage6-art-preview/$script.log" 2>&1 || status=1
          done
          STAGE6_PURSUIT_SAVE="$OUT/input/r7-pursuit.json.gz" python tools/stage6-prototype/pursuit-save-continue.py > "$OUT/pursuit-continue.log" 2>&1 || status=1
          python - <<'PY'
          import json
          r=json.load(open('_local/reports/stage6-art-preview/integrated-play/result.json'))
          assert r['status']=='terminal-won' and r['pursuitVerified'] and not r['errors'], 'Stage6 actual route did not complete with observed pursuit'
          PY
          exit "$status"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: stage6-master-preview-${{ github.sha }}
          path: |
            _local/reports/stage6-master-preview/
            _local/reports/stage6-art-preview/
            _local/reports/stage6-pursuit-continue/
          retention-days: 30
