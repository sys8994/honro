name: Stage17 repaired gate on exact gated candidate
on:
  workflow_dispatch:
    inputs:
      generated_ref:
        description: 'Exact40-character generated commit from a successful allowed integration run; not a source commit or branch'
        required: true
        type: string
      source_ref:
        description: 'Exact source parent of generated candidate; omit only for original c5'
        type: string
      prerequisite_run:
        description: 'Successful allowed integration run for that exact source; paired with source_ref'
        type: string
      public:
        description: 'Only after confirmed Pages deployment: verify the actual public site instead of localhost'
        required: false
        type: boolean
        default: false
  push:
    branches: ['work/stage17-gate-browser/**']
    paths: ['.github/qa/stage17-gate-request.json']
permissions:
  contents: read
  actions: read
jobs:
  repaired-gate:
    if: github.repository == 'sys8994/honro'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          path: qa
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Resolve immutable candidate request
        id: request
        env:
          GENERATED_REF: ${{ inputs.generated_ref }}
          PUBLIC: ${{ inputs.public }}
          SOURCE_REF: ${{ inputs.source_ref }}
          PREREQUISITE_RUN: ${{ inputs.prerequisite_run }}
        run: |
          mkdir -p evidence
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          ref=os.environ.get('GENERATED_REF');public=os.environ.get('PUBLIC')=='true'
          source=os.environ.get('SOURCE_REF');run=os.environ.get('PREREQUISITE_RUN')
          if not ref:
              request=json.loads(Path('qa/.github/qa/stage17-gate-request.json').read_text())
              assert 'generatedRef' in request and set(request)<={'generatedRef','public','sourceRef','prerequisiteRun'},'Request accepts only generatedRef, public, sourceRef and prerequisiteRun'
              assert isinstance(request.get('public',False),bool),'public must be a boolean'
              public=request.get('public',False)
              source=request.get('sourceRef');run=request.get('prerequisiteRun')
              ref=request['generatedRef']
          assert bool(source)==bool(run),'sourceRef and prerequisiteRun must be paired'
          source=source or 'c5f9765e369cd6a69d4e7440a65756d8519e4923';run=run or 41543828006
          assert re.fullmatch('[0-9a-f]{40}',source) and re.fullmatch('[1-9][0-9]*',str(run)),'Invalid immutable source/run'
          assert re.fullmatch('[0-9a-f]{40}',ref),'Supply the exact generated SHA after the prerequisite succeeds'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('ref='+ref+'\npublic='+str(public).lower()+'\nsource='+source+'\nrun='+str(run)+'\n')
          Path('evidence/request.json').write_text(json.dumps({'generatedRef':ref,'public':public,'sourceRef':source,'prerequisiteRun':int(run),'harnessSource':os.environ['GITHUB_SHA']},indent=2)+'\n')
          PY
      - name: Require completed allowed normal production build and preservation
        id: prerequisite
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ steps.request.outputs.ref }}
        run: |
          python qa/tools/act2-qa/verify-stage17-generated.py prerequisite --ref "$CANDIDATE" --source "${{ steps.request.outputs.source }}" --run "${{ steps.request.outputs.run }}" --receipt evidence/prerequisite.json
          python -c 'import json,os; d=json.load(open("evidence/prerequisite.json")); open(os.environ["GITHUB_OUTPUT"],"a").write("artifact="+d["artifact"]+"\n")'
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          ref: ${{ steps.request.outputs.ref }}
          path: candidate
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ steps.prerequisite.outputs.artifact }}
          run-id: ${{ steps.request.outputs.run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: prerequisite
      - name: Match exact generated game, runtime source and genuine fixture
        env:
          CANDIDATE: ${{ steps.request.outputs.ref }}
        run: python qa/tools/act2-qa/verify-stage17-generated.py package --ref "$CANDIDATE" --source "${{ steps.request.outputs.source }}" --run "${{ steps.request.outputs.run }}" --candidate candidate --artifact prerequisite --receipt evidence/package-before.json
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Revalidate saved production evidence without rebuilding or replaying combat
        working-directory: candidate
        run: |
          set -euo pipefail
          set -euo pipefail
          npm ci
          npm ci --prefix game
          node tools/stage31/check-release.mjs | tee ../evidence/normal-release-gate.log
      - name: Check harness and unchanged served bytes after release gate
        env:
          CANDIDATE: ${{ steps.request.outputs.ref }}
        run: |
          python qa/tests/stage17-gate-browser.py --self-test
          python qa/tests/verify-stage17-generated-test.py
          python -m py_compile qa/tests/stage17-gate-browser.py qa/tools/act2-qa/verify-stage17-generated.py
          python qa/tools/act2-qa/verify-stage17-generated.py package --ref "$CANDIDATE" --source "${{ steps.request.outputs.source }}" --run "${{ steps.request.outputs.run }}" --candidate candidate --artifact prerequisite --receipt evidence/package-after.json
          cp qa/tests/stage17-gate-browser.py candidate/tests/stage17-gate-browser.py
          sha256sum qa/tests/stage17-gate-browser.py > evidence/harness-sha256.txt
          python -m pip install 'playwright==1.58.0'
          python -m playwright install --with-deps chromium
      - name: Actual Continue, repaired passage crossing, autosave and reload only
        working-directory: candidate
        env:
          CANDIDATE: ${{ steps.request.outputs.ref }}
          PUBLIC: ${{ steps.request.outputs.public }}
        run: |
          set -euo pipefail
          mkdir -p _local/reports/stage17-gate-browser
          URL=http://127.0.0.1:8870/HONRO.html
          if [ "$PUBLIC" = true ]; then
            URL=https://sys8994.github.io/honro/HONRO.html
          else
            python -m http.server 8870 --bind 127.0.0.1 > ../evidence/server.log 2>&1 &
            trap 'kill $! 2>/dev/null || true' EXIT
            sleep 2
          fi
          GITHUB_SHA="$CANDIDATE" python tests/stage17-gate-browser.py --url "$URL" --out _local/reports/stage17-gate-browser > ../evidence/browser.log 2>&1
          python -c 'import json; d=json.load(open("_local/reports/stage17-gate-browser/result.json")); assert d.get("passed") is True and not d.get("errors") and not d.get("exception")'
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: stage17-repaired-gate-${{ steps.request.outputs.ref }}-public-${{ steps.request.outputs.public }}
          path: |
            evidence/
            candidate/_local/reports/stage17-gate-browser/
          retention-days: 7
