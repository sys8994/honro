name: Stage38 scoped compact pose native browser diagnostic
on:
  push:
    branches: [qa/stage38-compact-native-2939958-20261121]
permissions:
  contents: read
jobs:
  diagnose:
    if: github.repository == 'sys8994/honro' && github.event_name == 'push' && github.ref == 'refs/heads/qa/stage38-compact-native-2939958-20261121'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Pin Stage38 current source closure and validate reversible one-owner change
        shell: bash
        run: |
          set -euo pipefail
          Q=tools/stage38-compact-native
          W="$(mktemp -d "$RUNNER_TEMP/stage38-compact-native.XXXXXX")"
          mkdir "$W/evidence"
          export STAGE38_PUBLIC="$W/evidence"
          echo "STAGE38_PUBLIC=$STAGE38_PUBLIC" >> "$GITHUB_ENV"
          python3 "$Q/source.py"
          cp "$STAGE38_PUBLIC/stage38-candidate.js" "$W/candidate.mjs"
          node --check "$W/candidate.mjs"
      - name: Render control and single-owner compact pose from current public Stage38
        shell: bash
        run: |
          set -euo pipefail
          Q=tools/stage38-compact-native
          W="$STAGE38_PUBLIC/.."
          python3 -m venv "$W/venv"
          V="$W/venv/bin/python"
          "$V" -m pip --disable-pip-version-check install playwright==1.62.0 Pillow==13.0.0
          "$V" -m playwright install --with-deps chromium
          STAGE38_ARM=A "$V" "$Q/capture.py"
          STAGE38_ARM=B "$V" "$Q/capture.py"
          "$V" "$Q/compare.py"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: stage38-static-compact-native-not-production
          path: |
            ${{ env.STAGE38_PUBLIC }}/**/*.png
            ${{ env.STAGE38_PUBLIC }}/**/*.json
          if-no-files-found: warn
          retention-days: 7
