name: Act4 recovery actual browser play
on:
  push:
    branches: ['work/act4-recovery-play/**']
permissions:
  contents: read
jobs:
  stage31:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HONRO_ACT4_RELEASE: '1'
      HONRO_QA_ORIGIN: http://127.0.0.1:8870
      HONRO_RUN_DIR: _local/reports/recovery-browser31/stage31
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Prepare exact source and isolated unapproved preview
        run: |
          set -euo pipefail
          mkdir -p _local/reports/recovery-browser31
          npm ci --no-audit --no-fund
          npm ci --prefix game --no-audit --no-fund
          python -m pip install 'playwright==1.58.0'
          python -m playwright install --with-deps chromium
          sha256sum HONRO.html web/manifest.json > /tmp/public-before.txt
          node workshop/build.mjs --preview recovery-browser31
          sha256sum -c /tmp/public-before.txt
          node tools/act4-ci/refresh-stage31-probes.mjs prepare _local/reports/recovery-browser31
          cp candidate31.json _local/previews/recovery-browser31/candidate31.json
          { git rev-parse HEAD; sha256sum tools/act4-ci/stage31-fullplay.py tests/fixtures/act4-rc/support-entry-fixture.json candidate31.json _local/previews/recovery-browser31/HONRO.html; } > _local/reports/recovery-browser31/source.txt
      - name: Actual normal-input browser combat and boarding
        run: |
          set -euo pipefail
          python -m http.server 8870 --bind 127.0.0.1 --directory _local/previews/recovery-browser31 > _local/reports/recovery-browser31/server.log 2>&1 &
          server=$!; trap 'kill "$server" 2>/dev/null || true' EXIT
          sleep 2
          python tools/act4-ci/stage31-fullplay.py > _local/reports/recovery-browser31/play.log 2>&1
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ['HONRO_RUN_DIR'])/'result.json').read_text())
          assert r['passed'] and r['complete'] and not r['errors'], r
          assert r['releaseApproved'] is False, 'Functional UI check must not declare quantitative release approval'
          PY
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: recovery-browser31-${{ github.sha }}
          path: _local/reports/recovery-browser31/
          retention-days: 7
