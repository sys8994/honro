name: HONRO Stage32 and Stage42 exact sealed release-candidate assembly
on:
  push:
    branches: [qa/stage32-42-exact-retained-writer-72dd-r1]
    paths: [".github/workflows/stage32-42-writer.yml", "tools/stage32-42-writer/**"]
permissions:
  contents: write
  actions: read
jobs:
  fixed-stage32-42-release-checkpoint:
    if: github.repository == 'sys8994/honro' && github.event_name == 'push' && github.ref == 'refs/heads/qa/stage32-42-exact-retained-writer-72dd-r1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
      - name: Authenticate exact scoped normal archives and baseline Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/stage32-42-writer/assemble.py acquire "$RUNNER_TEMP/stage32-42-qualified-checkpoint"
      - name: Assemble then fast-forward the one isolated candidate ref only
        run: bash tools/stage32-42-writer/safe-push.sh "$RUNNER_TEMP/stage32-42-qualified-checkpoint"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: honro-stage32-42-qualified-release-receipt-no-deploy
          path: |
            ${{ runner.temp }}/stage32-42-qualified-checkpoint/ASSEMBLY.json
            ${{ runner.temp }}/stage32-42-qualified-checkpoint/candidate.sha
            ${{ runner.temp }}/stage32-42-qualified-checkpoint/candidate.tree
            ${{ runner.temp }}/stage32-42-qualified-checkpoint/hook
          if-no-files-found: warn
          retention-days: 7
