name: HONRO Stage21 west bedrock retained normal-output assembly (QA only)
on:
  push:
    branches: [qa/stage21-west-bedrock-retention-9ac]
    paths:
      - .github/workflows/stage21-west-bedrock-retention.yml
      - tools/stage21-west-bedrock-retention/**
permissions:
  contents: read
  actions: read
jobs:
  seal:
    if: github.repository == 'sys8994/honro' && github.event_name == 'push' && github.ref == 'refs/heads/qa/stage21-west-bedrock-retention-9ac'
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify completed exact normal-build and browser artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/stage21-west-bedrock-retention"
          mkdir "$WORK" "$WORK/delivery"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          python tools/stage21-west-bedrock-retention/retain.py authority "$WORK"
      - name: Assemble and verify exact retained web delta only
        shell: bash
        run: |
          set -euo pipefail
          test -z "${GH_TOKEN:-}${GITHUB_TOKEN:-}"
          python tools/stage21-west-bedrock-retention/retain.py seal "$WORK"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: honro-stage21-west-bedrock-retained-source-and-generated-no-deploy
          path: ${{ runner.temp }}/stage21-west-bedrock-retention/delivery/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
