name: Stage42 isolated stock Scene optimizer proof
on:
  push:
    branches: ['audit/stage42-stock-scene-20261120']
permissions:
  contents: read
jobs:
  stage42:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 0
      - name: Verify diagnostic-only diff from pinned source
        shell: bash
        run: |
          test "$(git rev-parse 1e043b09d4ce107e1d2dcf70fe2274dff7098476^{tree})" = 749dc3403620e8291acf582302761bf6a0e4e89a
          git diff --name-only 1e043b09d4ce107e1d2dcf70fe2274dff7098476 HEAD > "$RUNNER_TEMP/scope.txt"
          python -c "from pathlib import Path; p=Path('$RUNNER_TEMP/scope.txt').read_text().splitlines(); assert p and all(x.startswith('tools/testing/stage42-stock-scene/') or x=='.github/workflows/stage42-stock-scene.yml' for x in p),p"
          git diff --exit-code 1e043b09d4ce107e1d2dcf70fe2274dff7098476 HEAD -- shared game tools/terrain-node-optimizer web HONRO.html
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci && npm ci --prefix game
      - run: npm install --prefix "$RUNNER_TEMP/browser-deps" --ignore-scripts playwright-core@1.56.1
      - name: Stock Python optimizer dependencies and native Inkscape
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y inkscape
          python -m venv "$RUNNER_TEMP/optimizer-venv"
          "$RUNNER_TEMP/optimizer-venv/bin/pip" install -r tools/terrain-node-optimizer/requirements.txt
          inkscape --version
      - name: Extract pinned active assets and generate candidates in temporary output only
        shell: bash
        run: |
          P="$RUNNER_TEMP/optimizer-venv/bin/python"
          O="$RUNNER_TEMP/stage42-packages"
          "$P" tools/testing/stage42-stock-scene/prepare.py "$GITHUB_WORKSPACE" "$O"
          "$P" tools/terrain-node-optimizer/optimize_package.py "$O/baseline-package.json" "$O/candidate-e18.json" --asset-id 'act5:stage42:' --epsilon 18 --widths 1280,2560 > "$O/e18.log"
          "$P" tools/terrain-node-optimizer/optimize_package.py "$O/baseline-package.json" "$O/candidate-e12.json" --asset-id 'act5:stage42:' --epsilon 12 --widths 1280,2560 > "$O/e12.log"
          "$P" tools/testing/stage42-stock-scene/prepare.py "$GITHUB_WORKSPACE" "$O" hybrid
      - name: Generate isolated baseline and hybrid stock Scenes
        run: node tools/testing/stage42-stock-scene/fixture.mjs "$GITHUB_WORKSPACE" "$RUNNER_TEMP/stage42-fixtures" "$RUNNER_TEMP/stage42-packages/baseline-package.json" "$RUNNER_TEMP/stage42-packages/hybrid-18-12.json" hybrid-18-12
      - name: Capture identical cameras and unchanged world in actual CI Chrome
        run: bash tools/testing/stage42-stock-scene/run-ci.sh "$RUNNER_TEMP/stage42-fixtures" "$RUNNER_TEMP/stage42-evidence" hybrid-18-12
      - name: Verify no production file modifications
        if: always()
        run: git diff --exit-code -- shared game tools/terrain-node-optimizer web HONRO.html
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: stage42-stock-scene-proof
          path: |
            ${{ runner.temp }}/stage42-packages
            ${{ runner.temp }}/stage42-evidence
            !${{ runner.temp }}/stage42-evidence/*.dom.html
            ${{ runner.temp }}/stage42-fixtures/manifest.json
            ${{ runner.temp }}/scope.txt
          if-no-files-found: error
