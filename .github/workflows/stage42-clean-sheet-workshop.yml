name: Stage42 clean-sheet Workshop blockout QA
on:
  push:
    branches: ['qa/stage42-clean-sheet-workshop']
    paths: ['.github/workflows/stage42-clean-sheet-workshop.yml', 'tests/stage42-clean-sheet-workshop/**']
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HONRO_ACT4_RELEASE: '1'
      HONRO_ACT5_RELEASE: '1'
      HONRO_BLANK_WORKSHOP_LOCAL: '1'
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Build and verify disposable stock runtime, add only UI host
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/qa/stage42-clean-sheet-workshop
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^^)" = 1e043b09d4ce107e1d2dcf70fe2274dff7098476
          test "$GITHUB_SHA" != "ab2c77eb1a165b7c5639d34b027b7f5820f9b1e5"
          test "$(git rev-parse HEAD^)" = ab2c77eb1a165b7c5639d34b027b7f5820f9b1e5
          printf '%s\n' .github/workflows/stage42-clean-sheet-workshop.yml tests/stage42-clean-sheet-workshop/browser-proof.py tests/stage42-clean-sheet-workshop/game-snapshot.js tests/stage42-clean-sheet-workshop/host.js tests/stage42-clean-sheet-workshop/prepare.mjs > "$RUNNER_TEMP/blank-allowed.txt"
          git diff --name-only HEAD^ HEAD | diff -u "$RUNNER_TEMP/blank-allowed.txt" -
          echo '757e3c63da7abc7969714dc5e3d159370eecf9862c261586675bdf5d279e1716  tests/stage42-clean-sheet-workshop/b01-pointer-plan.json' | sha256sum -c -
          node tests/stage42-clean-sheet-workshop/unit.mjs
          npm ci
          npm ci --prefix game
          npm run build
          B="$RUNNER_TEMP/stage42-clean-sheet-workshop-build"; E="$RUNNER_TEMP/stage42-clean-sheet-workshop-evidence"
          mkdir -p "$B" "$E"
          cp -a web HONRO_WORKSHOP.html HONRO.html "$B/"
          node tests/stage42-clean-sheet-workshop/prepare.mjs "$B"
          node --check "$B/web/runtime/workshop-app.489f733634454986.js"
      - name: Real pointer full-width blockout and fresh manual draft roundtrip
        run: |
          set -euo pipefail
          python -m pip install 'playwright==1.58.0' 'Pillow==12.0.0'
          export HONRO_BLANK_WORKSHOP_URL=http://127.0.0.1:8870/HONRO_WORKSHOP.html
          export HONRO_CHROME="$(command -v google-chrome || command -v chromium)"
          test -x "$HONRO_CHROME"
          "$HONRO_CHROME" --version
          python -m http.server 8870 --bind 127.0.0.1 --directory "$RUNNER_TEMP/stage42-clean-sheet-workshop-build" &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for ((i=0;i<20;i++)); do
            if curl -fsS -o /dev/null http://127.0.0.1:8870/HONRO_WORKSHOP.html; then break; fi
            sleep 1
          done
          timeout 1000s python tests/stage42-clean-sheet-workshop/browser-proof.py "$RUNNER_TEMP/stage42-clean-sheet-workshop-evidence"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: stage42-clean-sheet-workshop-browser-evidence
          path: |
            ${{ runner.temp }}/stage42-clean-sheet-workshop-evidence/*.png
            ${{ runner.temp }}/stage42-clean-sheet-workshop-evidence/result.json
          if-no-files-found: warn
          retention-days: 7
