name: Verify self-contained Act1 save dedup and runtime gate
on:
  push:
    branches: ['work/act1-save-dedup/*']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HONRO_ACT1_STAGE2_CANDIDATE: '1'
      HONRO_ACT4_RELEASE: '1'
      HONRO_QA_LOCAL_ART_SAVE: '1'
      OUT: _local/reports/act1-save-dedup-review
      HONRO_QA_URL: http://127.0.0.1:8870/HONRO.html
      HONRO_QA_ORIGIN: http://127.0.0.1:8870
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Install tools and check unchanged geometry and scoped rendering
        run: |
          set -euo pipefail
          npm ci
          npm ci --prefix game
          node tests/act1-local-art-save.mjs
          node tests/act4-story-compact-save.mjs
          node tests/stage3-body-candidate.mjs
          node tests/stage4-body-candidate.mjs
          node tests/stage5-body-candidate.mjs
          node tests/stage6-body-candidate.mjs
          node tests/act1-body-candidate.mjs
          node tests/stage2-continuous-art-rim.mjs
          node tests/stage2-continuous-candidate.mjs
          node tests/stage2-art-entry-fixture.mjs
          python -m pip install 'playwright==1.58.0'
          python -m playwright install --with-deps chromium
      - name: Preserve published assets and prepare unpublished evidence preview
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          mapfile -t refs < <(node --input-type=module -e 'import fs from "node:fs";import {selectPublishedGenerations} from "./shared/web-retention.mjs";for(const g of selectPublishedGenerations(JSON.parse(fs.readFileSync("web/manifest.json")).publishedGenerations,{now:Date.now()})){if(!/^[a-f0-9]{40}$/.test(g.sourceSha))throw Error("Invalid ref");console.log(g.sourceSha)}')
          git fetch --no-tags --depth=1 origin ffced0412eda38ad581111bf5f2c2cf7b4abb96c "${refs[@]}"
          node tools/release/retain-published-web.mjs ffced0412eda38ad581111bf5f2c2cf7b4abb96c --published-at 2026-11-02T11:02:29Z --evidence https://github.com/sys8994/honro/actions/runs/41433208199
          node tools/act4-ci/refresh-stage31-probes.mjs prepare "$OUT"
          # Established evidence-only bootstrap. This preview is NOT publishable.
          # The unchanged production gate is enforced after fresh normal UI evidence.
          node workshop/build.mjs | tee "$OUT/preview-build.log"
          sha256sum HONRO.html web/manifest.json > "$OUT/preview-served-sha256.txt"
      - name: Actual Stage2 UI and fresh Stage31 normal-input objective evidence
        run: |
          set -euo pipefail
          python -m http.server 8870 --bind 127.0.0.1 > "$OUT/server.log" 2>&1 &
          server=$!; trap 'kill "$server" 2>/dev/null || true' EXIT
          sleep 2
          HONRO_RUN_DIR="$OUT/stage31" python tools/act4-ci/stage31-fullplay.py > "$OUT/stage31.log" 2>&1 &
          stage31=$!
          HONRO_QA_OUT="$OUT/stage2" python tools/act1-vector-production/browser-stage2.py > "$OUT/stage2.log" 2>&1 &
          stage2=$!
          set +e
          wait "$stage31"; status31=$?
          wait "$stage2"; status2=$?
          set -e
          echo "STAGE2_STATUS=$status2" >> "$GITHUB_ENV"
          test "$status31" = 0
      - name: Bind measured evidence then enforce the production gate
        run: |
          set -euo pipefail
          node tools/act4-ci/refresh-stage31-probes.mjs attach "$OUT"
          cp tools/stage31/production-package.json "$OUT/stage31-production-package.json"
          npm run build | tee "$OUT/gated-build.log"
          sha256sum HONRO.html web/manifest.json > "$OUT/final-served-sha256.txt"
      - name: Preserve checked candidate without master publication
        run: |
          set -euo pipefail
          test "$STAGE2_STATUS" = 0
          git add web HONRO.html HONRO_WORKSHOP.html index.html tools/stage31/production-package.json
          git -c user.name='honro release automation' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Build checked Act1 save dedup candidate from $GITHUB_SHA"
          git push origin "HEAD:refs/heads/work/act1-save-dedup-generated/$GITHUB_SHA"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: act1-save-dedup-review-${{ github.sha }}
          path: _local/reports/act1-save-dedup-review/
          retention-days: 7
