name: Verify published Act 6 epilogue including both new cuts
on:
  push:
    branches: ['qa/act6-ending-final-b-20261125']
    paths: ['.github/workflows/act6-ending-final-b-live.yml']
permissions:
  contents: read
jobs:
  published:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          ref: 4c27cd701fddb3cc3c0de3cd3a1f48f26e625e29
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Wait for exact Pages bytes, then exercise live UI
        shell: bash
        run: |
          set -euo pipefail
          O="$RUNNER_TEMP/honro-live"
          mkdir -p "$O"
          python -m pip install 'playwright==1.58.0'
          python -m playwright install --with-deps chromium
          for n in $(seq 1 60); do
            curl -fsS "https://sys8994.github.io/honro/web/manifest.json?check=$GITHUB_RUN_ID-$n" -o "$O/live-manifest.json" && cmp -s web/manifest.json "$O/live-manifest.json" &&
            curl -fsS "https://sys8994.github.io/honro/?check=$GITHUB_RUN_ID-$n" -o "$O/live-index.html" && cmp -s index.html "$O/live-index.html" && break
            sleep 5
          done
          cmp web/manifest.json "$O/live-manifest.json"
          cmp index.html "$O/live-index.html"
          python - <<'PY'
          import json,hashlib,urllib.request
          ds={'still_08_land':'c2ac467bab868c2636ed3f8f42c3496ffe6a845720ebdc25da78041bdea273bb','still_08_port':'75dea3195263f05be26a7fc7715e856299be81bd690bab423815a4f1f7046c8a','final_land':'b95e2b4d546693f52420fc519d57a8dc446c96a948247cb9545ee94d2a8168c3','final_port':'032ee3cceed14c0caa186a22fed7aec693fba688032ccba3ddfdb1e615eba0ef'}
          fs=json.load(open('web/manifest.json'))['files']
          for name,h in ds.items():
              x=next(x for x in fs if 'act6-ending_'+name+'.' in x['path'] and x['sha256']==h)
              with urllib.request.urlopen('https://sys8994.github.io/honro/'+x['path'],timeout=20) as f:
                  assert hashlib.sha256(f.read()).hexdigest()==h,name
              print('EXACT_LIVE_IMAGE',name,h)
          PY
          CHROME="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python tools/act6-ending-v2/preview.py --live --chromium "$CHROME" --out "$O/screens" | tee "$O/preview.log"
          python tools/act6-ending-v2/normal.py --live --chromium "$CHROME" | tee "$O/normal.log"
          cp -v _local/reports/ending-v2/*.png "$O/screens/"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: honro-ending-pages-screens
          path: ${{ runner.temp }}/honro-live/
          retention-days: 7
