name: Stage35 integrated placement QA
on:
  push:
    branches: ['qa/stage35-placement-integration-20261120']
permissions:
  contents: read
jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      HONRO_ACT4_RELEASE: '1'
      HONRO_ACT5_RELEASE: '1'
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci && npm ci --prefix game
      - run: node tools/act4-source/world-source.mjs materialize && node tests/stage35-placement-contract.mjs
      - run: node tests/stage35-encounter-paired-fixture.mjs "$RUNNER_TEMP/fixtures"
      - name: Render exact same initial state and cameras
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          browser=$(command -v google-chrome || command -v chromium)
          for variant in integrated; do
            for view in whole middle upper; do
              name="stage35-$variant-$view"
              timeout 300s "$browser" --headless --no-first-run --no-default-browser-check --force-device-scale-factor=1 --virtual-time-budget=60000 --user-data-dir="$RUNNER_TEMP/profile-$name" --dump-dom "file://$RUNNER_TEMP/fixtures/$name.html" > "$RUNNER_TEMP/$name.html"
              node tests/stage35-encounter-paired-extract.mjs "$RUNNER_TEMP/$name.html" "$RUNNER_TEMP/evidence" "$name"
            done
          done
      - name: Build with placement in production author pipeline
        run: npm run build
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: stage35-placement-integrated
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
