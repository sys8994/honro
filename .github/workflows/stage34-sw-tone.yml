name: HONRO Stage34 single southwest face exact normal QA
on:
  push:
    branches: [qa/stage34-sw-tone-4fdb]
    paths: [".github/workflows/stage34-sw-tone.yml", "tools/stage34-sw-tone/**"]
permissions:
  contents: read
jobs:
  stage34-paired:
    if: github.repository == 'sys8994/honro' && github.event_name == 'push' && github.ref == 'refs/heads/qa/stage34-sw-tone-4fdb'
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
      - name: Exact released A and one normal B build
        run: |
          set -euo pipefail
          test -z "${GH_TOKEN:-}${GITHUB_TOKEN:-}"
          W=$(mktemp -d "$RUNNER_TEMP/stage34-sw-tone.XXXXXX"); echo "W=$W" >> "$GITHUB_ENV"
          T="$GITHUB_WORKSPACE/tools/stage34-sw-tone"
          mkdir "$W/out"
          python "$T/guard.py" pre "$W"
          node "$T/author.mjs" source "$W" > "$W/out/author.log" 2>&1
          cd "$W/B"
          npm ci > "$W/out/npm-root.log" 2>&1
          npm ci --prefix game > "$W/out/npm-game.log" 2>&1
          npm run build > "$W/out/build.log" 2>&1
          npm run test:production-contract > "$W/out/contract.log" 2>&1
          python "$T/guard.py" built "$W"
      - name: Real PC and mobile SW matching normal browser images plus East controls
        run: |
          set -euo pipefail
          T="$GITHUB_WORKSPACE/tools/stage34-sw-tone"
          python -m venv "$W/venv"; V="$W/venv/bin/python"
          "$V" -m pip --disable-pip-version-check install playwright==1.62.0 Pillow==13.0.0
          "$V" -m playwright install --with-deps chromium
          python -m http.server 18961 --bind 127.0.0.1 --directory "$W/A" > "$W/out/http-A.log" 2>&1 & a=$!
          python -m http.server 18962 --bind 127.0.0.1 --directory "$W/B" > "$W/out/http-B.log" 2>&1 & b=$!
          trap 'kill "$a" "$b" 2>/dev/null || true' EXIT
          for p in 18961 18962; do curl -fsS --retry 8 --retry-connrefused "http://127.0.0.1:$p/HONRO.html" -o /dev/null; done
          "$V" "$T/capture.py" "$W"
      - if: always() && env.W != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: honro-stage34-sw-tone-4fdb-normal-qa-only
          path: ${{ env.W }}/out/
          retention-days: 7
          if-no-files-found: error
