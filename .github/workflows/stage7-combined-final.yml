name: Stage7 composed final internal faces actual Scene
on:
  workflow_dispatch:
  push:
    branches: [inspect/stage32-scanline-20261118]
    paths: ['tools/testing/stage7-combined-final/**', '.github/workflows/stage7-combined-final.yml']
permissions: {contents: read}
jobs:
  study:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env: {HONRO_ACT4_RELEASE: '1', HONRO_ACT5_RELEASE: '1'}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with: {path: study}
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with: {path: product, ref: de8234e486633152fa376aa37633629dfecc83ee, fetch-depth: 5}
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with: {path: baseline, ref: d578dbdeac40fbf2c311a268a15b0d5d705962da}
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with: {node-version: '22', package-manager-cache: false}
      - run: npm ci && npm ci --prefix game
        working-directory: product
      - run: npm ci && npm ci --prefix game
        working-directory: baseline
      - run: python -m pip install pillow numpy
      - run: node study/tools/testing/stage7-combined-final/source-contract.mjs product
      - name: Own official builds
        run: |
          (cd product && node workshop/build.mjs && node game/build.mjs)
          (cd baseline && node workshop/build.mjs && node game/build.mjs)
          mkdir -p artifacts/evidence
      - name: Twelve normal Scenes and explicit diagnostic masks
        run: |
          node study/tools/testing/stage7-combined-final/fixture.mjs baseline "$RUNNER_TEMP/edge-before" baseline
          node study/tools/testing/stage32-live-ss/actual/run.mjs "$RUNNER_TEMP/edge-before" artifacts/evidence
          node study/tools/testing/stage7-combined-final/fixture.mjs product "$RUNNER_TEMP/edge-after" candidate
          node study/tools/testing/stage32-live-ss/actual/run.mjs "$RUNNER_TEMP/edge-after" artifacts/evidence
          python study/tools/testing/stage7-combined-final/check.py artifacts/evidence
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with: {name: stage7-combined-final, path: artifacts, if-no-files-found: error}
