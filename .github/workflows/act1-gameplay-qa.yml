name: Act1 normal UI gameplay observation
on:
  push:
    branches: ['work/act1-current-app-qa/**']
    paths:
      - '.github/workflows/act1-gameplay-qa.yml'
      - 'tools/act1-qa/browser-ui.py'
      - 'tools/act1-qa/browser_progression.py'
      - 'tools/act1-qa/browser-reactive-plan.js'
      - 'tools/act1-qa/browser-reactive-registration.json'
      - 'tools/act1-qa/*ui-commands.json'
      - 'tools/act1-qa/fixtures/**'
      - 'tools/act4-ci/precise_aim.py'
      - 'tools/act4-ci/normal-shot-plan.js'
      - 'game/docs/stage-review/stage08-bier/evidence/normal-victory-profile.json'
      - 'HONRO.html'
      - 'web/**'
permissions:
  contents: read
jobs:
  representative-ui:
    strategy:
      fail-fast: false
      matrix:
        include:
          - stage: 1
            entry: ''
          - stage: 5
            entry: tools/act1-qa/fixtures/stage5-entry.json
          - stage: 10
            entry: tools/act1-qa/fixtures/stage10-entry.json
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HONRO_QA_URL: http://127.0.0.1:8870/HONRO.html
      HONRO_QA_OUT: _local/reports/act1-gameplay-ui
      HONRO_REACTIVE_POLICY: '1'
      HONRO_STAGE: ${{ matrix.stage }}
      HONRO_ENTRY_PROFILE: ${{ matrix.entry }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - run: |
          python -m pip install 'playwright==1.58.0'
          python -m playwright install --with-deps chromium
      - name: Check pure browser driver contracts
        run: |
          python tools/act1-qa/test-browser-ui-driver.py
          python tools/act1-qa/test-browser-progression.py
      - name: Observe committed production bundle with real UI inputs
        run: |
          mkdir -p "$HONRO_QA_OUT"
          git rev-parse HEAD > "$HONRO_QA_OUT/source.txt"
          sha256sum HONRO.html web/manifest.json > "$HONRO_QA_OUT/served-sha256.txt"
          python -m http.server 8870 --bind 127.0.0.1 > "$HONRO_QA_OUT/server.log" 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          sleep 2
          python tools/act1-qa/browser-ui.py > "$HONRO_QA_OUT/browser.log" 2>&1
      - name: Require explicit successful UI receipt
        run: |
          python -c 'import json,os; from pathlib import Path; d=json.loads((Path(os.environ["HONRO_QA_OUT"])/"result.json").read_text()); assert d.get("passed") is True and d.get("progression",{}).get("passed") is True and not d.get("exception") and not d.get("errors") and d.get("final",{}).get("phase")=="won"'
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: act1-gameplay-ui-stage${{ matrix.stage }}-${{ github.sha }}
          path: _local/reports/act1-gameplay-ui/
          retention-days: 7
