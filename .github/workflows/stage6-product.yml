name: Stage6 product-source independent review
on:
  push:
    branches: ['work/stage6-product-integration-20261103']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      HONRO_ACT4_RELEASE: '1'
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Focused source contracts and one unpublished candidate build
        run: |
          set -euo pipefail
          npm ci
          npm ci --prefix game
          node tests/stage6-art-preview.mjs
          node tests/stage6-integrated-preview.mjs
          node tests/stage6-render-coverage-preview.mjs
          node tests/stage6-descent-view-preview.mjs
          node tests/stage6-reviewed-pursuit.mjs
          node tests/stage6-pursuit-response.mjs
          node tests/stage6-integrated-entry.mjs
          # Review only. The unchanged production Stage31 gate is not waived.
          node workshop/build.mjs
          python -m pip install 'playwright==1.58.0'
          python -m playwright install --with-deps chromium
      - name: Same-runtime full input route, save and mobile descent
        run: |
          set -euo pipefail
          mkdir -p _local/reports/stage6-art-preview
          sha256sum HONRO.html web/manifest.json shared/runtime/profile-store.js > _local/reports/stage6-art-preview/served-sha256.txt
          git rev-parse HEAD HEAD^{tree} > _local/reports/stage6-art-preview/source.txt
          python -m http.server 8870 --bind 127.0.0.1 > _local/reports/stage6-art-preview/server.log 2>&1 &
          server=$!; trap 'kill "$server" 2>/dev/null || true' EXIT
          sleep 2
          status=0
          # Preserve independent results even after an earlier failure.
          for script in integrated-browser-play capture-preview integrated-save-boundary integrated-checkpoint-review; do
            python "tools/stage6-prototype/$script.py" > "_local/reports/stage6-art-preview/$script.log" 2>&1 || status=1
          done
          exit "$status"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: stage6-product-review-${{ github.sha }}
          path: _local/reports/stage6-art-preview/
          retention-days: 7
