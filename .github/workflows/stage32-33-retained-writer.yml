name: HONRO exact Stage32 and Stage33 retained writer (isolated)
on:
  push:
    branches: [qa/stage32-33-retained-writer-e702]
    paths: [".github/workflows/stage32-33-retained-writer.yml", "tools/stage32-33-release-writer/**"]
permissions:
  contents: write
  actions: read
jobs:
  exact-retained-release-ref-only:
    if: github.repository == 'sys8994/honro' && github.event_name == 'push' && github.ref == 'refs/heads/qa/stage32-33-retained-writer-e702'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
      - name: Verify sealed R5 and move only authorized isolated release ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/stage32-33-release-writer/safe-push.sh
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: honro-stage32-33-retained-release-receipt-no-deploy
          path: |
            ${{ runner.temp }}/honro-stage32-33-assembly/ASSEMBLY.json
            ${{ runner.temp }}/honro-stage32-33-assembly/candidate.sha
            ${{ runner.temp }}/honro-stage32-33-assembly/candidate.tree
            ${{ runner.temp }}/honro-stage32-33-assembly/hook
          if-no-files-found: warn
          retention-days: 7
