          base="https://sys8994.github.io/honro/"
          for path,v in p.items():
              u=base+('' if path=='root/' else path)
              request=urllib.request.Request(u,headers={'Accept-Encoding':'identity'})
              with urllib.request.urlopen(request,timeout=12) as r:
                  assert r.geturl()==u and r.status==200,(path,'HTTP identity')
                  body=r.read(v['bytes']+1)
              actual={'bytes':len(body),'sha256':hashlib.sha256(body).hexdigest()}
              assert actual==v,(path,'live bytes no longer match tested application',actual,v)
              print(path,actual['bytes'],actual['sha256'])
          print('Exact public application bytes unchanged across the docs-only release:',len(p))
          PYTHON
