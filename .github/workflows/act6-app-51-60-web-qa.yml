          python -m playwright install --with-deps chromium
          HONRO_QA_RUN_60=1 python tools/act6-qa/app-51/smoke.py "$RUNNER_TEMP/act6-stock" "$PILOT_ROOT" "$RUNNER_TEMP/act6-result" > "$RUNNER_TEMP/act6-result/PLAYWRIGHT.log" 2>&1
