name: Verify Stage32 shared material revision
on:
  push:
    branches: ['fix/stage32-shared-material-20261117']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci && npm ci --prefix game
      - name: Source preservation, codec and bounded material cache contracts
        run: |
          git fetch --no-tags --depth=1 origin e89242eedb5c040d38a9077c7289fbdc97786bdf
          BASELINE_REF=e89242eedb5c040d38a9077c7289fbdc97786bdf node tests/stage32-foundation-contract.mjs
          node tests/stage32-material-cache.mjs
          python3 tools/environment/stage32-foundation-field.py
          git diff --exit-code -- shared/data/act4/handoff-art/32-foundation.json
      - name: Generate isolated official Stage32 A/B scenes
        run: HONRO_ACT4_RELEASE=1 node tests/stage32-material-browser-fixture.mjs "$RUNNER_TEMP/material32"
      - name: Actual Chrome overview and lower-left-right detail comparisons
        shell: bash
        run: |
          browser=$(command -v google-chrome || command -v chromium)
          for variant in baseline candidate; do
            for view in overview lower left right; do
              name="stage32-$variant-$view"
              timeout 300s "$browser" --headless --no-first-run --no-default-browser-check --force-device-scale-factor=1 --virtual-time-budget=60000 --user-data-dir="$RUNNER_TEMP/profile-$name" --dump-dom "file://$RUNNER_TEMP/material32/$name.html" > "$RUNNER_TEMP/$name.html"
              node tests/stage32-material-browser-result.mjs "$RUNNER_TEMP/$name.html" "$RUNNER_TEMP/material32-results" "$variant" "$view"
            done
          done
      - name: Official app build
        run: HONRO_ACT4_RELEASE=1 npm run build
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: stage32-shared-material-review
          path: ${{ runner.temp }}/material32-results
          if-no-files-found: warn
