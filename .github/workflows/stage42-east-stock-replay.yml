name: Stage42 QA-only isolated asset-only stock replay
on:
  push:
    branches: ['qa/stage42-east-stock-replay']
    paths:
      - '.github/workflows/stage42-east-stock-replay.yml'
      - 'tests/stage42-east-stock-replay/**'
      - 'shared/assets/environment/act5/stage42-registered-body.json'
permissions:
  contents: read
jobs:
  stock-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Verify branch, parent, immutable artwork provenance and total allowed paths
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/qa/stage42-east-stock-replay
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = 1e043b09d4ce107e1d2dcf70fe2274dff7098476
          mkdir -p "$RUNNER_TEMP/stage42-east-stock-replay-evidence"
          printf '%s\n' .github/workflows/stage42-east-stock-replay.yml shared/assets/environment/act5/stage42-registered-body.json tests/stage42-east-stock-replay/{check-stock.py,east-views.json,gameplay.py,observed-east-cap.json,stock-scenes.js,support-probe.js,verify-isolated.sh} | sort > "$RUNNER_TEMP/east-replay-allowed.txt"
          git diff --name-only HEAD^ HEAD | sort > "$RUNNER_TEMP/east-replay-actual.txt"
          cmp "$RUNNER_TEMP/east-replay-allowed.txt" "$RUNNER_TEMP/east-replay-actual.txt"
          git diff --numstat HEAD^ HEAD -- shared/assets/environment/act5/stage42-registered-body.json > "$RUNNER_TEMP/stage42-east-stock-replay-evidence/candidate-git-numstat.txt"
          test "$(git hash-object shared/assets/environment/act5/stage42-registered-body.json)" = 8a28d581d0621bdbf5d3c525201c9a98ffd38c68
          test "$(sha256sum tests/stage42-east-stock-replay/observed-east-cap.json|cut -d' ' -f1)" = 789365e94591057ab9b3a0131da0f23c6c903b59e62bf2608c642dbe39333252
      - name: Replay clean generated stock builds in independent Chrome contexts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'playwright==1.58.0' 'Pillow==12.0.0'
          export HONRO_CHROME="$(command -v google-chrome || command -v chromium)"
          test -x "$HONRO_CHROME"
          "$HONRO_CHROME" --version
          export HONRO_EAST_STOCK_QA=1
          T=tests/stage42-east-stock-replay
          timeout 1800s bash "$T/verify-isolated.sh" . shared/assets/environment/act5/stage42-registered-body.json "$T/observed-east-cap.json" "$RUNNER_TEMP/stage42-east-stock-replay-evidence"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: stage42-east-stock-replay-evidence
          path: |
            ${{ runner.temp }}/stage42-east-stock-replay-evidence/[AB]*.png
            ${{ runner.temp }}/stage42-east-stock-replay-evidence/result.json
            ${{ runner.temp }}/stage42-east-stock-replay-evidence/asset-metrics.json
            ${{ runner.temp }}/stage42-east-stock-replay-evidence/*-build-sha256.txt
            ${{ runner.temp }}/stage42-east-stock-replay-evidence/candidate-git-numstat.txt
          if-no-files-found: warn
          retention-days: 7
