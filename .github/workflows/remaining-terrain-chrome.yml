name: Inspect remaining terrain bounds candidates in Chrome
on:
  push:
    branches: ['audit/remaining-terrain-chrome-20261117']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: act1-early
            stages: '2,4'
          - name: act1-middle
            stages: '5,6'
          - name: act1-late
            stages: '8,9'
          - name: act1-act2
            stages: '10,14'
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci && npm ci --prefix game
      - name: Retain prior source registrations and actual save compatibility
        if: matrix.name == 'act1-early'
        run: |
          node tools/act1-vector-production/check-edge-integration-manifest.mjs
          node tests/terrain-edge-act1-save-compat.mjs
          node tests/terrain-edge-save-roundtrip.mjs
          node tests/act2-local-art-save.mjs
      - name: Prepare untouched public source in an independent temporary worktree
        shell: bash
        run: |
          git fetch --depth=1 origin 7d238d20663c3ceffe430eb0304e01516ae625cf
          git worktree add --detach "$RUNNER_TEMP/public-baseline" 7d238d20663c3ceffe430eb0304e01516ae625cf
          cmp package-lock.json "$RUNNER_TEMP/public-baseline/package-lock.json"
          cmp game/package-lock.json "$RUNNER_TEMP/public-baseline/game/package-lock.json"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/public-baseline/node_modules"
          ln -s "$GITHUB_WORKSPACE/game/node_modules" "$RUNNER_TEMP/public-baseline/game/node_modules"
          cp tests/remaining-terrain-browser-fixture.mjs "$RUNNER_TEMP/public-baseline/tests/remaining-terrain-browser-fixture.mjs"
      - name: Generate baseline and combined candidate without saved game access
        shell: bash
        run: |
          (cd "$RUNNER_TEMP/public-baseline" && node tests/remaining-terrain-browser-fixture.mjs "$RUNNER_TEMP/baseline-fixtures" '${{ matrix.stages }}' baseline)
          node tests/remaining-terrain-browser-fixture.mjs "$RUNNER_TEMP/candidate-fixtures" '${{ matrix.stages }}' candidate
      - name: Actual Chrome four corner views per stage
        shell: bash
        run: |
          browser=$(command -v google-chrome || command -v chromium)
          for variant in baseline candidate; do
            node -e "for(const q of require(process.argv[1]))console.log(q.stage+':'+q.view)" "$RUNNER_TEMP/$variant-fixtures/capture-list.json" > "$RUNNER_TEMP/capture-list.txt"
            while IFS=: read -r stage view; do
              name="stage$stage-$variant-$view"
              timeout 300s "$browser" --headless --no-first-run --no-default-browser-check --force-device-scale-factor=1 --virtual-time-budget=60000 --user-data-dir="$RUNNER_TEMP/profile-$name" --dump-dom "file://$RUNNER_TEMP/$variant-fixtures/$name.html" > "$RUNNER_TEMP/$name.html"
              node tests/remaining-terrain-browser-result.mjs "$RUNNER_TEMP/$name.html" "$RUNNER_TEMP/evidence" "$stage" "$variant" "$view"
            done < "$RUNNER_TEMP/capture-list.txt"
          done
      - name: Compare unchanged physics and camera and require an actual candidate effect
        run: node tests/remaining-terrain-browser-compare.mjs "$RUNNER_TEMP/evidence" '${{ matrix.stages }}'
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: remaining-terrain-chrome-${{ matrix.name }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
