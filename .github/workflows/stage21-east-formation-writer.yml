name: HONRO Stage21 east foundation exact previously-built writer
on:
  push:
    branches: [qa/stage21-east-after-s33-writer]
    paths: [.github/workflows/stage21-east-formation-writer.yml, tools/stage21-east-formation-writer/**]
permissions:
  contents: write
  actions: read
jobs:
  fixed-release-branch:
    if: github.repository == 'sys8994/honro' && github.event_name == 'push' && github.ref == 'refs/heads/qa/stage21-east-after-s33-writer'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
      - name: Authenticate sealed B and prior Pages without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/stage21-east-formation-writer/writer.py acquire "$RUNNER_TEMP/stage21-east-formation-release"
      - name: Assemble and ordinary-forward only the signed candidate release ref
        run: bash tools/stage21-east-formation-writer/safe-push.sh "$RUNNER_TEMP/stage21-east-formation-release"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: honro-stage21-east-formation-writer-assembly-receipt
          path: |
            ${{ runner.temp }}/stage21-east-formation-release/ASSEMBLY.json
            ${{ runner.temp }}/stage21-east-formation-release/candidate.sha
            ${{ runner.temp }}/stage21-east-formation-release/candidate.tree
            ${{ runner.temp }}/stage21-east-formation-release/hook
          if-no-files-found: warn
          retention-days: 7
