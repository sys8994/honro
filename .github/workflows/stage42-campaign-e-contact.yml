name: Stage42 campaign engineering contact QA ONLY
on:
  push:
    branches: ['qa/stage42-campaign-e-contact']
    paths: ['.github/workflows/stage42-campaign-e-contact.yml','tests/stage42-campaign-e-contact/**']
permissions:
  contents: read
jobs:
  contact:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Exact base, additions only, and packet hashes
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/qa/stage42-campaign-e-contact
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          PIN=1e043b09d4ce107e1d2dcf70fe2274dff7098476
          test "$(git rev-parse HEAD^)" = 9c71aa53138963707a5ccae44f88be813e4282e8
          Q=tests/stage42-campaign-e-contact
          printf '%s\n' .github/workflows/stage42-campaign-e-contact.yml "$Q/prepare.py" "$Q/observe.py" "$Q/verify-domain.cjs" "$Q/manifest.json" "$Q/domain-proof.json" "$Q/local-deck-grade.json" "$Q/SHA256SUMS" | sort > "$RUNNER_TEMP/allow"
          git diff --name-only "$PIN" HEAD | sort | diff -u "$RUNNER_TEMP/allow" -
          git diff --name-only --diff-filter=A "$PIN" HEAD | sort | diff -u "$RUNNER_TEMP/allow" -
          printf '%s\n' .github/workflows/stage42-campaign-e-contact.yml "$Q/prepare.py" "$Q/SHA256SUMS" | sort > "$RUNNER_TEMP/replacement-allow"
          git diff --name-only HEAD^ HEAD | sort | diff -u "$RUNNER_TEMP/replacement-allow" -
          git diff --name-only --diff-filter=M HEAD^ HEAD | sort | diff -u "$RUNNER_TEMP/replacement-allow" -
          echo "48688a8f0cfec8e7456f63105c61451b28f9cadfcf8e9a4e0f5def29d5d81219  $Q/SHA256SUMS" | sha256sum -c -
          (cd "$Q" && sha256sum -c SHA256SUMS)
          test ! -e "$RUNNER_TEMP/fixture"
          git worktree add --detach "$RUNNER_TEMP/fixture" "$PIN"
          python "$Q/prepare.py" "$RUNNER_TEMP/fixture"
          sha256sum "$RUNNER_TEMP/fixture/shared/act5-world.mjs" "$RUNNER_TEMP/fixture/shared/data/act5/stage42-ground-domain.witness.mjs" > "$RUNNER_TEMP/patched-owned.sha"
      - name: Build only detached temporary fixture
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/fixture"
          npm ci
          npm ci --prefix game
          HONRO_ACT4_RELEASE=1 HONRO_ACT5_RELEASE=1 npm run build
          test "$(git rev-parse HEAD)" = 1e043b09d4ce107e1d2dcf70fe2274dff7098476
          if git symbolic-ref -q HEAD; then exit 1; fi
          sha256sum -c "$RUNNER_TEMP/patched-owned.sha"
          git -C "$GITHUB_WORKSPACE" diff --exit-code
          git -C "$GITHUB_WORKSPACE" diff --cached --exit-code
      - name: Actual campaign initial contact observation
        run: |
          set -euo pipefail
          python -m pip install 'playwright==1.58.0'
          export HONRO_CHROME="$(command -v google-chrome || command -v chromium)"
          "$HONRO_CHROME" --version
          mkdir -p "$RUNNER_TEMP/evidence"
          python -m http.server 8884 --bind 127.0.0.1 --directory "$RUNNER_TEMP/fixture" &
          pid=$!; trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..20}; do if curl -fsS -o /dev/null http://127.0.0.1:8884/HONRO.html; then break; fi; sleep 1; done
          timeout 240s python tests/stage42-campaign-e-contact/observe.py http://127.0.0.1:8884/HONRO.html "$RUNNER_TEMP/evidence/entry"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: stage42-campaign-engineering-entry-only
          path: |
            ${{ runner.temp }}/evidence/entry/initial.json
            ${{ runner.temp }}/evidence/entry/stage42-only.png
          if-no-files-found: warn
          retention-days: 7
