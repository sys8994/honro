name: Stage42 connected stockade and legacy lower proof
on:
  push:
    branches: [qa/stage42-crossed-final-served-20261120]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
      - name: Exact base and QA-only scope
        run: |
          set -euo pipefail
          BASE=52119985ad21a7d3de04245ee146293045edbeba
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          test "$(git rev-parse 617674f8d52e640a7070c65cfefd0301e842eef1^)" = "$BASE"
          git merge-base --is-ancestor 617674f8d52e640a7070c65cfefd0301e842eef1 HEAD
          git diff --name-only "$BASE" HEAD | tee /tmp/qa-scope.txt
          test "$(wc -l </tmp/qa-scope.txt)" = 6
          ! grep -vE '^(tools/stage42-final-served-qa/|.github/workflows/stage42-crossed-final-served.yml$)' /tmp/qa-scope.txt
          Q="$GITHUB_WORKSPACE/tools/stage42-final-served-qa"
          W="$RUNNER_TEMP/stage42-final-served"
          mkdir -p "$W/out"
          printf 'QA=%s\nSTOCK=%s\nTARGET=%s\nOUT=%s\n' "$Q" "$W/stock" "$W/target" "$W/out" >> "$GITHUB_ENV"
          CBF=cbf037199e56c640165dd53d8b00827902260862
          test "$(git rev-parse "$CBF^")" = "$BASE"
          test "$(git rev-parse "$CBF^{tree}")" = 3e01d8685238882ddad3e3ddff46a40a753587d9
          git worktree add --detach "$W/stock" "$CBF"
          git worktree add --detach "$W/target" "$CBF"
          python "$Q/prepare.py" "$W/target" | tee "$W/out/preparation.txt"
          printf '%s\n' shared/assets/environment/act5/stage42-registered-body.json > "$W/expected-source-paths"
          git -C "$W/target" diff --name-only | diff - "$W/expected-source-paths"
          git -C "$W/stock" diff --quiet HEAD --
          git -C "$W/target" diff --stat > "$W/out/diagnostic-source-diff.txt"
          test "$(git -C "$W/target" hash-object shared/runtime/act5-edge-art.js)" = 1d0719ff1d56e3c6720f7e7166b3266864a49415
          git -C "$W/target" hash-object shared/assets/environment/act5/stage42-registered-body.json > "$W/out/exact-hybrid-wrapper-blob.txt"
      - name: Stock validation and official builds, no optimizer edits
        run: |
          set -euo pipefail
          for mode in stock target; do
            if [ "$mode" = stock ]; then cd "$STOCK"; else cd "$TARGET"; fi
            npm ci >"$OUT/npm-root-$mode.log" 2>&1
            npm ci --prefix game >"$OUT/npm-game-$mode.log" 2>&1
            node - <<'JS' >"$OUT/vector-validation-$mode.log"
          const fs=require('fs');require('./shared/map/vector-art.js');
          const a=JSON.parse(fs.readFileSync('shared/assets/environment/act5/stage42-registered-body.json'));
          const errors=HonroVectorArt.validate(a.vector);console.log(errors);if(errors.length)throw Error(errors.join(';'));
          JS
            if [ "$mode" = stock ]; then node tests/stage42-edge-geology.mjs >"$OUT/stage42-geology-$mode.log" 2>&1; fi
            node tests/act5-terrain-contact.mjs >"$OUT/act5-contact-$mode.log" 2>&1
            npm run test:release-guard >"$OUT/release-$mode.log" 2>&1
            sha256sum shared/assets/environment/act5/stage42-registered-body.json >"$OUT/source-before-$mode.sha"
            npm run build >"$OUT/build-$mode.log" 2>&1
            sha256sum -c "$OUT/source-before-$mode.sha"
          done
      - name: Six actual matching Stage42 pairs plus exact donor screen region
        run: |
          set -euo pipefail
          python -m pip install playwright==1.58.0 pillow numpy
          python -m playwright install --with-deps chromium
          python -m http.server 18841 --bind 127.0.0.1 --directory "$STOCK" >/tmp/s42-stock-http.log 2>&1 &
          p1=$!
          python -m http.server 18842 --bind 127.0.0.1 --directory "$TARGET" >/tmp/s42-target-http.log 2>&1 &
          p2=$!
          trap 'kill "$p1" "$p2" 2>/dev/null || true' EXIT
          for port in 18841 18842; do curl -fsS --retry 10 --retry-connrefused "http://127.0.0.1:$port/HONRO.html" -o /dev/null; done
          python "$QA/capture.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage42-connected-stockade-and-legacy-lower
          path: ${{ env.OUT }}
          retention-days: 7
