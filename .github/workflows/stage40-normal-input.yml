name: Stage40 bounded normal input comparison
on:
  push:
    branches: ['audit/stage40-normal-input-20261117']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci && npm ci --prefix game
      - run: |
          git fetch --no-tags --depth=1 origin 7d238d20663c3ceffe430eb0304e01516ae625cf
          HONRO_ACT4_RELEASE=1 node tests/stage40-normal-input-fixture.mjs "$RUNNER_TEMP/normal40"
      - name: Ordinary Engine input comparison
        run: |
          browser=$(command -v google-chrome || command -v chromium)
          for variant in baseline candidate; do
            timeout 240s "$browser" --headless --no-first-run --no-default-browser-check --force-device-scale-factor=1 --virtual-time-budget=200000 --user-data-dir="$RUNNER_TEMP/profile-$variant" --dump-dom "file://$RUNNER_TEMP/normal40/stage40-$variant-normal.html" > "$RUNNER_TEMP/$variant.html"
            node tests/stage40-normal-input-result.mjs "$RUNNER_TEMP/$variant.html" "$RUNNER_TEMP/normal40-results"
          done
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: stage40-normal-input
          path: ${{ runner.temp }}/normal40-results
          if-no-files-found: warn
