name: HONRO Stage21 canonical normal build and save resume
on:
  push:
    branches: [qa/stage21-west-bedrock-normal-9ac]
permissions:
  contents: read
jobs:
  proof:
    if: github.repository == 'sys8994/honro' && github.event_name == 'push' && github.ref == 'refs/heads/qa/stage21-west-bedrock-normal-9ac'
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
      - name: Exact retained old app and canonical normal candidate build
        shell: bash
        run: |
          set -euo pipefail
          Q="$GITHUB_WORKSPACE/tools/stage21-r1-normal-qa"
          W="$RUNNER_TEMP/stage21-r1-normal-qa"
          mkdir -p "$W/out"
          echo "WORK=$W" >> "$GITHUB_ENV"
          python "$Q/guard.py" pre "$W"
          (
            cd "$W/B"
            npm ci > "$W/out/npm-root.log" 2>&1
            npm ci --prefix game > "$W/out/npm-game.log" 2>&1
            node tests/stage21-west-bedrock-source.mjs > "$W/out/owner-save-source.log" 2>&1
            npm run test:release-guard > "$W/out/release-guard.log" 2>&1
            npm run build > "$W/out/build.log" 2>&1
            npm run test:production-contract > "$W/out/production-contract.log" 2>&1
            node tests/act4-provider-signature-cache.mjs > "$W/out/provider-signature.log" 2>&1
          )
          python "$Q/guard.py" built "$W"
      - name: Actual native Chrome screenshots and old-save import/continue
        shell: bash
        timeout-minutes: 18
        run: |
          set -euo pipefail
          Q="$GITHUB_WORKSPACE/tools/stage21-r1-normal-qa"
          python -m venv "$WORK/venv"
          V="$WORK/venv/bin/python"
          "$V" -m pip --disable-pip-version-check install playwright==1.62.0 Pillow==13.0.0
          "$V" -m playwright install --with-deps chromium
          python -m http.server 18841 --bind 127.0.0.1 --directory "$WORK/A" > "$WORK/out/http-A.log" 2>&1 &
          a=$!
          python -m http.server 18842 --bind 127.0.0.1 --directory "$WORK/B" > "$WORK/out/http-B.log" 2>&1 &
          b=$!
          trap 'kill "$a" "$b" 2>/dev/null || true' EXIT
          for p in 18841 18842; do curl -fsS --retry 8 --retry-connrefused "http://127.0.0.1:$p/HONRO.html" -o /dev/null; done
          PYTHONDONTWRITEBYTECODE=1 "$V" "$Q/capture.py" "$WORK"
      - name: Seal exact build outputs for review, no deployment
        run: python "$GITHUB_WORKSPACE/tools/stage21-r1-normal-qa/guard.py" archive "$WORK"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: honro-stage21-r1-normal-build-and-resume-no-deploy
          path: ${{ runner.temp }}/stage21-r1-normal-qa/out/
          if-no-files-found: error
          retention-days: 7
