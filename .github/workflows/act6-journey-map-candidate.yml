name: Verify and assemble the Act 6 journey map
on:
  push:
    branches: ['qa/act6-journey-map-20261125']
    paths: ['.github/workflows/act6-journey-map-candidate.yml']
permissions:
  contents: write
jobs:
  candidate:
    if: github.repository == 'sys8994/honro' && github.ref == 'refs/heads/qa/act6-journey-map-20261125'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 2
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Rebuild exact source and preserve the published game graph
        shell: bash
        run: |
          set -euo pipefail
          BASE=05dbc73a1335984d22526e4d70d5bcc7cfa3ed5e
          PROOF=027052f5831180f42e24762b910cddc7fd0178f5
          OFF=b607164fd31da526373efb12d06063c2b564719d
          test "$(git rev-parse HEAD^)" = "$BASE"
          test "$(git ls-remote origin refs/heads/master | cut -f1)" = "$BASE"
          readarray -t HISTORY < <(git show "$BASE:web/manifest.json" | node -e 'let x="";process.stdin.on("data",c=>x+=c);process.stdin.on("end",()=>console.log([...new Set(JSON.parse(x).publishedGenerations.map(r=>r.sourceSha))].join("\n")));')
          git fetch --depth=1 origin "$PROOF" "$OFF" "${HISTORY[@]}"
          R="$(realpath "$(mktemp -d /tmp/honro-act6-web-qa-XXXXXXXX)")"
          OUT="$RUNNER_TEMP/act6-journey-proof"
          mkdir -p "$OUT"
          echo "CANDIDATE_ROOT=$R" >> "$GITHUB_ENV"
          git -c core.hooksPath=/dev/null worktree add --detach "$R" "$BASE"
          git -c core.hooksPath=/dev/null worktree add --detach "$RUNNER_TEMP/act6-stock" "$OFF"
          cd "$R"
          git checkout "$GITHUB_SHA" -- shared/act6-journey shared/act6-app-qa.mjs shared/runtime/{rest-journey,journey-images}.js shared/web-build.mjs game/src/journey.css game/docs/planning/act6-finale-20261125/HONRO-ACT6-JOURNEY-MAP.ko.md tools/act6-journey/witness.py
          node tools/release/retain-published-web.mjs "$BASE" --published-at 2026-11-24T23:07:48Z --evidence https://github.com/sys8994/honro/actions/runs/45506884705 > "$OUT/RETENTION.log" 2>&1
          npm ci --no-audit --no-fund > "$OUT/NPM.log" 2>&1
          npm ci --prefix game --include=dev --no-audit --no-fund > "$OUT/NPM-GAME.log" 2>&1
          npm run build > "$OUT/BUILD.log" 2>&1
          git show "$PROOF:tools/act6-qa/rest-51/terrain_authority.py" > "$RUNNER_TEMP/terrain-authority.py"
          python "$RUNNER_TEMP/terrain-authority.py" "$R" "$OUT" "$BASE"
          python - "$R" "$BASE" "$OUT" <<'PY'
          import hashlib,json,re,subprocess,sys
          from pathlib import Path
          base,ref,out=Path(sys.argv[1]),sys.argv[2],Path(sys.argv[3])
          m=json.loads((base/'web/manifest.json').read_bytes())
          old=json.loads(subprocess.check_output(['git','-C',str(base),'show',ref+':web/manifest.json']))
          assert m['project']==old['project']
          files={r['path']:r for r in m['files']}
          prior={r['path']:r for r in old['files']}
          new=set(files)-set(prior)
          assert 4<=len(new)<=12,sorted(new)
          assert sum('journey-map-act6.' in p for p in new)==1
          assert not any('/data/' in p for p in new),sorted(new)
          assert any(r.get('sourceSha')==ref for r in m['publishedGenerations'])
          for p,r in (files|prior).items():
              b=(base/p).read_bytes()
              assert len(b)==r['bytes'] and hashlib.sha256(b).hexdigest()==r['sha256'],p
          (out/'new-paths.txt').write_text('\n'.join(sorted(new))+'\n')
          (out/'MANIFEST.sha256').write_text(hashlib.sha256((base/'web/manifest.json').read_bytes()).hexdigest()+'\n')
          PY
          # Reuse the prior sealed fixtures and scripted normal campaign inputs;
          # verification does not change any staged product source.
          W="$(realpath "$(mktemp -d /tmp/honro-act6-web-qa-XXXXXXXX)")"
          echo "WITNESS_ROOT=$W" >> "$GITHUB_ENV"
          git -c core.hooksPath=/dev/null worktree add --detach "$W" "$BASE"
          git diff --cached --binary | git -C "$W" apply --index -
          ln -s "$R/node_modules" "$W/node_modules"
          ln -s "$R/game/node_modules" "$W/game/node_modules"
          cd "$W"
          git archive "$PROOF" tools/act6-qa/rest-51 | tar -x
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/act6-qa/rest-51/smoke.py')
          s=p.read_text()
          mappings={
          'from normal52_witness import stage52':'from witness import witness\nfrom normal52_witness import stage52',
          "            original=page.evaluate(\"key=>localStorage.getItem(key)\",KEY)":"            if kind=='fresh-pending': witness(page,state,mobile,tap,out,key,51)\n            original=page.evaluate(\"key=>localStorage.getItem(key)\",KEY)",
          "        t.locator(selector).evaluate(\"e=>e.click()\")":"        witness(t,state,mobile,tap,out,case,stage)\n        t.locator(selector).evaluate(\"e=>e.click()\")",
          "                    state['lastBoundaryBytes']=len(last.encode())":"                    state['lastBoundaryBytes']=len(last.encode())\n                    page.clock.resume()\n                    witness(page,state,mobile,tap,out,key,'done')"
          }
          for before,after in mappings.items():
              assert s.count(before)==1,before
              s=s.replace(before,after)
          p.write_text(s)
          PY
          cp tools/act6-journey/witness.py tools/act6-qa/rest-51/witness.py
          python tools/act6-qa/rest-51/normal-late-readbacks.py shared/act6-app-qa.mjs
          HONRO_ACT6_QA_NORMAL_LATE_WITNESS=1 HONRO_ACT6_RELEASE_HOST_TEST=1 HONRO_ACT6_QA_NORMAL_BOUNDARY=1 HONRO_ACT6_QA_QUIET_MATTE_WITNESS=1 HONRO_ACT6_QA_PAGES_SHAPE=1 HONRO_ACT6_QA_NORMAL_FAR=1 HONRO_ACT6_QA_NORMAL_LATE_FAR=1 HONRO_ACT6_QA_NORMAL_FINAL_FAR=1 HONRO_ACT6_QA_NORMAL_ENDING_STOCK=1 HONRO_ACT6_QA_WEB_ROOT="$W" npm run build > "$OUT/WITNESS-BUILD.log" 2>&1
          # Late stage witness probes enable extra instrumentation. The release
          # candidate is separately rebuilt, compared and assembled below.
      - name: Test map opening, actual 6-2 resume and actual ending in Chromium
        run: |
          set -euo pipefail
          python -m pip install 'playwright==1.58.0'
          python -m playwright install --with-deps chromium
          cd "$WITNESS_ROOT"
          HONRO_ACT6_TERRAIN_PROOF=1 HONRO_ACT6_RELEASE_HOST_TEST=1 HONRO_ACT6_QA_NORMAL_BOUNDARY=1 HONRO_ACT6_QA_QUIET_MATTE_WITNESS=1 HONRO_ACT6_QA_PAGES_SHAPE=1 HONRO_ACT6_QA_NORMAL_FAR=1 HONRO_ACT6_QA_NORMAL_LATE_FAR=1 HONRO_ACT6_QA_NORMAL_FINAL_FAR=1 HONRO_ACT6_QA_NORMAL_ENDING_STOCK=1 python tools/act6-qa/rest-51/smoke.py "$RUNNER_TEMP/act6-stock" "$WITNESS_ROOT" "$RUNNER_TEMP/act6-journey-proof" > "$RUNNER_TEMP/act6-journey-proof/PLAYWRIGHT.log" 2>&1
      - name: Assemble only verified product paths
        run: |
          set -euo pipefail
          BASE=05dbc73a1335984d22526e4d70d5bcc7cfa3ed5e
          OUT="$RUNNER_TEMP/act6-journey-proof"
          cd "$CANDIDATE_ROOT"
          test "$(sha256sum web/manifest.json | cut -f1 -d' ')" = "$(cat "$OUT/MANIFEST.sha256")"
          readarray -t NEW < "$OUT/new-paths.txt"
          git add -- HONRO.html HONRO_WORKSHOP.html index.html web/manifest.json "${NEW[@]}"
          ! git diff --cached --name-only | grep -E '^\.github/|^tools/act6-qa/'
          test -z "$(git diff --cached --diff-filter=D --name-only)"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' -c core.hooksPath=/dev/null commit -m 'feat(journey): chart the folded paths of Act 6'
          test "$(git rev-parse HEAD^)" = "$BASE"
          test "$(git ls-remote origin refs/heads/master | cut -f1)" = "$BASE"
          git push origin HEAD:refs/heads/release/act6-journey-map-20261125
          git rev-parse HEAD > "$OUT/CANDIDATE.txt"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: act6-journey-map-proof
          path: ${{ runner.temp }}/act6-journey-proof/
          retention-days: 7
