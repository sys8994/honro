name: Inspect Stage40 opening tactics
on:
  push:
    branches: ['work/act4-opening-direct/**']
permissions:
  contents: read
jobs:
  opening:
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    env:
      HONRO_CAPTURE_URL: http://127.0.0.1:8870/HONRO.html
      HONRO_CAPTURE_OUT: _local/reports/stage40-opening
      HONRO40_FINISH: '1'
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Install pinned browser
        run: |
          python -m pip install 'playwright==1.58.0'
          python -m playwright install chromium
          if ! python -c 'from playwright.sync_api import sync_playwright; w=sync_playwright().start(); b=w.chromium.launch(headless=True); b.close(); w.stop()'; then python -m playwright install-deps chromium; fi
      - name: Play the unchanged production opening with split tactics
        run: |
          set -euo pipefail
          mkdir -p "$HONRO_CAPTURE_OUT"
          echo '7e9d2fb93104c5afe9ac839d598edbe1bbb047f5ac3b32a44b76d8d46f1de075  HONRO.html' | sha256sum -c -
          python -m http.server 8870 --bind 127.0.0.1 > "$HONRO_CAPTURE_OUT/server.log" 2>&1 &
          server=$!;trap 'kill "$server" 2>/dev/null || true' EXIT
          sleep 2
          python tools/act4-ci/stage40-opening/play.py > "$HONRO_CAPTURE_OUT/play.log" 2>&1
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: stage40-opening-${{ github.sha }}
          path: _local/reports/stage40-opening/
          retention-days: 7
