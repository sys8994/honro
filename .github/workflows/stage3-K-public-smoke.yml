name: Stage3 exact deployed release public smoke
on:
  workflow_dispatch:
  push:
    branches: [inspect/stage32-scanline-20261118]
    paths: ['tools/testing/stage3-K-public-smoke/**', '.github/workflows/stage3-K-public-smoke.yml']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with: {path: study}
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with: {path: release, ref: '1e043b09d4ce107e1d2dcf70fe2274dff7098476'}
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with: {node-version: '22', package-manager-cache: false}
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with: {python-version: '3.12'}
      - run: |
          cd release
          npm ci
          npm ci --prefix game
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Public byte identity and actual UI Stage3 smoke
        env:
          HONRO_EXPECTED_RELEASE_SHA: '1e043b09d4ce107e1d2dcf70fe2274dff7098476'
          HONRO_PUBLIC_REPLAY_ENABLED: '1'
        run: |
          mkdir -p artifacts
          export HONRO_RELEASE_ROOT="$PWD/release"
          export HONRO_CAPTURE_OUT="$PWD/artifacts"
          export HONRO_SYNTHETIC_PROFILE="$PWD/artifacts/synthetic-stage3.json"
          node study/tools/testing/stage3-K-public-smoke/make-profile.mjs release "$HONRO_SYNTHETIC_PROFILE"
          python study/tools/testing/stage3-K-public-smoke/play.py
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with: {name: stage3-public-release-smoke, path: artifacts, if-no-files-found: error}
