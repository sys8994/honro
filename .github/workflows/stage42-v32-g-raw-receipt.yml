name: Stage42 G exact native Export receipt retention
on:
  push:
    branches: ['qa/stage42-v32-g-raw-receipt']
    paths: ['.github/workflows/stage42-v32-g-raw-receipt.yml','tests/stage42-v32-g-raw-receipt/g-gate-proof.py']
permissions:
  contents: read
jobs:
  stock_smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Confirm exact stock base and narrow QA additions
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/qa/stage42-v32-g-raw-receipt
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$(git show -s --format=%P HEAD)" = dc2e65bc15937437a77f4b8dad57a40f7c190e7f
          test "$(git rev-parse HEAD^^)" = 1e043b09d4ce107e1d2dcf70fe2274dff7098476
          Q=tests/stage42-v32-g-raw-receipt
          printf '%s\n' .github/workflows/stage42-v32-g-raw-receipt.yml "$Q/g-gate-proof.py" > "$RUNNER_TEMP/solid-allowlist"
          git diff --name-only HEAD^ HEAD | LC_ALL=C sort | diff -u "$RUNNER_TEMP/solid-allowlist" -
          git diff --name-only --diff-filter=A HEAD^ HEAD | LC_ALL=C sort | diff -u "$RUNNER_TEMP/solid-allowlist" -
          echo '5e82f0267e40fc0bb4842d196f0e365916baa2ecd0bae522ce175a271053a2c7  tests/stage42-v32-g-gate/g-gate-proof.py' | sha256sum -c -
          echo 'ce999dc3be23aa5781fa408f6f85004b8373495605f8b6c9c19cd0b5c3a3cb11  tests/stage42-v32-g-gate/apply-native-fill.mjs' | sha256sum -c -
          echo '81e520d9facf81c9336df3e09d0b635c9c3ed3a2cabcbc797ffc1514e3628f53  tests/stage42-v32-g-raw-receipt/g-gate-proof.py' | sha256sum -c -
      - name: Build unmodified stock Workshop
        run: |
          set -euo pipefail
          npm ci
          npm ci --prefix game
          npm run build
          D="$RUNNER_TEMP/stage42-native-fill-disposable"
          mkdir -p "$D"
          cp -a web HONRO_WORKSHOP.html HONRO.html "$D/"
          HONRO_NATIVE_FILL_PROOF=1 node tests/stage42-v32-g-gate/apply-native-fill.mjs "$D"
          node --check "$D/web/runtime/workshop-app.489f733634454986.js"
      - name: Run a single genuine Solid authoring and Player smoke
        run: |
          set -euo pipefail
          python -m pip install 'playwright==1.58.0'
          export HONRO_CHROME="$(command -v google-chrome || command -v chromium)"
          "$HONRO_CHROME" --version
          mkdir -p "$RUNNER_TEMP/stock-solid-evidence"
          D="$RUNNER_TEMP/stage42-native-fill-disposable"
          python -m http.server 8884 --bind 127.0.0.1 --directory "$D" &
          pid=$!; trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..20}; do if curl -fsS -o /dev/null http://127.0.0.1:8884/HONRO_WORKSHOP.html; then break; fi; sleep 1; done
          timeout 360s python tests/stage42-v32-g-raw-receipt/g-gate-proof.py "$RUNNER_TEMP/stock-solid-evidence" http://127.0.0.1:8884/HONRO_WORKSHOP.html
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: success()
        with:
          name: stage42-g-synthetic-exact-native-export-receipts
          path: |
            ${{ runner.temp }}/stock-solid-evidence/verified-native/g-bridge.native.honro-map.json
            ${{ runner.temp }}/stock-solid-evidence/verified-native/g-gate.native.honro-map.json
            ${{ runner.temp }}/stock-solid-evidence/verified-native/g-native-export-proof.json
          if-no-files-found: error
          retention-days: 3
