name: Stage42 composed native Workshop art QA
on:
  push:
    branches: ['qa/stage42-composed-native']
    paths: ['.github/workflows/stage42-composed-native.yml','tests/stage42-composed-native/**']
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HONRO_ACT4_RELEASE: '1'
      HONRO_ACT5_RELEASE: '1'
      STAGE42_ENABLE_C01: '1'
      STAGE42_ENABLE_LIVE_WALK: '1'
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Verify exact QA paths, input bytes, and source parent
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/qa/stage42-composed-native
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = ca427cad011e37a134b7d4d680daa1c10dd4a2c9
          N=tests/stage42-composed-native
          printf '%s\n' .github/workflows/stage42-composed-native.yml "$N/candidate.SHA256SUMS" "$N/candidate-paths.txt" > "$RUNNER_TEMP/compose-allowed.txt"
          sed "s|^|$N/|" "$N/candidate-paths.txt" >> "$RUNNER_TEMP/compose-allowed.txt"
          LC_ALL=C sort -o "$RUNNER_TEMP/compose-allowed.txt" "$RUNNER_TEMP/compose-allowed.txt"
          git diff --name-only --diff-filter=A HEAD^ HEAD | LC_ALL=C sort | diff -u "$RUNNER_TEMP/compose-allowed.txt" -
          git diff --name-only HEAD^ HEAD | LC_ALL=C sort | diff -u "$RUNNER_TEMP/compose-allowed.txt" -
          (cd "$N" && sha256sum -c candidate.SHA256SUMS)
          npm ci
          npm ci --prefix game
          npm run build
          mkdir -p "$RUNNER_TEMP/stage42-composed-stock"
          cp -a web HONRO_WORKSHOP.html HONRO.html "$RUNNER_TEMP/stage42-composed-stock/"
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        if: env.STAGE42_ENABLE_C01 == '1'
        with:
          ref: be0ed7e34746533fc655ddc5598e1e7a600d6e80
          path: c01-exact-input
          sparse-checkout: tests/stage42-c01-integrated-qa
          persist-credentials: false
      - name: Real current Gate vs new composed pointer replay
        run: |
          set -euo pipefail
          python -m pip install 'playwright==1.58.0' 'Pillow==12.0.0'
          export HONRO_CHROME="$(command -v google-chrome || command -v chromium)"
          test -x "$HONRO_CHROME"
          "$HONRO_CHROME" --version
          if [[ "$STAGE42_ENABLE_C01" = 1 ]]; then
            export STAGE42_C01_PNG="$GITHUB_WORKSPACE/c01-exact-input/tests/stage42-c01-integrated-qa/C01.png"
            printf '%s  %s\n' 1bd2b2d24d6590371b0ffd4a944c2f83327afee3f3d5c4a91e0cbe83c707cbab "$STAGE42_C01_PNG" | sha256sum -c -
          fi
          bash tests/stage42-composed-native/run-local-proof.sh tests/stage42-full-native-workshop "$RUNNER_TEMP/stage42-composed-stock" "$RUNNER_TEMP/stage42-composed-copies" "$RUNNER_TEMP/stage42-composed-evidence"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: stage42-composed-native-browser-art
          path: |
            ${{ runner.temp }}/stage42-composed-evidence/result.json
            ${{ runner.temp }}/stage42-composed-evidence/baseline/result.json
            ${{ runner.temp }}/stage42-composed-evidence/candidate/result.json
            ${{ runner.temp }}/stage42-composed-evidence/baseline/gate-stock-*.png
            ${{ runner.temp }}/stage42-composed-evidence/candidate/gate-stock-*.png
            ${{ runner.temp }}/stage42-composed-evidence/candidate/c01-*.png
            ${{ runner.temp }}/stage42-composed-evidence/candidate/legal-extreme-*.png
            ${{ runner.temp }}/stage42-composed-evidence/candidate/08-stock-composed-first-walk.png
            ${{ runner.temp }}/stage42-composed-evidence/candidate/live-first-walk.json
            ${{ runner.temp }}/stage42-composed-evidence/baseline/07-actual-gate-reopened.png
            ${{ runner.temp }}/stage42-composed-evidence/candidate/07-actual-gate-reopened.png
            ${{ runner.temp }}/stage42-composed-evidence/*/failure.png
          if-no-files-found: warn
          retention-days: 7
