name: Verify public Act6 release from the actual Pages origin
on:
  push:
    branches: [qa/act6-reunion-live-save-diagnose-20261125]
    paths: [.github/workflows/act6-live-readback.yml]
permissions:
  contents: read
jobs:
  live:
    if: github.repository == 'sys8994/honro' && github.ref == 'refs/heads/qa/act6-reunion-live-save-diagnose-20261125'
    runs-on: ubuntu-22.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Verify transport exactness and stock Continue on PC and mobile
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/act6-live"
          python -m pip install 'playwright==1.58.0'
          python -m playwright install --with-deps chromium
          python tools/act6-qa/rest-51/verify_published.py b6a0e441e65f5c8ad944bea743f113260e7407b59c31eaa004f4bfc61eebea7b "$RUNNER_TEMP/act6-live" > "$RUNNER_TEMP/act6-live/PLAYWRIGHT.log" 2>&1
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: act6-live-save-diagnose
          path: ${{ runner.temp }}/act6-live/
          retention-days: 7
