name: Stage46 exact external art / anonymous live readback
on:
  push:
    branches: [qa/stage46-external-readback-3c55]
    paths: [".github/workflows/stage46-3c55-readback.yml", "tools/stage46-3c55-readback/**"]
permissions:
  contents: read
  actions: read
jobs:
  read-only:
    if: github.repository == 'sys8994/honro' && github.event_name == 'push' && github.ref == 'refs/heads/qa/stage46-external-readback-3c55'
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact parent and actual public deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/stage46-3c55-readback/guard.py authority "$RUNNER_TEMP/stage46-3c55-readback"
      - name: Public immutable route and prior versus live browser readback
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/stage46-3c55-readback"
          T="$GITHUB_WORKSPACE/tools/stage46-3c55-readback"
          python3 -B "$T/guard.py" prepare "$W"
          python3 -m venv "$W/v"; V="$W/v/bin/python"
          "$V" -m pip --disable-pip-version-check install playwright==1.62.0 Pillow==13.0.0
          "$V" -m playwright install --with-deps chromium
          python3 -m http.server 18961 --bind 127.0.0.1 --directory "$W/A" >"$W/out/http-A.log" 2>&1 & a=$!
          trap 'kill "$a" 2>/dev/null || true' EXIT
          curl -fsS --retry 8 --retry-connrefused http://127.0.0.1:18961/HONRO.html -o /dev/null
          "$V" -B "$T/capture.py" "$W"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: honro-stage46-3c55-readonly-native
          path: ${{ runner.temp }}/stage46-3c55-readback/out/
          if-no-files-found: warn
          retention-days: 7
