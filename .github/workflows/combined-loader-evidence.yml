name: Combined loader evidence completion
on:
  push:
    branches: ['test/combined-loader-evidence-20261118']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      HONRO_ACT4_RELEASE: '1'
      HONRO_ACT5_RELEASE: '1'
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci && npm ci --prefix game
      - name: Build official manifest-derived isolated middle fixtures
        run: node tests/combined-act4-middle-placement-browser.mjs "$RUNNER_TEMP/middle"
      - name: Verify actual Chrome helper presence and candidate Scene initialization
        run: |
          browser=$(command -v google-chrome || command -v chromium)
          for stage in 34 37 38; do
            name="stage$stage-candidate-overview"
            timeout 300s "$browser" --headless --no-first-run --no-default-browser-check --force-device-scale-factor=1 --virtual-time-budget=60000 --user-data-dir="$RUNNER_TEMP/profile-$name" --dump-dom "file://$RUNNER_TEMP/middle/$name.html" > "$RUNNER_TEMP/$name.html"
            node tests/act4-middle-placement-result.mjs "$RUNNER_TEMP/$name.html" "$RUNNER_TEMP/evidence/middle"
          done
      - name: Verify complete helper source and statistics evidence
        run: node tests/combined-loader-evidence.mjs "$RUNNER_TEMP/evidence/middle"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: combined-safe-source-loader
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
