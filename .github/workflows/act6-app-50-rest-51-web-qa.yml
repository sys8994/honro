name: Act 6 genuine 50 ending and rest to normal 51–54 no-deploy QA
on:
  push:
    branches: ['qa/act6-app-50-rest-normal55-20261125-r8c']
    paths:
      - '.github/workflows/act6-app-50-rest-51-web-qa.yml'
permissions:
  contents: read
jobs:
  normal-app:
    if: github.repository == 'sys8994/honro' && github.ref == 'refs/heads/qa/act6-app-50-rest-normal55-20261125-r8c'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 13
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Check exact source scope; preserve detached OFF Pages bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/act6-result"
          BASE=b607164fd31da526373efb12d06063c2b564719d
          R4=904cf0337bc5aef2ffefb739d91e6f7d46786a08
          R5=c4f534da40a3a10e60b8f797eaefdefc16c629ed
          R6=499665921d952a7271da18b11c84065c0ede6fde
          R6D=ce52775ff07bc75f0f9b610c8164d034084ebb20
          R6F=ad635fb308de94654873abb3635f915f7c364861
          R6G=afb2852a844bd404445c0eff773c81e96256e40e
          R7=48d700f6e21b9b4480f83fcd996cb60cd1ecb15f
          R7B=f8b8108217bccb494a4948126e9a3f6d67d80c3c
          R7C=546ef8710b11c49617368540987d5505916e9409
          R8=4379f5b9526e93958980a121844c5c2093c9e51f
          R8B=605a1626b3f69b625520dffd22b35bbd974dbb00
          test "$(git rev-list --parents -n1 HEAD)" = "$GITHUB_SHA $R8B"
          test "$(git rev-list --parents -n1 "$R8B")" = "$R8B $R8"
          test "$(git rev-list --parents -n1 "$R8")" = "$R8 $R7C"
          test "$(git rev-list --parents -n1 "$R7C")" = "$R7C $R7B"
          test "$(git rev-list --parents -n1 "$R7B")" = "$R7B $R7"
          test "$(git rev-parse "$R7C^{tree}")" = 5c121280c9cbaf2a571806f4db69404eb993c1b2
          test "$(git rev-list --parents -n1 "$R7")" = "$R7 $R6G"
          test "$(git rev-parse "$R7^{tree}")" = 0976d93778ca849c45e0456c0e4181fd34ace3f6
          test "$(git rev-list --parents -n1 "$R6G")" = "$R6G $R6F"
          test "$(git rev-list --parents -n1 "$R6F")" = "$R6F $R6D"
          test "$(git rev-parse "$R6G^{tree}")" = b4c88ee84ec42cb1fa92be5119a7a20e58d0f002
          test "$(git rev-parse "$R6D^{tree}")" = 29f09b387eafdc7ade981a22ba12ce0374302f08
          test "$(git rev-list --parents -n1 "$R6D")" = "$R6D $R6"
          test "$(git rev-list --parents -n1 "$R6")" = "$R6 $R5"
          test "$(git rev-list --parents -n1 "$R5")" = "$R5 $R4"
          test "$(git rev-parse "$R4^{tree}")" = 633f9429c907f0904e2522cd945925c1dad9ab47
          test "$(git rev-list --parents -n1 "$R4")" = "$R4 $BASE"
          git rev-parse HEAD HEAD^{tree} "$R8B" "$R8B^{tree}" "$R8" "$R8^{tree}" "$R7C" "$R7C^{tree}" "$R7B" "$R7B^{tree}" "$R7" "$R7^{tree}" "$R6G" "$R6G^{tree}" "$R6F" "$R6F^{tree}" "$R6D" "$R6D^{tree}" "$R6" "$R6^{tree}" "$R5" "$R5^{tree}" "$R4" "$R4^{tree}" "$BASE" "$BASE^{tree}" | tee "$RUNNER_TEMP/act6-result/SOURCE.txt"
          diff -u <(printf '%s\n' .github/workflows/act6-app-50-rest-51-web-qa.yml tools/act6-qa/rest-51/normal55_witness.py) <(git diff --name-only "$R8B" HEAD)
          diff -u <(printf '%s\n' .github/workflows/act6-app-50-rest-51-web-qa.yml tools/act6-qa/rest-51/normal55_witness.py) <(git diff --name-only "$R8" "$R8B")
          diff -u <(printf '%s\n' .github/workflows/act6-app-50-rest-51-web-qa.yml shared/act6-app-qa.mjs shared/data/act6-qa/fifth.json shared/runtime/stage51-campaign-provider.mjs shared/runtime/stage55-entry.inc.js shared/runtime/stage55-pilot-owner.mjs tools/act6-qa/rest-51/browser-normal55.js tools/act6-qa/rest-51/normal55_witness.py tools/act6-qa/rest-51/smoke.py) <(git diff --name-only "$R7C" "$R8")
          diff -u <(printf '%s\n' .github/workflows/act6-app-50-rest-51-web-qa.yml shared/act6-app-qa.mjs shared/data/act6-qa/fourth.json shared/runtime/chart-packet.mjs shared/runtime/stage51-campaign-provider.mjs shared/runtime/stage54-entry.inc.js shared/runtime/stage54-pilot-owner.mjs tools/act6-qa/rest-51/INPUT-54.json tools/act6-qa/rest-51/browser-normal54.js tools/act6-qa/rest-51/normal54_witness.py tools/act6-qa/rest-51/smoke.py) <(git diff --name-only "$R6G" "$R7")
          scratch=$(realpath "$(mktemp -d /tmp/honro-act6-web-qa-XXXXXXXX)")
          git -c core.hooksPath=/dev/null worktree add --detach "$scratch" HEAD
          git -c core.hooksPath=/dev/null worktree add --detach "$RUNNER_TEMP/act6-stock" "$BASE"
          test "$(git -C "$scratch" rev-parse HEAD)" = "$GITHUB_SHA"
          echo "PILOT_ROOT=$scratch" >> "$GITHUB_ENV"
      - name: Normal build, explicit private QA output only
        shell: bash
        run: |
          set -euo pipefail
          cd "$PILOT_ROOT"
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/act6-result/NPM.log" 2>&1
          npm ci --prefix game --include=dev --no-audit --no-fund > "$RUNNER_TEMP/act6-result/NPM-GAME.log" 2>&1
          HONRO_ACT6_QA_WEB_BUILD=1 HONRO_ACT6_QA_NORMAL51=1 HONRO_ACT6_QA_WEB_ROOT="$PILOT_ROOT" npm run build > "$RUNNER_TEMP/act6-result/BUILD.log" 2>&1
      - name: Ordinary sandboxed Chromium PC and mobile
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'playwright==1.58.0'
          python -m playwright install --with-deps chromium
          python tools/act6-qa/rest-51/smoke.py "$RUNNER_TEMP/act6-stock" "$PILOT_ROOT" "$RUNNER_TEMP/act6-result" > "$RUNNER_TEMP/act6-result/PLAYWRIGHT.log" 2>&1
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: act6-50-rest-normal55-no-deploy-r8c-${{ github.sha }}
          path: ${{ runner.temp }}/act6-result/
          retention-days: 7
