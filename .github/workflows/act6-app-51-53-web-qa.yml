name: Act 6 ordinary App 51–53 isolated no-deploy QA
on:
  push:
    branches: ['qa/act6-app-51-53-20261124-r1']
    paths:
      - '.github/workflows/act6-app-51-53-web-qa.yml'
permissions:
  contents: read
jobs:
  normal-app:
    if: github.repository == 'sys8994/honro' && github.ref == 'refs/heads/qa/act6-app-51-53-20261124-r1'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Check exact source scope; preserve detached OFF Pages bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/act6-result"
          BASE=b607164fd31da526373efb12d06063c2b564719d
          test "$(git rev-list --parents -n1 HEAD)" = "$GITHUB_SHA $BASE"
          git rev-parse HEAD HEAD^{tree} "$BASE" "$BASE^{tree}" | tee "$RUNNER_TEMP/act6-result/SOURCE.txt"
          diff -u <(printf '%s\n' .github/workflows/act6-app-51-53-web-qa.yml shared/act6-app-qa.mjs shared/build.mjs shared/data/act6-qa/first-two.json shared/data/act6-qa/third.json shared/runtime/act6-app-qa.js shared/runtime/act6-first-missions.mjs shared/runtime/act6-inner-missions.mjs shared/runtime/act6-stage53-actions.mjs shared/web-build.mjs tools/act6-qa/app-51/native-replay.js tools/act6-qa/app-51/smoke.py) <(git diff --name-only "$BASE" HEAD)
          scratch=$(realpath "$(mktemp -d /tmp/honro-act6-web-qa-XXXXXXXX)")
          git -c core.hooksPath=/dev/null worktree add --detach "$scratch" HEAD
          git -c core.hooksPath=/dev/null worktree add --detach "$RUNNER_TEMP/act6-stock" "$BASE"
          test "$(git -C "$scratch" rev-parse HEAD)" = "$GITHUB_SHA"
          echo "PILOT_ROOT=$scratch" >> "$GITHUB_ENV"
      - name: Normal build, explicit private QA output only
        shell: bash
        run: |
          set -euo pipefail
          cd "$PILOT_ROOT"
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/act6-result/NPM.log" 2>&1
          npm ci --prefix game --include=dev --no-audit --no-fund > "$RUNNER_TEMP/act6-result/NPM-GAME.log" 2>&1
          HONRO_ACT6_QA_WEB_BUILD=1 HONRO_ACT6_QA_WEB_ROOT="$PILOT_ROOT" npm run build > "$RUNNER_TEMP/act6-result/BUILD.log" 2>&1
      - name: Ordinary sandboxed Chromium PC and mobile
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'playwright==1.58.0'
          python -m playwright install --with-deps chromium
          python tools/act6-qa/app-51/smoke.py "$RUNNER_TEMP/act6-stock" "$PILOT_ROOT" "$RUNNER_TEMP/act6-result" > "$RUNNER_TEMP/act6-result/PLAYWRIGHT.log" 2>&1
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: act6-app-51-53-web-no-deploy-r1-${{ github.sha }}
          path: ${{ runner.temp }}/act6-result/
          retention-days: 7
