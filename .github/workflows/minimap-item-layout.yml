name: Verify minimap and item control separation
on:
  push:
    branches: ['work/minimap-item-fix/**']
permissions:
  contents: write
jobs:
  focused-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OUT: _local/reports/minimap-item-release
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Unchanged runtime evidence and normal production build
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          npm ci
          npm ci --prefix game
          node tests/equipment-app.mjs | tee "$OUT/equipment-app.log"
          node tests/equipment-state.mjs | tee "$OUT/equipment-state.log"
          HONRO_ACT4_RELEASE=1 node tests/act4-equipment-release.mjs | tee "$OUT/act4-equipment.log"
          # CSS-only fix: inherit genuine current Stage31 evidence, never refresh or bypass it.
          mapfile -t refs < <(node --input-type=module -e 'import fs from "node:fs";import {selectPublishedGenerations} from "./shared/web-retention.mjs";for(const g of selectPublishedGenerations(JSON.parse(fs.readFileSync("web/manifest.json")).publishedGenerations,{now:Date.now()})){if(!/^[a-f0-9]{40}$/.test(g.sourceSha))throw Error("Invalid ref");console.log(g.sourceSha)}')
          git fetch --no-tags --depth=1 origin c1a8cc243c7681b03f9e7b8c182164f62deaae2e "${refs[@]}"
          node tools/release/retain-published-web.mjs c1a8cc243c7681b03f9e7b8c182164f62deaae2e --published-at 2026-11-02T18:24:55Z --evidence https://github.com/sys8994/honro/actions/runs/41500035506
          npm run build | tee "$OUT/normal-build.log"
          sha256sum HONRO.html web/manifest.json > "$OUT/served-sha256.txt"
          python -m pip install 'playwright==1.58.0'
          python -m playwright install --with-deps chromium
      - name: Normal Stage11 UI, all minimap corners and bottom, four viewports
        run: HONRO_MINIMAP_OUT="$OUT/minimap" python tests/minimap-item-browser.py
      - name: Existing item flow on production build, four viewports
        run: HONRO_ITEM_UI_MODE=production HONRO_ITEM_UI_OUT="$OUT/items" python tests/item-discovery-browser.py
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: minimap-item-layout-${{ github.sha }}
          path: _local/reports/minimap-item-release/
          retention-days: 7
      - name: Preserve tested candidate, not master publication
        run: |
          set -euo pipefail
          git add web HONRO.html HONRO_WORKSHOP.html index.html
          git -c user.name='honro release automation' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Build checked minimap/item layout from $GITHUB_SHA"
          git push origin "HEAD:refs/heads/work/minimap-item-generated/$GITHUB_SHA"
