name: Official three-way Stage22 source to normal App proof
on:
  push:
    branches: ['qa/stage22-literal-dag-threeway-20261120']
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
      - name: Pin untouched b812 and assemble exact A/B/C verified recipe
        run: |
          set -euo pipefail
          BASE=b81245966bc7f68b41ecc0581c82ab8b2e7d2714
          QA8=09b304f8b6ed30764718c1de50d53e762efd9124
          W="$RUNNER_TEMP/stage22-normal-app-threeway"
          mkdir -p "$W/out" "$W/setup" "$W/projection"
          printf 'QA=%s\nOUT=%s\n' "$W" "$W/out" >> "$GITHUB_ENV"
          git merge-base --is-ancestor "$QA8" HEAD
          git diff --name-status "$QA8" HEAD > "$W/out/qa-only-paths.txt"
          python - "$W/out/qa-only-paths.txt" <<'PY'
          import pathlib,sys
          got=set(pathlib.Path(sys.argv[1]).read_text().splitlines())
          e={'M\t.github/workflows/stage22-official-threeway.yml','M\ttools/stage13-18-proof/normal-product-qa/verify-build.py'}
          assert got==e,(got,e)
          PY
          git cat-file -e "$BASE^{commit}"
          Q="$GITHUB_WORKSPACE/tools/stage13-18-proof"
          for mode in stock joint metadata target; do git worktree add --detach "$W/$mode" "$BASE"; done
          echo "$BASE" > "$W/out/pinned.txt"
          test "$(git -C "$W/stock" rev-parse HEAD:shared/data/campaign.json)" = edaf31a5fda2b7db0202bc0efb52dd83e54f6b9e
          test "$(git -C "$W/stock" rev-parse HEAD:shared/data/act2/stage13-compact-package.json)" = 413a4615c3f323b9b8d5cd21f3d0e4c2ecc0680a
          test "$(git -C "$W/stock" rev-parse HEAD:tools/environment/stage22-vertical-art.mjs)" = 4348002cc3e0ee17d7f2ec1cd6e481a81cfc2558
          python "$Q/ci/verify.py" "$W/stock" "$W/joint" "$W/setup"
          python "$Q/ci/range.py" "$W/joint/shared/data/campaign.json" "$W/setup/typed-13.json"
          for p in shared/data/act2/stage18-compact-package.json tools/map-forge/stage18-short-quest.mjs; do cp "$W/joint/$p" "$W/metadata/$p"; done
          python "$Q/stage21-explicit-defaults/splice-stage21.py" joint-canonical "$W/joint/shared/data/campaign.json" "$W/metadata/shared/data/campaign.json" "$W/setup/typed-21.json"
          node "$Q/consolidated-qa/contract.mjs" metadata "$W/joint" "$W/metadata" "$W/out/exact-21.json" >"$W/metadata-contract.private" 2>&1 || { sha256sum "$W/metadata-contract.private" | cut -d' ' -f1 >"$W/out/metadata-contract-error.sha256"; exit 1; }
          for p in shared/data/act2/stage18-compact-package.json shared/data/campaign.json tools/map-forge/stage18-short-quest.mjs; do cp "$W/metadata/$p" "$W/target/$p"; done
          python "$Q/consolidated-qa/target.py" "$W/metadata" "$W/target" "$W/out/target-typed-sha.json"
          node "$Q/consolidated-qa/contract.mjs" stage22 "$W/metadata" "$W/target" "$W/out/exact-22.json" >"$W/target-contract.private" 2>&1 || { sha256sum "$W/target-contract.private" | cut -d' ' -f1 >"$W/out/target-contract-error.sha256"; exit 1; }
          for mode in stock metadata target; do
           git -C "$W/$mode" diff --name-only > "$W/out/$mode-changes.txt"
          done
          test ! -s "$W/out/stock-changes.txt"
          cmp "$W/out/metadata-changes.txt" <(printf '%s\n' shared/data/act2/stage18-compact-package.json shared/data/campaign.json tools/map-forge/stage18-short-quest.mjs)
          cmp "$W/out/target-changes.txt" <(printf '%s\n' shared/data/act2/stage18-compact-package.json shared/data/campaign.json tools/environment/stage22-vertical-art.mjs tools/map-forge/stage18-short-quest.mjs)
          test "$(git -C "$W/metadata" hash-object shared/data/campaign.json)" = 91a4ada62984145fdc2eda8fd612fe0bc19f0ad7
          test "$(git -C "$W/target" hash-object shared/data/campaign.json)" = 9f760cdcc0744b2c84d8fdcb480e7ce2f5069c7b
          J="$W/projection"; STOCK="$W/stock"
          cp "$STOCK/web/data/chapter-21.724a765a85d437a2.json" "$J/stage21-compiled.json"
          cp "$STOCK/web/runtime/ordered-common-2.49982d8a68cfa528.js" "$J/active-core.mjs"
          cp "$STOCK/shared/runtime/map-engine.js" "$J/"
          cp "$STOCK/shared/map/"{geometry,terrain-domain,environment,schema}.js "$J/"
          python "$Q/stage21-explicit-defaults/splice-stage21.py" published-compiled-fixture "$J/stage21-compiled.json" "$J/stage21-fixture-new.json" "$W/setup/typed-21-packet.json"
          node "$Q/stage21-explicit-defaults/runtime-projection.mjs" "$J" >"$W/out/stage21-projection.json" 2>"$W/projection.private" || { sha256sum "$W/projection.private" | cut -d' ' -f1 >"$W/out/projection-error.sha256"; exit 1; }
      - name: Unchanged canonical generation, official compact saves and release guards then normal build
        run: |
          set -euo pipefail
          for mode in stock metadata target; do
           cd "$QA/$mode"
           npm ci; npm ci --prefix game
           npm run test:release-guard > "$OUT/release-$mode.txt" 2>&1
           node tests/act2-compact-save.mjs 18 > "$OUT/compact18-$mode.txt" 2>&1
           if [ "$mode" != stock ]; then
            set +e
            node tests/stage22-vertical-regeneration.mjs > "$QA/regenerate-$mode.private" 2>&1
            rc=$?
            set -e
            echo "$rc" > "$OUT/regenerate-$mode.exit"
            sha256sum "$QA/regenerate-$mode.private" | cut -d' ' -f1 > "$OUT/regenerate-$mode.sha256"
            test "$rc" = 0
            cp _local/reports/vertical-stages/stage22-regeneration.json "$OUT/regenerate-$mode.json"
           fi
           npm run build > "$OUT/build-$mode.txt" 2>&1
          done
      - name: Inspect independently built packets, active libraries and protected module identities
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/tools/stage13-18-proof/normal-product-qa"
          set +e
          python "$P/verify-build.py" "$QA/stock" "$QA/metadata" "$QA/target" "$QA/setup" >"$QA/verify-dag.private" 2>&1
          rc=$?
          set -e
          if [ -r "$QA/setup/build-dag-diff.json" ]; then cp "$QA/setup/build-dag-diff.json" "$OUT/"; fi
          echo "$rc" > "$OUT/build-dag.exit"
          sha256sum "$QA/verify-dag.private" | cut -d' ' -f1 > "$OUT/build-dag-private-log.sha256"
          if [ "$rc" -ne 0 ]; then
           # Record only assertion type and line of the observer, never its payload.
           grep -E 'verify-build\.py", line [0-9]+|^AssertionError' "$QA/verify-dag.private" | sed -E 's/^(AssertionError):.*/\1/' | cut -c1-160 | tail -8 | sed "s@$GITHUB_WORKSPACE/@@g" >"$OUT/build-dag-observer-signature.txt" || true
           exit "$rc"
          fi
          cp "$QA/setup/build-proof.json" "$OUT/"
      - name: Actual normal App desktop and portrait scenes and controls
        run: |
          set -euo pipefail
          pip install playwright pillow
          python -m playwright install --with-deps chromium
          P="$GITHUB_WORKSPACE/tools/stage13-18-proof"
          cleanup=()
          trap 'kill "${cleanup[@]}" 2>/dev/null || true' EXIT
          i=0; runs=()
          for mode in stock metadata target; do
           port=$((8884+i)); i=$((i+1))
           VARIANT=stock; if [ "$mode" = target ]; then VARIANT=candidate; fi
           mkdir -p "$OUT/$mode/domain" "$OUT/$mode/control"
           python -m http.server "$port" --bind 127.0.0.1 --directory "$QA/$mode" >"$QA/http-$mode.private" 2>&1 &
           cleanup+=("$!")
           (
            VARIANT="$VARIANT" PORT="$port" OUT="$OUT/$mode/domain" python "$P/normal-product-qa/capture22.py" >"$QA/domain-$mode.private" 2>&1 &&
            PORT="$port" OUT="$OUT/$mode/control" python "$P/ci/live.py" >"$QA/controls-$mode.private" 2>&1
           ) &
           runs+=("$!")
          done
          failed=0
          for pid in "${runs[@]}"; do wait "$pid" || failed=1; done
          for l in "$QA"/domain-*.private "$QA"/controls-*.private; do
           test ! -f "$l" || sha256sum "$l" | sed "s@$QA/@@g" >>"$OUT/browser-log-sha256.txt"
          done
          if [ "$failed" -ne 0 ]; then
           python - "$QA" "$OUT/browser-failure-signature.json" <<'PY'
          import sys,json,pathlib,re
          r=pathlib.Path(sys.argv[1]); output=[]
          for f in sorted([*r.glob('domain-*.private'),*r.glob('controls-*.private')]):
           for l in f.read_text(errors='replace').splitlines():
            if m:=re.search(r'(Error: (?:Expected|Both|Wrong|Unexpected|Natural|Image decode|[A-Za-z0-9 ]+not reached)[^{}\[\]]{0,100})',l):
             output.append([f.name,m.group(1)[:120]])
          pathlib.Path(sys.argv[2]).write_text(json.dumps(output[:12]))
          PY
           exit 1
          fi
          python "$P/normal-product-qa/compare-live.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage22-threeway-normal-app-proof-only
          path: ${{ env.OUT }}
          retention-days: 7
