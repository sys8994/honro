name: Task gate regression and production block
on:
  push:
    branches: ['work/task-gate-direct/**']
  pull_request:
permissions:
  contents: read
jobs:
  gate-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - run: npm ci && npm ci --prefix game
      - name: Queue, numeric gates and focused Act4 regressions
        run: |
          python tests/task-gate/test_queue.py
          python tests/task-gate/test_quality.py
          python tests/task-gate/test_adapters.py
          node --test tests/task-gate/observe-engine.mjs tests/task-gate/boarding-target.mjs
          node tests/task-gate/build-boundary.mjs
          node tests/act4-encounter-revision.mjs
          node tests/act4-pilot-combat.mjs
          node tests/act4-map-revision-rc.mjs
          node tests/act4-stage35-edge.mjs
          node tests/act4-event-geometry.mjs
          node tests/act4-stage35-blocked-shot.mjs
          node tests/act4-stage36-elite-reward.mjs
          node tests/act4-wreck-warning-response.mjs
          node tests/act4-wreck-presentation-candidate.mjs
          node tests/stage-clear-report-act4.mjs
      - name: Build isolated unapproved preview without touching public output
        run: |
          set -euo pipefail
          sha256sum HONRO.html web/manifest.json > /tmp/public-before.txt
          HONRO_ACT4_RELEASE=1 node workshop/build.mjs --preview gate-regression
          sha256sum -c /tmp/public-before.txt
          test -f _local/previews/gate-regression/HONRO.html
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: task-gate-regression-${{ github.sha }}
          path: |
            _local/quality-gate/
            _local/previews/gate-regression/_local/reports/web-split/build.json
          retention-days: 7
