name: Verify and assemble isolated Act 6 stage preview
on:
  push:
    branches: ['qa/act6-debug-stage-20261125']
    paths: ['.github/workflows/act6-debug-stage-candidate.yml']
permissions:
  contents: write
jobs:
  candidate:
    if: github.repository == 'sys8994/honro' && github.ref == 'refs/heads/qa/act6-debug-stage-20261125'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 2
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Build candidate without changing campaign data
        shell: bash
        run: |
          set -euo pipefail
          BASE=cee13d8db3bf9a6cc8bd3da834fbe97f5c82d3d4
          OUT="$RUNNER_TEMP/act6-debug-stage-candidate"
          mkdir -p "$OUT"
          echo "CANDIDATE_OUT=$OUT" >> "$GITHUB_ENV"
          git fetch --depth=1 origin "$BASE"
          test "$(git ls-remote origin refs/heads/master | cut -f1)" = "$BASE"
          readarray -t HISTORY < <(git show "$BASE:web/manifest.json" | node -e 'let x="";process.stdin.on("data",c=>x+=c);process.stdin.on("end",()=>console.log([...new Set(JSON.parse(x).publishedGenerations.map(r=>r.sourceSha))].join("\n")));')
          git fetch --depth=1 origin "${HISTORY[@]}"
          R="$(realpath "$(mktemp -d /tmp/honro-act6-web-qa-XXXXXXXX)")"
          echo "CANDIDATE_ROOT=$R" >> "$GITHUB_ENV"
          git worktree add --detach "$R" "$BASE"
          cd "$R"
          git checkout "$GITHUB_SHA" -- shared/act6-app-qa.mjs shared/web-build.mjs shared/act6-debug-stages
          node tools/release/retain-published-web.mjs "$BASE" --published-at 2026-11-25T03:52:00Z --evidence https://github.com/sys8994/honro/actions/runs/45542958921 > "$OUT/RETENTION.log" 2>&1
          npm ci --no-audit --no-fund > "$OUT/NPM.log" 2>&1
          npm ci --prefix game --include=dev --no-audit --no-fund > "$OUT/NPM-GAME.log" 2>&1
          npm run build > "$OUT/BUILD.log" 2>&1
          python - "$OUT" "$BASE" <<'PY'
          import sys,subprocess,json,re
          from pathlib import Path
          from hashlib import sha256
          o,b=Path(sys.argv[1]),sys.argv[2]
          before=json.loads(subprocess.check_output(['git','show',b+':web/manifest.json']))
          new_raw=Path('web/manifest.json').read_bytes()
          after=json.loads(new_raw)
          assert before['project']==after['project']
          def files(j):return {r['path']:r['sha256'] for r in j['files']}
          m1,m2=files(before),files(after)
          for prefix in ('act6-qa-chapter-','act6-terrain-art-','act6-ending-','journey-map-act6.'):
              assert {p:h for p,h in m1.items() if prefix in p}=={p:h for p,h in m2.items() if prefix in p},prefix
          for p,h in (m1|m2).items():assert sha256(Path(p).read_bytes()).hexdigest()==h,p
          assert any(r['sourceSha']==b for r in after['publishedGenerations'])
          left,right=[next(p for p in files(x) if 'ordered-game-24-normal51.' in p) for x in (before,after)]
          pin=lambda s:re.search(r'boundary:\{build:"([0-9a-f]{64})",owner:(\{[^}]+\}),layout:(\{.*?\}\})',s).group()
          assert pin(Path(left).read_text())==pin(Path(right).read_text()),'normal save signatures changed'
          assert after['gameEntry']!=before['gameEntry'] and after['gameEntry'] in Path('HONRO.html').read_text()
          assert sum('act6-debug-stages.' in p for p in m2)==1
          generated=sorted(set(m2)-set(m1))
          assert 3<=len(generated)<=12,generated
          (o/'MANIFEST.sha256').write_text(sha256(new_raw).hexdigest()+'\n')
          (o/'NEW.txt').write_text('\n'.join(generated)+'\n')
          PY
      - name: Verify ten chapters by trusted desktop and touch controls
        run: |
          set -euo pipefail
          python -m pip install 'playwright==1.58.0'
          python -m playwright install --with-deps chromium
          python tools/act6-debug-stages/browser.py "$CANDIDATE_ROOT" "$CANDIDATE_OUT" > "$CANDIDATE_OUT/PLAYWRIGHT.log" 2>&1
      - name: Assemble a pushable candidate with production files only
        run: |
          set -euo pipefail
          BASE=cee13d8db3bf9a6cc8bd3da834fbe97f5c82d3d4
          cd "$CANDIDATE_ROOT"
          readarray -t NEW < "$CANDIDATE_OUT/NEW.txt"
          git add -- HONRO.html HONRO_WORKSHOP.html index.html web/manifest.json "${NEW[@]}"
          ! git diff --cached --name-only | grep -E '^\.github/|^tools/'
          test -z "$(git diff --cached --diff-filter=D --name-only)"
          git diff --cached --name-only > "$CANDIDATE_OUT/PRODUCT-PATHS.txt"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' -c core.hooksPath=/dev/null commit -m 'fix(debug): support isolated Act 6 chapter previews'
          test "$(git rev-parse HEAD^)" = "$BASE"
          test "$(git -C "$GITHUB_WORKSPACE" ls-remote origin refs/heads/master | cut -f1)" = "$BASE"
          git -C "$GITHUB_WORKSPACE" push origin "$(git rev-parse HEAD)":refs/heads/release/act6-debug-stages-20261125
          git rev-parse HEAD > "$CANDIDATE_OUT/CANDIDATE.txt"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: act6-debug-stage-proof
          path: ${{ runner.temp }}/act6-debug-stage-candidate/
          retention-days: 7
