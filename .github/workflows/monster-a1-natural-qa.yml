name: Immutable A1 natural gameplay diagnostic
on:
  push:
    branches: ['work/monster-a1-natural-qa/**']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  natural-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: 22
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Preflight adapters and frozen inputs without a game rebuild
        run: |
          python -m py_compile tests/monster-natural-build.py tests/monster-natural-browser.py tools/monster-a1-qa/verify-candidate.py
          python tests/monster-natural-build.py
          node tests/monster-natural-preflight.mjs
      - name: Verify immutable candidate and existing genuine gate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/monster-a1-qa/verify-candidate.py
      - name: Install browser only, never rebuild or replay Stage31
        run: |
          python -m pip install 'playwright==1.58.0'
          python -m playwright install --with-deps chromium
      - name: Natural Stage5 and Stage8 start to terminal or bounded blocker
        run: |
          set -euo pipefail
          python -m http.server 8871 --bind 127.0.0.1 > _local/reports/monster-natural/server.log 2>&1 &
          server=$!; trap 'kill "$server" 2>/dev/null || true' EXIT
          sleep 2
          export HONRO_MONSTER_BASE_URL="$(cat _local/reports/monster-a1-visual-qa/base-url.txt)"
          timeout 180 env HONRO_NATURAL_PREFLIGHT=1 python tests/monster-natural-browser.py
          timeout 1500 python tests/monster-natural-browser.py
          git diff --exit-code -- HONRO.html HONRO_WORKSHOP.html index.html web tools/stage31/production-package.json
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: monster-a1-natural-${{ github.sha }}
          path: |
            _local/reports/monster-natural/
            _local/reports/monster-a1-visual-qa/
          retention-days: 7
