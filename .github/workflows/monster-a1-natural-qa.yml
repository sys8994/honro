name: Stage8 pending warning unpublished UI preview
on:
  push:
    branches: ['work/monster-a1-natural-qa/**']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  natural-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: 22
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Verify exact intermediate source and preflight every injected expression
        run: |
          python -m py_compile tests/monster-natural-build.py tests/monster-natural-browser.py tools/stage8-crow-qa/verify.py tools/stage8-crow-qa/analyze.py tools/stage8-crow-qa/reuse.py tests/monster-natural-wave-browser.py
          python tools/stage8-crow-qa/verify.py
          python tests/monster-natural-build.py
          node tests/monster-natural-preflight.mjs
          npm ci
          npm ci --prefix game
          node tests/stage8-late-crows.mjs
          node tests/stage8-crow-warning.mjs
      - name: Explicit unpublished UI capture build; final Stage31 gate remains pending
        env:
          HONRO_ACT4_RELEASE: '1'
        run: |
          set -euo pipefail
          node workshop/build.mjs | tee _local/reports/stage8-crow-qa/unpublished-preview-build.log
          python tools/stage8-crow-qa/verify.py --built
          git diff --exit-code -- shared tools/stage31/production-package.json
      - name: Verify genuine same-run R17 checkpoint archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/stage8-crow-qa/reuse.py
      - name: Install supported Chromium
        run: |
          python -m pip install 'playwright==1.58.0'
          python -m playwright install --with-deps chromium
      - name: Real-browser startup then bounded desktop and mobile warning branches
        run: |
          set -euo pipefail
          python -m http.server 8871 --bind 127.0.0.1 > _local/reports/monster-natural/server.log 2>&1 &
          server=$!; trap 'kill "$server" 2>/dev/null || true' EXIT
          sleep 2
          export HONRO_MONSTER_BASE_URL=http://127.0.0.1:8871
          export HONRO_NATURAL_REQUEST=_local/reports/stage8-crow-qa/request.json
          timeout 180 env HONRO_NATURAL_PREFLIGHT=1 python tests/monster-natural-browser.py
          timeout 600 python tests/monster-natural-wave-browser.py
          python tools/stage8-crow-qa/verify.py --built
          git diff --exit-code -- shared tools/stage31/production-package.json
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: stage8-crow-visibility-${{ github.sha }}
          path: |
            _local/reports/monster-natural/
            _local/reports/stage8-crow-qa/
            _local/reports/stage8-late-crows/
            _local/reports/stage8-crow-warning/
            _local/reports/stage8-crow-visibility/
          retention-days: 7
