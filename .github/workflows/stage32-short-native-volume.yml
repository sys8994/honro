name: Stage32 current apron join trial
on:
  push:
    branches: ['audit/stage32-short-native-volume-20261120']
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 0
      - name: Verify isolated candidate
        run: |
          git diff --name-only 1e043b09d4ce107e1d2dcf70fe2274dff7098476 HEAD > /tmp/changed
          if grep -vE '^(shared/act4-handoff-art.mjs|tools/stage32-short-native-volume/(capture|compare).mjs|.github/workflows/stage32-short-native-volume.yml)$' /tmp/changed; then exit 1; fi
          git merge-base --is-ancestor 1e043b09d4ce107e1d2dcf70fe2274dff7098476 HEAD
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci && npm ci --prefix game
      - name: Render pinned before then candidate with identical cameras
        run: |
          mkdir -p /tmp/stage32-apron-evidence/{before,after}
          git show 1e043b09d4ce107e1d2dcf70fe2274dff7098476:shared/act4-handoff-art.mjs > shared/act4-handoff-art.mjs
          HONRO_NATIVE_OUT=/tmp/stage32-apron-evidence/before node --expose-gc tools/stage32-short-native-volume/capture.mjs 32
          HONRO_APRON_PROBE=1 HONRO_NATIVE_OUT=/tmp/stage32-apron-evidence/after node --expose-gc tools/stage32-short-native-volume/capture.mjs 32
          node tools/stage32-short-native-volume/compare.mjs /tmp/stage32-apron-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage32-short-native-volume
          path: /tmp/stage32-apron-evidence
