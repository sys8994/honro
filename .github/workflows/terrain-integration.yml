name: Verify combined terrain 33 34 37 38
on:
  push:
    branches: ['integrate/terrain-33-34-37-38-20261117']
permissions:
  contents: read
jobs:
  stage33:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci && npm ci --prefix game
      - name: Stage33 preservation and bounded compositor contracts
        run: node tests/stage33-exterior-test.mjs
      - name: Generate isolated official Scene A/B fixtures
        if: ${{ !cancelled() }}
        run: HONRO_ACT4_RELEASE=1 node tests/stage33-tide-browser-fixture.mjs "$RUNNER_TEMP/s33-fixtures"
      - name: Render both variants in fresh temporary Chrome profiles
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          browser=$(command -v google-chrome || command -v chromium)
          for variant in baseline candidate; do
            for view in rising-landscape high-landscape high-portrait; do
              name="stage33-$variant-$view"
              timeout 300s "$browser" --headless --no-first-run --no-default-browser-check --force-device-scale-factor=1 --virtual-time-budget=60000 --user-data-dir="$RUNNER_TEMP/profile-$name" --dump-dom "file://$RUNNER_TEMP/s33-fixtures/$name.html" > "$RUNNER_TEMP/$name.html"
              node tests/stage33-tide-browser-result.mjs "$RUNNER_TEMP/$name.html" "$RUNNER_TEMP/s33-evidence" "$variant" "$view"
            done
          done
      - name: Compare identical physics and forbid candidate fallback
        if: ${{ !cancelled() }}
        run: node tests/stage33-tide-browser-compare.mjs "$RUNNER_TEMP/s33-evidence"
      - name: Official Act4 build
        if: ${{ !cancelled() }}
        run: HONRO_ACT4_RELEASE=1 npm run build
      - name: Require exact independently reviewed candidate pixels
        run: node tests/terrain-integration-pngs.mjs 33 "$RUNNER_TEMP/s33-evidence"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: stage33-tide-chrome
          path: ${{ runner.temp }}/s33-evidence
          if-no-files-found: error
  stage34:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci && npm ci --prefix game
      - run: HONRO_ACT4_RELEASE=1 node tests/stage34-edge-contract.mjs
      - run: HONRO_ACT4_RELEASE=1 node tests/stage34-edge-browser-fixture.mjs "$RUNNER_TEMP/fixtures"
      - name: Actual Chrome three-viewport A/B
        shell: bash
        run: |
          browser=$(command -v google-chrome || command -v chromium)
          for variant in baseline candidate; do
            for view in desktop portrait landscape; do
              name="$variant-$view"
              timeout 300s "$browser" --headless --no-first-run --no-default-browser-check --force-device-scale-factor=1 --virtual-time-budget=60000 --user-data-dir="$RUNNER_TEMP/profile-$name" --dump-dom "file://$RUNNER_TEMP/fixtures/stage34-$name.html" > "$RUNNER_TEMP/$name.html"
              node tests/stage34-edge-browser-result.mjs "$RUNNER_TEMP/$name.html" "$RUNNER_TEMP/evidence" "$variant" "$view"
            done
          done
      - name: Strict source and non-edge pixel preservation
        run: node tests/stage34-edge-browser-compare.mjs "$RUNNER_TEMP/evidence"
      - name: Official Act4 build
        run: HONRO_ACT4_RELEASE=1 npm run build
      - name: Require exact independently reviewed candidate pixels
        run: node tests/terrain-integration-pngs.mjs 34 "$RUNNER_TEMP/evidence"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: stage34-edge-snap
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
  stage37:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci && npm ci --prefix game
      - run: HONRO_ACT4_RELEASE=1 node tests/stage37-alpha-edge-contract.mjs
      - run: HONRO_ACT4_RELEASE=1 node tests/stage37-multiview-fixture.mjs "$RUNNER_TEMP/fixtures"
      - name: Render original and diagnostic-only layer isolates
        shell: bash
        run: |
          browser=$(command -v google-chrome || command -v chromium)
          for view in desktop landscape portrait; do
          for variant in baseline single-clip; do
            timeout 300s "$browser" --headless --no-first-run --no-default-browser-check --force-device-scale-factor=1 --virtual-time-budget=60000 --user-data-dir="$RUNNER_TEMP/profile-$variant-$view" --dump-dom "file://$RUNNER_TEMP/fixtures/stage37-$variant-$view.html" > "$RUNNER_TEMP/$variant-$view.html"
            node tests/stage37-multiview-result.mjs "$RUNNER_TEMP/$variant-$view.html" "$RUNNER_TEMP/evidence" 37 "$variant" "$view"
          done
          done
      - name: Assert diagnostic physics and unchanged baseline
        run: node tests/stage37-multiview-compare.mjs "$RUNNER_TEMP/evidence"
      - name: Build official Act4 production
        run: HONRO_ACT4_RELEASE=1 npm run build
      - name: Require exact independently reviewed candidate pixels
        run: node tests/terrain-integration-pngs.mjs 37 "$RUNNER_TEMP/evidence"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: combined-terrain-stage37
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
  stage38:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci && npm ci --prefix game
      - run: HONRO_ACT4_RELEASE=1 node tests/stage38-alpha-edge-contract.mjs
      - run: HONRO_ACT4_RELEASE=1 node tests/stage38-multiview-fixture.mjs "$RUNNER_TEMP/fixtures"
      - name: Render original and diagnostic-only layer isolates
        shell: bash
        run: |
          browser=$(command -v google-chrome || command -v chromium)
          for view in desktop landscape portrait; do
          for variant in baseline single-clip; do
            timeout 300s "$browser" --headless --no-first-run --no-default-browser-check --force-device-scale-factor=1 --virtual-time-budget=60000 --user-data-dir="$RUNNER_TEMP/profile-$variant-$view" --dump-dom "file://$RUNNER_TEMP/fixtures/stage38-$variant-$view.html" > "$RUNNER_TEMP/$variant-$view.html"
            node tests/stage38-multiview-result.mjs "$RUNNER_TEMP/$variant-$view.html" "$RUNNER_TEMP/evidence" 38 "$variant" "$view"
          done
          done
      - name: Assert diagnostic physics and unchanged baseline
        run: node tests/stage38-multiview-compare.mjs "$RUNNER_TEMP/evidence"
      - name: Build official Act4 production
        run: HONRO_ACT4_RELEASE=1 npm run build
      - name: Require exact independently reviewed candidate pixels
        run: node tests/terrain-integration-pngs.mjs 38 "$RUNNER_TEMP/evidence"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: combined-terrain-stage38
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
