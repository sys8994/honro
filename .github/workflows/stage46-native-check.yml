name: Verify Stage46 native continuity candidate
on:
  push:
    branches: ['art/stage46-resume-master']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HONRO_ACT4_RELEASE: '1'
      HONRO_ACT5_RELEASE: '1'
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install locked dependencies
        run: |
          npm ci
          npm ci --prefix game
          node tools/act4-source/world-source.mjs materialize
      - name: Native budgets, authored input preservation and renderer regressions
        run: |
          node tests/stage46-continuity.mjs
          node tests/stage46-composite-parts.mjs
          node tests/stage45-continuity.mjs
          node tests/stage43-native-continuity.mjs
          node tests/stage43-contact-postclip.mjs
          node tests/act5-terrain-contact.mjs
          node tests/web-build-retention.mjs
      - name: Rebuild verification only, no publication mutation
        run: |
          npm run build
          sha256sum HONRO.html web/manifest.json
