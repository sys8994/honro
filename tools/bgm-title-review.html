<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>혼로 · 길 위의 음악</title><style>*{box-sizing:border-box}body{margin:0;background:#102025;color:#e5ddc9;font:16px/1.7 system-ui,sans-serif}main{max-width:950px;margin:auto;padding:40px 20px}h1{font-size:34px}h2{margin:8px 0;font-size:26px}header{margin-bottom:28px}section{border-top:1px solid #536761;padding:25px 0}small{color:#c7b780}audio{display:block;width:min(100%,550px);margin:16px 0}a{color:#d5c897}a:focus-visible{outline:2px solid #e8c677;outline-offset:4px}</style><main><header><h1>혼로 · 길 위의 음악</h1><p>현재 첨부 7곡입니다. 재생 버튼을 누르면 해당 곡만 불러옵니다.</p><a href="../game/docs/BGM_TITLE_REVIEW.md">곡 목록과 확인 범위</a></header></main><script>
(async()=>{const response=await fetch('../shared/data/bgm.json');if(!response.ok)throw Error('곡 목록을 불러오지 못했습니다.');const tracks=await response.json();for(const [i,t] of tracks.entries()){
 const s=document.createElement('section'),role=document.createElement('small'),h=document.createElement('h2'),a=document.createElement('audio'),link=document.createElement('a');
 role.textContent=i===0?'메인 / 쉼터':i<=3?'1막 · 3막 전투':'2막 전투';h.textContent=t.title;a.controls=true;a.preload='none';a.src='../assets/bgm/'+t.file;a.setAttribute('aria-label',t.title);a.dataset.track=t.id;link.href=a.src;link.textContent='원곡 파일 열기';
 a.addEventListener('play',()=>{for(const other of document.querySelectorAll('audio'))if(other!==a)other.pause();});s.append(role,h,a,link);document.querySelector('main').append(s);
}})().catch(e=>{document.querySelector('header p').textContent=e.message;});
</script></html>
