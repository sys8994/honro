<!doctype html><meta charset="utf-8"><title>Canonical build browser verification</title>
<style>body{margin:0;background:#10202c;color:#eee;font:13px sans-serif}header{padding:8px;display:flex;gap:8px}button{padding:8px}iframe{width:100%;height:calc(100vh - 52px);border:0}pre{white-space:pre-wrap}</style>
<header><button id="seed">실제 40장 완료 저장 불러오기</button><button id="open">정식 게임 문서 열기</button><button id="observe">현재 상태 관찰</button><span id="status">검수 전용 새 출처 · 배포 아님</span></header><div id="host"></div><pre id="observation" hidden></pre>
<script>
const $=id=>document.getElementById(id);let frame;const key='honro-first-act-profile-1';
$('seed').onclick=async()=>{const j=await(await fetch('./terminal-storage.json')).json(); if(localStorage.getItem(key)!==null){$('status').textContent='이미 저장 있음: 덮어쓰지 않음';return;}for(const[k,v]of Object.entries(j))localStorage.setItem(k,v);$('status').textContent='실제 완료 저장 원문 설정됨';};
$('open').onclick=()=>{if(frame){$('status').textContent='문서 이미 열림';return;}frame=document.createElement('iframe');frame.src='/HONRO.html';frame.title='정식 혼로';frame.allow='autoplay; fullscreen';$('host').append(frame);};
$('observe').onclick=()=>{const w=frame?.contentWindow,a=w?.HonroApp,s=a?.scene,b=a?.engine?.b,p=a?.profile;const row={at:new Date().toISOString(),url:frame?.src,app:!!a,screen:a?.screen,stageId:a?.stageId,custom:!!a?.customMap,debug:!!a?.debugMode,training:!!a?.training,lastError:String(a?.lastError||''),crash:!!a?.crashShown,dialogue:!!a?.dialogue,modal:a?.modalKind,profile:p&&{lastStage:p.lastStage,clearedAct4:Object.keys(p.cleared||{}).filter(x=>+x>=31&&+x<=40),hasBattle:!!p.honroBattle,act4:p.honroAct4},battle:b&&{stage:b.honroStage,phase:b.phase,round:b.round,active:b.active,units:b.units.map(u=>({id:u.id,side:u.side,x:u.x,y:u.y,hp:u.hp,dead:u.dead}))},camera:s&&{x:s.x,y:s.y,scale:s.scale,manual:s.manual,canvas:{width:s.canvas?.width,height:s.canvas?.height}},storage:{bytes:(localStorage.getItem(key)||'').length},loadedResources:w.performance.getEntriesByType('resource').map(x=>x.name)};const text=JSON.stringify(row,null,2);$('observation').textContent=text;$('status').textContent='관찰 기록됨 · '+(a?.screen||'앱 없음')+' · '+(a?.stageId||'');};
</script>
