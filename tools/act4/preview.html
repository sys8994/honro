<!doctype html><html lang="ko"><meta charset="utf-8"><title>HONRO Act4 terrain review</title>
<style>html,body{margin:0;background:#182832;color:#cddbe0;font:14px sans-serif}nav{min-height:40px;flex-wrap:wrap;display:flex;align-items:center;gap:14px;padding:0 12px}button{background:#435f6d;color:white;border:0;padding:6px 14px}iframe{border:0;width:100%;height:calc(100vh - 140px)}</style>
<style>#preview-proof-status{display:block;font-size:11px;color:#e4c4a0;max-width:380px}@media(max-width:700px){nav{min-height:120px;flex-wrap:wrap;gap:4px;font-size:12px}nav span{display:none}button{padding:6px 10px}iframe{height:calc(100vh - 80px)}}</style>
<nav>4막 지형 검수 · 미출시 <button data-stage="31">31 하구</button><button data-stage="32">32 포구</button><button data-stage="33">33 갯길</button><button data-stage="34">34 절벽</button><button data-stage="35">35 대숲</button><button data-stage="36">36 폐촌</button><button data-stage="37">37 운송길</button><button data-stage="38">38 해식굴</button><button data-stage="39">39 구조</button><button data-stage="40">40 귀환</button><button id="save">저장</button><button id="resume">이어하기</button><button id="restart">재시작</button><button id="interact">상호작용</button><span id="preview-proof-status"></span><span>전투 예산: 기존 30장 · 저장 분리</span></nav>
<iframe src="../../HONRO.html" title="shared game runtime"></iframe>
<script>
const frame=document.querySelector('iframe');let loaded=false;
async function start(n){const w=frame.contentWindow;await w.HonroCampaignLoader.ensureStage(30);await w.HonroCampaignLoader.ensureStage(21);await w.HonroCampaignLoader.ensureStage(13);if(!loaded){const seeds=await Promise.all(['31-35-36','32-33-34-37','38-39-40'].map(async v=>(await w.fetch('game/docs/act4/dialogue-seeds-'+v+'-reviewed-final.json')).json()));w.HONRO_ACT4_PREVIEW_SEEDS={scenes:seeds.flatMap(v=>v.scenes),ui:seeds.flatMap(v=>v.ui)};for(const path of ['review-art.js','terrain-preview.js','coast-maps.js','coast-art.js','preview-events.js','coast-events.js','preview-lifecycle.js'])await new Promise((resolve,reject)=>{const s=w.document.createElement('script');s.src={"review-art.js": "shared/runtime/act4-art.js", "terrain-preview.js": "shared/runtime/act4-maps.js", "coast-maps.js": "shared/runtime/act4-coast-maps.js", "coast-art.js": "shared/runtime/act4-coast-art.js", "preview-events.js": "shared/runtime/act4-events.js", "coast-events.js": "shared/runtime/act4-coast-events.js"}[path]||'tools/act4/'+path;s.onload=resolve;s.onerror=reject;w.document.head.append(s);});loaded=true;}w.HonroAct4TerrainPreview.launch(n);}
setInterval(()=>{const n=document.querySelector('#preview-proof-status');if(n)n.textContent=frame.contentWindow.HonroAct4TerrainPreview?.proofIssue?.()||'';},500);
frame.onload=()=>{const timer=setInterval(()=>{if(frame.contentWindow.HonroApp){clearInterval(timer);start(31);}},100);};
document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>start(+b.dataset.stage));document.querySelector('#interact').onclick=()=>frame.contentWindow.HonroAct4TerrainPreview?.interact();
document.querySelector('#save').onclick=()=>frame.contentWindow.HonroAct4TerrainPreview.save();document.querySelector('#resume').onclick=()=>frame.contentWindow.HonroAct4TerrainPreview.resume();document.querySelector('#restart').onclick=()=>frame.contentWindow.HonroAct4TerrainPreview.restart();
</script></html>
