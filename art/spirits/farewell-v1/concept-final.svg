<g font-family="Noto Sans CJK KR, sans-serif"><text x="74" y="180" fill="#eddfbe" font-size="24">가족 곁에서 떠나는 혼</text><text x="744" y="180" fill="#d4d8c6" font-size="24">종에 남은 혼</text>
<text x="76" y="691" fill="#dfd6bd" font-size="20">손을 놓고, 열린 길을 따라 한 번만 떠난다.</text><text x="76" y="724" fill="#aebeb2" font-size="16">발치의 그릇과 손의 동작을 읽을 수 있는 사람의 모습.</text>
<text x="746" y="691" fill="#d4d8c6" font-size="20">손은 길을 향하지만, 몸은 다른 쪽으로 밀린다.</text><text x="746" y="724" fill="#a5b9ad" font-size="16">서로 다른 방향의 중력. 문이 없는 곳을 가리키는 기억.</text>
<text x="57" y="817" fill="#8fa69e" font-size="16">비전투 · 체력바/조준표시 없음 · 과장된 얼굴/네온/미세 텍스처 없음 · 정적 시안이며 실제 게임 캡처가 아님</text></g></svg>