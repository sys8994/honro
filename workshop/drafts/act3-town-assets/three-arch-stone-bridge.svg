<title>Inactive draft: three-arch Korean granite bridge</title>
<desc>A nearly level deck and four simple stone support footprints surround three transparent water arches. Bridge deck top is minus two hundred sixty-four, foundations end at zero. No water or map collision is embedded.</desc>
