<svg xmlns="http://www.w3.org/2000/svg" viewBox="-750 -815 1500 825">
<title>Inactive draft: three-bay Korean archive cutaway</title>
<desc>Front wall removed. Three circulation levels at minus eighteen, minus two hundred thirty-four, and minus four hundred fifty. A wide central bay and right stair well remain transparent. Shelves hold anonymous bundles, not authored story records. Collision and stairs are authored separately by the map designer.</desc>
